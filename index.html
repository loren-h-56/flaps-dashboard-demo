   ============================================================ */
const tip = document.getElementById("tip");
function showTip(e, html){
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 10) + "px";
  tip.style.top  = Math.max(e.clientY - r.height - 12, 8) + "px";
}
const hideTip = () => tip.classList.remove("on");

function sparkline(d){
  const W=100, H=26, mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
  const pt = d.map((v,i)=>[i/(d.length-1)*W, H-(v-mn)/rg*(H-4)-2]);
  const path = pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const e = pt[pt.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${path} L${W} ${H} L0 ${H} Z" fill="var(--dv-1-soft)"/>
    <path d="${path}" fill="none" stroke="var(--dv-1)" stroke-width="1.6"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="2.4" fill="var(--dv-1)"
      stroke="var(--paper)" stroke-width="1.4"/></svg>`;
}

/* ============================================================
   圖表引擎 — ECharts（自 host：vendor/echarts.min.js，SVG renderer）
   主題不寫死：每次繪製從 CSS token 讀色 → light/dark、改 token 都自動跟上。
   手刻 SVG 時代的敘事細節，在此以 ECharts 手法對應保留：
     · 高亮柱 → per-item itemStyle 換色＋數值標籤
     · 參考線 → markLine   · 哨兵警示色（ci=9）→ per-item 換警示色
     · 甜甜圈中央數字 → title   · 柱圖 note 註記 → graphic text
   ============================================================ */
function dvTokens(){
  const s = getComputedStyle(document.documentElement), g = n => s.getPropertyValue(n).trim();
  return {
    dv:[g('--dv-1'),g('--dv-2'),g('--dv-3'),g('--dv-4'),g('--dv-5')],
    grid:g('--dv-grid'), tick:g('--text-muted'), body:g('--text-body'), soft:g('--accent-soft'),
    text:g('--text'), paper:g('--paper'), border:g('--border'), warn:g('--color-warning'),
    good:g('--color-success'), bad:g('--color-danger'),
    isDark: document.documentElement.getAttribute('data-theme')==='dark'
  };
}

/* c = M 裡的原生圖表物件（沿用既有 schema，不另立資料格式）→ ECharts option */
/* 漏斗流失欄（graphic）：第 2 層起，每個「步階」（層與層之間）標它較上一層的流失 %，
   貼著漏斗右緣、隨漏斗收窄往內移。位置用實際容器寬高 W/H 回推像素——
   · 垂直：步階＝下層頂邊（兩段間的縫）中心
   · 水平：ECharts 漏斗寬度映射 wf(v)=minSize+(1-minSize)·v/maxV（min=0、maxSize=100%、
     funnelAlign 置中、左右各留 6%），算出該步階右緣 x，再往外 8px 貼齊。
   不寫死尺寸；resize 後由 renderCharts 帶新 W/H 重呼叫。文字走設計規範 muted 色票、克制字重。 */
function funnelDrops(c, tk, H, W){
  const n=c.d.length, Hh=H||220, Ww=W||330, pad=8, gpx=3;
  const seg=(Hh-2*pad-(n-1)*gpx)/n, maxV=c.d[0][1], minSize=0.34, band=0.88*Ww, cx=0.5*Ww;
  const wf=v=> minSize+(1-minSize)*v/maxV, g=[];
  for(let i=1;i<n;i++){
    const d=Math.round((c.d[i-1][1]-c.d[i][1])/c.d[i-1][1]*100);
    const stepY=pad+i*seg+(i-1)*gpx+gpx/2, edgeX=cx+wf(c.d[i][1])*band/2;
    g.push({ type:'text', left:edgeX+8, top:stepY,
      style:{ text:'↓ '+d+'%', fill:tk.tick, fontSize:12, fontWeight:500,
        textAlign:'left', textVerticalAlign:'middle' } });
  }
  return g;
}

function buildOption(c, tk, H, W){
  const tip = { confine:true, textStyle:{fontSize:11,color:tk.body},
    backgroundColor:tk.paper, borderColor:tk.border, borderWidth:1,
    extraCssText:'border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:8px 11px;' };
  const axX = { axisLine:{show:false}, axisTick:{show:false}, axisLabel:{color:tk.tick,fontSize:11} };
  const axY = { splitLine:{lineStyle:{color:tk.grid,type:'dashed'}}, axisLine:{show:false},
    axisTick:{show:false}, axisLabel:{color:tk.tick,fontSize:11,formatter:v=>F(v)} };

  /* ── Line：多線；一律實線，以顏色（c 索引 palette）區分序列；缺值斷點不連
       c.mark（x 軸類別值）→ 垂直虛線標一個轉折點（如折扣甜蜜點）；c.note → 右上註記 ── */
  if(c.type==='line') return {
    animation:true,
    tooltip:{ trigger:'axis', ...tip, valueFormatter:v=> v==null?'—':F(v) },
    legend:{ show:false },                              /* 圖例走面板頁腳，避免重複 */
    grid:{ left:6, right:14, top: c.note?26:12, bottom:0, containLabel:true },
    xAxis:{ type:'category', data:c.x, boundaryGap:false, ...axX },
    yAxis:{ type:'value', ...axY },
    series: c.series.map((s,si)=>({
      name:s.n, type:'line', data:s.d, smooth:0.35, connectNulls:false,
      symbol:'circle', symbolSize:5,
      lineStyle:{ width:2.5, color:tk.dv[s.c], type:'solid' },
      itemStyle:{ color:tk.dv[s.c], borderColor:tk.paper, borderWidth:1.5 },
      markLine: (si===0 && c.mark!=null) ? { silent:true, symbol:'none',
        data:[{ xAxis:c.mark,
          label:{ show:!!c.markLabel, formatter:c.markLabel, position:'insideEndTop',
            color:tk.dv[2], fontSize:11, fontWeight:600 },
          lineStyle:{ color:tk.dv[2], type:'dashed', width:1.5 } }] } : undefined
    })),
    graphic: c.note?[{ type:'text', right:6, top:6,
      style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } }]:[]
  };

  /* ── Bar：直柱；c.hl 高亮換色＋值標籤；c.note 右上註記 ────────── */
  if(c.type==='bar'){
    const labels=c.d.map(x=>x[0]), vals=c.d.map(x=>x[1]);
    return {
      animation:true,
      tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, ...tip,
        valueFormatter:v=>F(v)+(c.unit||'') },
      grid:{ left:6, right:6, top: (c.note||c.labelAll)?26:12, bottom:0, containLabel:true },  /* 左右等寬 → 留白對稱 */
      xAxis:{ type:'category', data:labels, ...axX },
      yAxis:{ type:'value', ...axY,
        axisLabel: c.labelAll ? {show:false} : axY.axisLabel },  /* 值已標在柱上 → 藏 Y 軸刻度 */
      series:[{
        type:'bar', barMaxWidth:46,
        data: vals.map((v,i)=>({ value:v,
          itemStyle:{ color: c.multi?tk.dv[i%5]:(i===c.hl?tk.dv[2]:tk.dv[0]),
            opacity: i===c.hl?1:(c.multi?0.92:0.82), borderRadius:[4,4,0,0] },
          label: (i===c.hl||c.labelAll)?{ show:true, position:'top',
            color: i===c.hl?tk.dv[2]:tk.tick, fontSize:11, fontWeight:600,
            formatter:F(v)+(c.labelAll?(c.unit||''):'') }:{ show:false } }))
      }],
      graphic: c.note?[{ type:'text', right:6, top:6,
        style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } }]:[]
    };
  }

  /* ── Stackbar：單一 100% 堆疊橫條；每段＝一類別，段內標 %、圖例列名稱。
       適合「各部分佔整體幾成」的組成型資料（商品線貢獻/庫別分配）。 */
  if(c.type==='stackbar'){
    const total=c.d.reduce((s,x)=>s+x[1],0)||1;
    /* 標籤門檻要跟著版位寬度換算：同一個百分比在 cs:3 只有 cs:6 一半的像素。
       用實際可用寬度回推——「名稱 NN%」約需 58px、「NN%」約需 26px。 */
    const plotW=(c.cs||4)/12*1430-40;
    const needName=58/plotW*100, needPct=26/plotW*100;
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip,
        formatter:p=>`<b>${p.seriesName}</b> ${(p.value/total*100).toFixed(1)}% · ${F(p.value)}${c.unit||''}` },
      legend:{ data:c.d.map(x=>x[0]), bottom:2, left:'center', itemWidth:9, itemHeight:9,
        icon:'roundRect', itemGap:12, textStyle:{color:tk.body,fontSize:11} },
      grid:{ left:4, right:4, top:12, bottom:34, containLabel:false },
      xAxis:{ type:'value', max:total, show:false },
      yAxis:{ type:'category', data:[''], show:false },
      series: c.d.map((x,i)=>{
        const pct=x[1]/total*100;
        return { name:x[0], type:'bar', stack:'total', barWidth:90, data:[x[1]],
          itemStyle:{ color:tk.dv[i%5], borderColor:tk.paper, borderWidth:1.5 },
          label:{ show:true, position:'inside', color:'#fff', fontSize:11, fontWeight:600,
            formatter: pct>=needName ? `${x[0]} ${pct.toFixed(0)}%`
                     : (pct>=needPct ? `${pct.toFixed(0)}%` : '') } };
      })
    };
  }

  /* ── Hbar：橫排；ci 配色（ci=9 哨兵警示）；c.ref 參考線；末端值 ── */
  if(c.type==='hbar'){
    const rows=[...c.d].reverse();                      /* reverse → 第一名排最上 */
    const cc=[tk.dv[0],tk.dv[2],tk.dv[4]];
    const colAt=ci=> ci===9?tk.warn:(cc[ci]||tk.dv[0]);
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip, formatter:p=>{ const r=rows[p.dataIndex];
        return `<b>${r[0]}</b> ${F(r[1])}${c.unit||''}${r[2]===9?' — 系統斷層，非真實表現':''}`; } },
      grid:{ left:6, right:46, top: c.note?26:(c.ref?18:8), bottom:6, containLabel:true },
      xAxis:{ type:'value', max: Math.max(...c.d.map(x=>x[1]))*1.06,
        splitLine:{lineStyle:{color:tk.grid,type:'dashed'}}, axisLabel:{show:false},
        axisLine:{show:false}, axisTick:{show:false} },
      yAxis:{ type:'category', data:rows.map(r=>r[0]), axisLine:{show:false},
        axisTick:{show:false},
        axisLabel:{color:tk.body,fontSize:11,interval:0} },   /* interval:0 → 矮面板也不省略店櫃名 */
      series:[{
        type:'bar', barMaxWidth:18,
        data: rows.map(r=>({ value:r[1],
          itemStyle:{ color:colAt(r[2]), opacity:r[2]===9?0.85:0.9, borderRadius:[0,4,4,0] } })),
        label:{ show:true, position:'right', color:tk.text, fontSize:11, fontWeight:600,
          formatter:p=>F(rows[p.dataIndex][1])+(c.unit||'') },   /* 千分位：排行的 4,820 萬 */
        markLine: c.ref?{ silent:true, symbol:'none',
          lineStyle:{ color:tk.tick, type:'dashed', width:1 },
          label:{ show:true, position:'end', color:tk.tick, fontSize:10,
            formatter:c.ref+(c.unit||'') },
          data:[{ xAxis:c.ref }] }:undefined
      }],
      graphic: c.note?[{ type:'text', right:6, top:6,
        style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } }]:[]
    };
  }

  /* ── Donut：c.d=[名稱,金額]，%由金額自動算；tooltip 同時給 %與金額。
       c.half   → 半圓甜甜圈（幻影切片補滿下半圈、放大弧體，圖例走底部）。
       c.ci     → 逐片指定顏色（dv 索引；-1＝淡底，給「其餘/背景」那一片用）。 */
  if(c.type==='donut'){
    const half=c.half, total=c.d.reduce((s,x)=>s+x[1],0)||1;
    const colAt=i=> c.ci ? (c.ci[i]===-1 ? tk.soft : tk.dv[c.ci[i]]) : tk.dv[i%5];
    /* hover ＝**整片變色**（非只描外框）：淺色/亮色模式加深、暗色模式提亮。整片變深後與相鄰片
       形成對比邊界，分隔線自然回來，且是整片 highlight。放大照舊保留。 */
    const shade=(hex,f)=>{ const m=(hex||"").trim().match(/^#([0-9a-f]{6})$/i); if(!m) return hex;
      const n=parseInt(m[1],16), t=f<0?0:255, a=Math.abs(f), ch=v=>Math.round(v+(t-v)*a);
      return `rgb(${ch((n>>16)&255)},${ch((n>>8)&255)},${ch(n&255)})`; };
    const emphCol=col=> shade(col, tk.isDark ? 0.16 : -0.12);
    const data=c.d.map((x,i)=>{ const col=colAt(i);
      return { name:x[0], value:x[1], itemStyle:{color:col}, emphasis:{itemStyle:{color:emphCol(col)}} }; });
    if(half) data.push({ value:total, name:"", silent:true, label:{show:false},
      labelLine:{show:false}, tooltip:{show:false}, itemStyle:{color:"transparent"},
      emphasis:{scale:false} });
    /* 半圓位置一律用實際寬高像素算（resize 由 _donuts 帶新 W/H 重算）→ 任何螢幕都對齊、
       弧體隨面板高度長大又留邊。cx/cy＝弧心比例；Rout＝外徑 px；sideX＝弧右緣＋間距（圖例/cmp 落點）。 */
    /* 「弧＋右側圖例/數字」整塊水平置中：弧心 x＝W/2 − 半塊寬（塊＝弧直徑＋間距＋圖例約 72px）。 */
    const cy=0.82, Rout=0.75*Math.min(W,H),
          cxPx=Math.round(W/2 - 44),
          sideX=Math.round(cxPx+Rout+16), numX=Math.round(cxPx-26);
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip,
        formatter:p=> p.name?`<b>${p.name}</b> ${(p.value/total*100).toFixed(1)}% · ${F(p.value)}${c.unit||""}`:"" },
      /* 半圓版的留白平衡：弧體受「圖區高度」限制（矮面板只有 ~80px），寬度長不出去，
         若圓心仍固定 37%、圖例貼右緣，左邊會空一大塊。做法是把半徑推到高度容許的極限
         （180% ≒ 佔滿圖區高），再把「弧＋圖例」當一塊置中 → 左右留白才會相等。 */
      /* c.cmp ＝ 把「較某基準變化多少」升格成圖區裡的一組數字（比照半圓 KPI 卡的中欄），
         而不是埋在副標的小灰字裡。圖區只有 59px，弧體又佔掉左半，容不下「圖例＋數字」
         兩者並存 → 有 cmp 時圖例讓位。兩片式 donut 的色義在標題與副標已經講完，
         圖例的資訊量本來就低，但差異數字是老闆要看的。 */
      legend: c.cmp ? {show:false} : { data:c.d.map(x=>x[0]), itemWidth:9, itemHeight:9, icon:"roundRect",
        orient:"vertical", left: half?sideX:undefined, right: half?undefined:2, top:"middle", itemGap:11,
        textStyle:{color:tk.body,fontSize:11} },
      graphic: (()=>{ const G=[];
        /* c.big ＝ 弧心裡的主數字（比照半圓 KPI 卡）。放得進去的前提是把環變薄——
           見下方 radius：有 big 時內徑從 95% 拉到 125%，才挖得出容得下數字的洞。 */
        /* ⚠️ 不要用 textAlign:'center' 配 left ——graphic 的 left 定位的是元素邊界框，
           style 裡的 textAlign 又會把文字繞著 style.x 重畫，兩者打架會讓字跑到別的地方
           （曾經設 left:30% 卻畫到 77%、壓在弧體上）。直接算左上角座標最可靠。
           弧心在 x=30%、y=95%，環內徑 125%（約 37px）→ 字框置中於弧心正上方。 */
        /* 水平置中於弧心（center[0]＝30%）。textAlign:'center' 配 left 會被 ECharts
           重算到別處（實測 left:30%+center 會畫到右邊），所以直接算左上角：
           left ＝ 弧心% − 半個字寬%。實測 instW≈327、"35.4%"≈52px → 30 − 26/327 ≈ 22%。
           big 目前只有死貨佔比用、內容固定，故可寫定；換內容要重算。 */
        if(c.big) G.push({type:'text', left:numX, top:Math.round(cy*H-Rout*0.5),
          style:{ text:c.big, fill:tk.text, font:'600 17px sans-serif' }});
        if(c.cmp){ const m=c.cmp,
            good = m.goodWhenUp ? m.up : !m.up,
            col  = m.v===0 ? tk.tick : (good ? tk.good : tk.bad);
          G.push({type:'text', left:sideX, top:Math.round(cy*H-Rout*0.62), style:{ text:`${m.up?'↑':'↓'}${m.v} 百分點`,
            fill:col, font:'600 13px sans-serif' }},
            {type:'text', left:sideX, top:Math.round(cy*H-Rout*0.62+20), style:{ text:m.lab,
            fill:tk.tick, font:'11px sans-serif' }}); }
        return G; })(),
      series:[{ type:"pie",
        radius: half?[c.big?"115%":"90%","150%"]:["48%","68%"],
        center: half?[cxPx, Math.round(cy*H)]:["30%","50%"],
        startAngle: half?180:90,
        avoidLabelOverlap:true, label:{show:false}, labelLine:{show:false},
        itemStyle:{ borderRadius:3, borderWidth:2, borderColor:tk.paper },
        emphasis:{ scale:true, scaleSize:5 },   /* 整片變色的 itemStyle.color 掛在各 data 上（見 emphCol） */
        data }]
    };
  }

  /* ── Heatmap：二維交叉（如 星期 × 時段）;c.grid[y][x]，第一列 y 顯示在最上。
       c.xp → x 軸標籤前綴（業績的星期軸要「週一/週二」，其他軸留空）。
       c.vm:'bottom' → 色標改橫放在下（窄面板 cs:3 用，直立色標會吃掉 60px 寬）。 */
  if(c.type==='heatmap'){
    const data=[]; let maxV=0; const xp=c.xp||'';
    c.grid.forEach((row,yi)=>row.forEach((v,xi)=>{ data.push([xi,yi,v]); if(v>maxV)maxV=v; }));
    const ramp = tk.isDark ? [tk.grid, tk.dv[0], '#B9AEFF'] : ['#EEEEFC', tk.dv[0], '#2C1F8F'];
    return {
      animation:false,
      tooltip:{ ...tip,
        /* 懸浮窗偏移到游標右下、貼邊自動翻向 → 不遮住正在看的格子 */
        position:(pt,params,dom,rect,size)=>{
          let x=pt[0]+18, y=pt[1]+18;
          if(x+size.contentSize[0]>size.viewSize[0]) x=pt[0]-size.contentSize[0]-18;
          if(y+size.contentSize[1]>size.viewSize[1]) y=pt[1]-size.contentSize[1]-18;
          return [x,y];
        },
        formatter:p=>`${c.y[p.data[1]]}・${xp}${c.x[p.data[0]]}<br/><b>${F(p.data[2])}</b>${c.unit||''}` },
      grid:{ left:6, right: c.vm==='bottom'?8:60, top:3,
        bottom: c.vm==='bottom'?26:3, containLabel:true },
      xAxis:{ type:'category', data:c.x.map(d=>xp+d), splitArea:{show:true},
        axisLine:{show:false}, axisTick:{show:false},
        axisLabel:{color:tk.tick,fontSize:11,margin:8} },
      yAxis:{ type:'category', data:c.y, inverse:true, splitArea:{show:true},
        axisLine:{show:false}, axisTick:{show:false},
        axisLabel:{color:tk.tick,fontSize:11,interval:0} },   /* 五個時段標籤都要顯示 */
      visualMap: c.vm==='bottom'
        ? { min:0, max:maxV, calculable:false, orient:'horizontal', bottom:0, left:'center',
            itemWidth:9, itemHeight:64, text:['高','低'], textStyle:{color:tk.tick,fontSize:10},
            inRange:{ color:ramp } }
        : { min:0, max:maxV, calculable:false, orient:'vertical', right:2, top:'center',
            itemWidth:9, itemHeight:70, text:['高','低'], textStyle:{color:tk.tick,fontSize:10},
            inRange:{ color:ramp } },
      series:[{ type:'heatmap', data, itemStyle:{borderColor:tk.paper,borderWidth:2},
        emphasis:{itemStyle:{borderColor:tk.text,borderWidth:1}} }]
    };
  }

  /* ── Treemap：方塊面積＝貢獻;標籤＝名稱＋佔比%（商品線/倉別分配）───── */
  if(c.type==='treemap'){
    const total=c.d.reduce((s,x)=>s+x[1],0)||1;
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip,
        formatter:p=>`<b>${p.name}</b> ${F(p.value)}${c.unit||''}（${(p.value/total*100).toFixed(1)}%）` },
      series:[{ type:'treemap', roam:false, nodeClick:false, breadcrumb:{show:false},
        top:2, bottom:2, left:2, right:2, width:'auto', height:'auto',
        itemStyle:{ borderColor:tk.paper, borderWidth:2, gapWidth:2, borderRadius:3 },
        label:{ show:true, color:'#fff', fontSize:11, lineHeight:15,
          formatter:p=>p.name+'\n'+(p.value/total*100).toFixed(0)+'%' },
        data:c.d.map((x,i)=>({ name:x[0], value:x[1], itemStyle:{color:tk.dv[i%5]} })) }]
    };
  }

  /* ── Funnel：降序；iris 越往下越深。格子內只留「層名／人數」兩行（白字＋深色陰影
       確保壓在淺色頂層也讀得清）；逐層流失率移到兩側夾層當註記——內文不再擠第三個數字。
       tooltip 帶男女拆分（c.d 第三元素 [女,男]）。minSize 34%：底層容得下兩行標籤。 */
  if(c.type==='funnel'){
    const n=c.d.length;
    const drop=i=> i===0?null:Math.round((c.d[i-1][1]-c.d[i][1])/c.d[i-1][1]*100);
    const gn=i=> c.d[i][2];   /* [女, 男]，選配 */
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip, formatter:p=>{ const d=drop(p.dataIndex), g=gn(p.dataIndex);
        return `<b>${p.name}</b> ${F(p.value)} 人`
          + (g?`<br>女 ${F(g[0])} 人・男 ${F(g[1])} 人`:'')
          + (d===null?'':`<br>較上一層流失 ${d}%`); } },
      series:[{ type:'funnel', left:'6%', right:'6%', top:8, bottom:8, minSize:'34%',
        sort:'descending', gap:3,
        label:{ show:true, position:'inside', color:'#fff', fontSize:11.5, lineHeight:15,
          textShadowColor:'rgba(16,19,48,.32)', textShadowBlur:3,
          formatter:p=> p.name+'\n'+F(p.value) },
        labelLine:{show:false},
        data:c.d.map((x,i)=>({ name:x[0], value:x[1],
          itemStyle:{ color:tk.dv[0], opacity: n>1?(0.58+i*0.4/(n-1)):0.9 } })) }],
      graphic: funnelDrops(c, tk, H, W)
    };
  }

  /* ── Sankey：兩期之間的「流向」——誰升等、誰降等、誰掉出去。
       節點名一律寫成「期別·名稱」（如 去年·銀卡），因為 ECharts 用 name 當節點 id，
       兩側同名會被併成同一個節點、變成自環而整張圖畫不出來；標籤再切掉期別只顯示名稱。
       節點高度正比於人數，所以**餵進來的量級差距不能太大**：全會員（顧客卡 51 萬 vs
       鑽石卡 2,200，差 233 倍）畫出來鑽石卡會細到看不見——這也正是舊版那張柱狀圖壞掉的
       原因。要嘛限縮族群（本頁只畫銀卡以上），要嘛換圖型。 */
  if(c.type==='sankey'){
    const nm = s => String(s).split('·').pop();
    const col = n => n.tone==='bad' ? tk.bad : tk.dv[(n.c??0)%5];
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip, formatter:p => p.dataType==='edge'
        ? `${nm(p.data.source)} → <b>${nm(p.data.target)}</b><br>${F(p.value)} 人`
        : `<b>${nm(p.name)}</b> ${F(p.value)} 人` },
      series:[{ type:'sankey', left:6, right:6, top: (c.note||c.cols)?26:10, bottom:8,
        nodeWidth:10, nodeGap:9, nodeAlign:'justify',
        /* 標籤要分邊：全部預設靠右的話，最右那排會整片溢出面板外 */
        data: c.nodes.map(n=>({ name:n.n, depth:n.depth,
          itemStyle:{ color:col(n), borderWidth:0 },
          label:{ position: n.depth===0?'right':'left' } })),
        links: c.links.map(l=>({ source:l[0], target:l[1], value:l[2] })),
        label:{ color:tk.body, fontSize:10, formatter:p=>nm(p.name) },
        lineStyle:{ color:'gradient', opacity:.3, curveness:.5 },
        emphasis:{ focus:'adjacency' } }],
      /* c.cols=[左標,右標]：兩欄頂標，把「去年→今年」這條時間軸點破——沒有它，
         左邊多的「顧客卡升等」來源、右邊多的「降回顧客卡／休眠」去向會被誤讀成
         跟卡別同一類。用 muted 色、當軸標讀，不搶節點。 */
      graphic: (()=>{ const g=[];
        if(c.cols){
          g.push({ type:'text', left:6, top:6,
            style:{ text:c.cols[0], fill:tk.tick, font:'600 10px sans-serif' } });
          g.push({ type:'text', right:6, top:6,
            style:{ text:c.cols[1], fill:tk.tick, font:'600 10px sans-serif', textAlign:'right' } });
        }
        if(c.note) g.push({ type:'text', right:6, top:6,
          style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } });
        return g; })()
    };
  }

  /* ── Combo：柱（左軸，量體）＋ 線（右軸，比率）雙軸。
       給「量大不代表賺／量小卻貢獻高」這類「兩個單位不同但必須並看」的題目：
       卡別人數 vs 業績貢獻、檔期業績 vs 淨增量佔比。
       line.ref → 右軸畫一條基準虛線（如 0% 損益分界），線掉到線下＝壞消息。 */
  if(c.type==='combo'){
    const B=c.bar, L=c.line, bc=tk.dv[B.c??0], lc=tk.dv[L.c??2];
    return {
      animation:true,
      tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, ...tip,
        formatter:p=>`<b>${p[0].axisValue}</b><br>` + p.map(s=>
          `${s.marker}${s.seriesName} <b>${F(s.value)}</b>${s.seriesIndex===0?(B.unit||''):(L.unit||'')}`
        ).join('<br>') },
      legend:{ show:false },                            /* 圖例走面板頁腳 */
      grid:{ left:6, right:6, top: c.note?26:14, bottom:0, containLabel:true },
      xAxis:{ type:'category', data:c.x, ...axX,
        axisLabel:{ color:tk.tick, fontSize:10, interval:0 } },
      yAxis:[
        { type:'value', ...axY },                       /* 左：柱的量體 */
        { type:'value', ...axY, splitLine:{show:false}, /* 右：線的比率，不重複畫格線 */
          axisLabel:{ color:tk.tick, fontSize:11, formatter:v=>v+(L.unit||'') } }
      ],
      series:[
        { name:B.n, type:'bar', yAxisIndex:0, barMaxWidth:34, data:B.d,
          itemStyle:{ color:bc, opacity:0.78, borderRadius:[4,4,0,0] } },
        { name:L.n, type:'line', yAxisIndex:1, data:L.d, smooth:0.35, z:3,
          symbol:'circle', symbolSize:6,
          lineStyle:{ width:2.5, color:lc },
          itemStyle:{ color:lc, borderColor:tk.paper, borderWidth:1.5 },
          markLine: L.ref!=null ? { silent:true, symbol:'none',
            data:[{ yAxis:L.ref, label:{show:false},
              lineStyle:{ color:tk.tick, type:'dashed', width:1 } }] } : undefined }
      ],
      /* 靠左——combo 右側有第二條軸，右對齊的註記會壓在右軸刻度上（line/bar 沒有這個問題） */
      graphic: c.note?[{ type:'text', left:6, top:6,
        style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif' } }]:[]
    };
  }

  return { series:[] };                                 /* 未知型別 → 空 option */
}
const chList = c => `<div class="rows">` + c.d.map(([a,b,v])=>
  `<div class="r"><span class="nm">${a}${b?`<em>${b}</em>`:""}</span>
   <span class="val num">${v}</span></div>`).join("") + `</div>`;

/* Hero 達成率圓（KPI 引擎風格）：iris 進度弧 + 淡白軌，中央數字，caption 在下。
   三個橫排；每個都是獨立的完整物件（深色 hero scope 內）。 */
function gaugeRing(g){
  const S=76, c=S/2, sw=8, r=(S-sw)/2-2, circ=2*Math.PI*r;
  const pct=Math.max(0,Math.min(100,g.v)), dash=circ*pct/100;
  return `<div class="gauge">
    <svg class="gring" viewBox="0 0 ${S} ${S}" role="img" aria-label="${g.label} ${g.v}%">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="${sw}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}"
        transform="rotate(-90 ${c} ${c})"/>
      <text x="${c}" y="${c+1}" text-anchor="middle" class="g-num">${g.v}<tspan class="g-unit">%</tspan></text>
    </svg>
    <span class="g-cap">${g.label}</span>
  </div>`;
}

/* Gauge KPI 卡（大欄網格內，非 hero）：比率對 100% 目標的進度環 + 漲跌，取代數字+sparkline。
   給「離目標還差多少」型指標（達成率）——sparkline 對這種指標沒意義，環才講得清。 */
/* KPI 卡頁首：名稱＋狀態徽章（低於預期／⚠，靠左）＋深入分析 pill（靠右，margin-left:auto）。
   dig 文案為佔位（k.dig），與圖表一起待 golden 294 置換；沒 k.dig 時退回用卡名。 */
function khHTML(k){
  return `<div class="kh">
      <span class="k">${k.k}</span>
      ${k.sent?`<span class="warnicon" title="${k.sent}">${ic("alert","ic sm")}</span>`:""}
      ${k.t?`<span class="tag ${k.t[0]}">${k.t[1]}</span>`:""}
    </div>`;
}
function kpiGauge(k){
  const S=72, c=S/2, sw=8, r=(S-sw)/2-2, circ=2*Math.PI*r;
  const pct=Math.max(0,Math.min(100,parseFloat(k.v))), dash=circ*pct/100;
  const arrow = k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  return `<div class="kpi kpi-g${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="kg-body">
      <svg class="kg-ring" viewBox="0 0 ${S} ${S}" role="img" aria-label="${k.k} ${k.v}%">
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="${sw}"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${sw}"
          stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}"
          transform="rotate(-90 ${c} ${c})"/>
        <text x="${c}" y="${c+1}" text-anchor="middle" class="kg-num">${k.v}<tspan class="kg-unit">%</tspan></text>
      </svg>
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
    </div>
  </div>`;
}

/* to-target 進度條卡：大數字即達成率本身，分段條顯示離 100% 目標多遠（比 Gauge 更貼「差多少」）。 */
function kpiTarget(k){
  const pct=Math.max(0,Math.min(100,parseFloat(k.v))), N=24, on=Math.round(pct/100*N);
  const arrow=k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  const segs=Array.from({length:N},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
  return `<div class="kpi kpi-t${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <span class="v num">${k.v}<small>${k.u||"%"}</small></span>
    <div class="kt-bar" role="img" aria-label="${k.k} ${k.v}%">${segs}</div>
    <div class="foot">
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
      <span class="kt-tgt">目標 100%</span>
    </div>
  </div>`;
}
/* 近 N 月 mini 長條卡：大數字＋末柱高亮，看短期趨勢（連帶率 UPT 這類）。 */
function kpiMiniBars(k, ki){
  const arrow=k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  /* 長條走 ECharts（.plot.kmini），renderCharts 就地 init → 正式懸浮窗顯示每月值 */
  return `<div class="kpi kpi-mb${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <span class="v num">${k.v}<small>${k.u||""}</small></span>
    <div class="kt-mini"><div class="plot kmini" data-ki="${ki}"></div></div>
    <div class="foot">
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
    </div>
  </div>`;
}
/* 半圓甜甜圈組合卡：左＝當月比率半圓、中＝當月 vs 其他月均的 delta、右＝其他月均值。
   goodWhenUp 預設 false（如死貨佔比：上升＝壞→紅）。 */
/* 半圓 KPI 卡：當月與對照期各一條弧，同尺度並排。
   兩條弧的差距若只有幾 pt，在弧上不到 20 度、肉眼分不出來——所以當月弧上再刻一道
   對照期的虛線基準：差距讀成「弧端到刻度的那一小段」，不必比較兩張圖。 */
function kpiHalfDonut(k){
  const cur=parseFloat(k.cur), avg=parseFloat(k.avg);
  const delta=+(cur-avg).toFixed(1), good=k.goodWhenUp?delta>0:delta<0;
  const cls=delta===0?"m":(good?"u":"d");
  const arrow=delta>0?ic("up","ic sm"):delta<0?ic("down","ic sm"):ic("dash","ic sm");
  /* viewBox 上方留 18px 給基準線的標籤，所以 H 比半圓實際需要的高。 */
  const W=100,H=68,sw=9,r=38,cx=50,cy=62,semi=Math.PI*r;
  const path=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  const clamp=v=>Math.max(0,Math.min(100,v));

  /* 對照期基準線：一條跨過弧體、往外突出並帶標籤的徑向線。
     標籤是關鍵——先前只畫一道無標籤的短刻度，看不出那條線代表什麼。 */
  const refLine=pct=>{
    const th=Math.PI*(1-clamp(pct)/100), co=Math.cos(th), si=Math.sin(th);
    /* 外端多伸 7px 當延伸桿，標籤才連得回弧上那一點，不會像浮在空中的字 */
    const r0=r-sw/2-2, r1=r+sw/2+7;
    const px=(rr)=>(cx+rr*co).toFixed(1), py=(rr)=>(cy-rr*si).toFixed(1);
    const tx=Math.max(20,Math.min(W-20,+px(r1)));   /* 夾住標籤，避免貼近兩端時溢出 */
    return `<line x1="${px(r0)}" y1="${py(r0)}" x2="${px(r1)}" y2="${py(r1)}"
        stroke="var(--accent-2)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="${tx}" y="${(+py(r1)-3).toFixed(1)}" text-anchor="middle"
        class="hd-ref">${k.avgLab||"其他月均"}</text>`;
  };
  /* dim＝對照期那條弧，降透明度退到背景，當月仍是主角 */
  const ring=(val,lab,dim,ref)=>{
    const fill=semi*clamp(val)/100;
    return `<div class="hd-ring">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k.k} ${lab} ${val}%">
        <path d="${path}" fill="none" stroke="var(--accent-soft)" stroke-width="${sw}" stroke-linecap="round"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="${sw}" stroke-linecap="round"
          ${dim?'opacity=".45"':""} stroke-dasharray="${fill.toFixed(1)} ${(semi-fill).toFixed(1)}"/>
        ${ref!=null?refLine(ref):""}
        <text x="${cx}" y="${cy-7}" text-anchor="middle"
          class="hd-cur${dim?" dim":""}">${val}<tspan class="hd-u">%</tspan></text>
      </svg>
      <span class="hd-cap">${lab}</span>
    </div>`;
  };

  const avgLab=k.avgLab||"其他月均";
  return `<div class="kpi kpi-hd${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="hd-body">
      ${ring(cur, k.curLab||"當月", false, avg)}
      <div class="hd-mid">
        <span class="delta ${cls} num">${arrow}${Math.abs(delta)} 百分點</span>
        <span class="hd-cap">較${avgLab}</span>
      </div>
      ${ring(avg, avgLab, true, null)}
    </div>
  </div>`;
}
/* mini 長條卡的 ECharts option：月份為 x 軸、末柱高亮、hover 顯示月份+值。
   yAxis 下探壓低基準 → 放大高低差視覺。 */
function miniBarOption(k, tk){
  const n=k.bars.length, mn=Math.min(...k.bars), mx=Math.max(...k.bars), rg=(mx-mn)||1;
  return {
    animation:false,
    grid:{ left:2, right:2, top:6, bottom:16 },
    tooltip:{ trigger:"axis", axisPointer:{type:"shadow"}, confine:true,
      textStyle:{fontSize:11,color:tk.body}, backgroundColor:tk.paper,
      borderColor:tk.border, borderWidth:1,
      extraCssText:"border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:6px 9px;",
      formatter:p=>`${p[0].axisValue} <b>${p[0].value}</b>${k.u||""}` },
    xAxis:{ type:"category", data:k.bx||k.bars.map((_,i)=>i+1),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:tk.tick,fontSize:9,interval:0,margin:5} },
    yAxis:{ type:"value", show:false, min:mn-rg*0.8, max:mx+rg*0.15 },
    series:[{ type:"bar", barWidth:"58%",
      data:k.bars.map((v,i)=>({ value:v,
        itemStyle:{ color:tk.dv[0], opacity:i===n-1?1:0.32, borderRadius:[2,2,0,0] } })) }]
  };
}

/* mini 折線卡的 ECharts option：比率型「連續惡化」的趨勢（如年度流失率）。
   為什麼這類指標走線不走柱：截斷基準的長條會誇大量級——56.8→62.4 只差 5.6 個
   百分點，壓過基準後末柱卻是首柱的 ~2.2 倍，眼睛讀成「翻倍」。線編碼的是斜率／位置，
   本來就該配壓過的基準，一路往上的斜線才是訊息本身。y 軸上下各留 35% 全距當緩衝，
   線不會貼邊。共用 minibars 的卡殼與 .kmini 機制 → 保留逐月懸浮窗。 */
function miniLineOption(k, tk){
  const n=k.bars.length, mn=Math.min(...k.bars), mx=Math.max(...k.bars), rg=(mx-mn)||1;
  return {
    animation:false,
    grid:{ left:2, right:4, top:8, bottom:16 },
    tooltip:{ trigger:"axis", axisPointer:{type:"line",lineStyle:{color:tk.border}}, confine:true,
      textStyle:{fontSize:11,color:tk.body}, backgroundColor:tk.paper,
      borderColor:tk.border, borderWidth:1,
      extraCssText:"border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:6px 9px;",
      formatter:p=>`${p[0].axisValue} <b>${p[0].value}</b>${k.u||""}` },
    /* boundaryGap 留 true（預設）：首/末點才不會貼邊，"1月"/"6月" 標籤置中不被裁。 */
    xAxis:{ type:"category", data:k.bx||k.bars.map((_,i)=>i+1),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:tk.tick,fontSize:9,interval:0,margin:5} },
    yAxis:{ type:"value", show:false, min:mn-rg*0.35, max:mx+rg*0.35 },
    series:[{ type:"line", data:k.bars, smooth:false, showSymbol:true,
      lineStyle:{color:tk.dv[0],width:2},
      areaStyle:{color:tk.dv[0],opacity:0.10},
      symbol:"circle", symbolSize:(v,p)=>p.dataIndex===n-1?6:0,
      itemStyle:{color:tk.dv[0],borderColor:tk.paper,borderWidth:1.4},
      emphasis:{scale:false} }]
  };
}

/* Hero 摘要卡的一格：標籤在上、大數字在下（漲跌章 tone 決定好壞配色，摘要列預設不帶）。
   dual＝升/降兩個數字並列（升降級）。 */
function heroStat(s){
  if(s.dual) return `<div class="hstat">
    <span class="hl">${s.label}</span>
    <div class="hv-dual">
      <span class="up">${ic("up","ic sm")}${s.up}</span>
      <span class="down">${ic("down","ic sm")}${s.down}</span>
    </div>
  </div>`;
  const tri = s.arw==="u"?"triUp":s.arw==="d"?"triDown":null;
  const arrow = tri?`<svg class="tri" viewBox="0 0 24 24" aria-hidden="true">${P[tri]}</svg>`:"";
  const badge = s.note ? `<span class="hbadge ${s.tone||"flat"} num">${arrow}${s.note}</span>` : "";
  return `<div class="hstat">
    <span class="hl">${s.label}${s.per?`<span class="hper num">（${s.per}）</span>`:""}${s.partial?`<span class="hpart">進行中</span>`:""}</span>
    <div class="hrow"><span class="hv num">${s.v}${s.u?`<small>${s.u}</small>`:""}</span>${badge}</div>
    ${s.scope?`<span class="hscope num">${s.scope}${s.vper?`（${s.vper}）`:""}</span>`:""}
  </div>`;
}
/* 頂端混排派發：每項 t=ring→圓環（比率）、t=dual→升降雙值、其餘→數字格（絕對量）。 */
function heroItem(it){
  if(it.t === "ring") return gaugeRing(it);
  if(it.t === "dual") return heroStat({dual:true, up:it.up, down:it.down, label:it.label});
  return heroStat(it);
}
const renderHero = arr => arr.map(heroItem).join("");

/* ============================================================
   render
   ============================================================ */
const chEl    = document.getElementById("charts"),
      gaugesEl= document.getElementById("hero-gauges");

/* 依 12 欄網格模擬自動排版，回傳內容占用的「列數」（含 rs 跨列）。
   draw() 用它算 grid-template-rows —— 之後改 cs/rs 或增減張數都自動對。 */
function gridSpanRows(items, wOf){
  const cols = 12, occ = [];
  const ensure = r => { while(occ.length <= r) occ.push(new Array(cols).fill(false)); };
  for(const it of items){
    const w = Math.min(wOf(it), cols), h = it.rs || 1;
    let placed = false;
    for(let r = 0; !placed; r++){
      ensure(r + h - 1);
      for(let c = 0; c + w <= cols; c++){
        let ok = true;
        for(let dr = 0; dr < h && ok; dr++)
          for(let dc = 0; dc < w; dc++) if(occ[r+dr][c+dc]){ ok = false; break; }
        if(ok){
          for(let dr = 0; dr < h; dr++) for(let dc = 0; dc < w; dc++) occ[r+dr][c+dc] = true;
          placed = true; break;
        }
      }
    }
  }
  return occ.length;
}

/* 統一排版：KPI 卡與圖表同放一張網格。回傳每列的高度設定——
   只要該列含圖表就 1fr（圖需要高度），純 KPI 卡列則 auto（緊湊）。
   items: {cs, rs, chart:bool}，順序＝實際 innerHTML 流。 */
function placeRows(items){
  const cols = 12, occ = [], hasChart = [];
  const ensure = r => { while(occ.length <= r){ occ.push(new Array(cols).fill(false)); hasChart.push(false); } };
  for(const it of items){
    const w = Math.min(it.cs, cols), h = it.rs || 1;
    let placed = false;
    for(let r = 0; !placed; r++){
      ensure(r + h - 1);
      for(let c = 0; c + w <= cols; c++){
        let ok = true;
        for(let dr = 0; dr < h && ok; dr++)
          for(let dc = 0; dc < w; dc++) if(occ[r+dr][c+dc]){ ok = false; break; }
        if(ok){
          for(let dr = 0; dr < h; dr++){
            for(let dc = 0; dc < w; dc++) occ[r+dr][c+dc] = true;
            if(it.chart) hasChart[r+dr] = true;
          }
          placed = true; break;
        }
      }
    }
  }
  return hasChart.map(hc => hc ? "minmax(0,1fr)" : "auto");
}
let page = "業績";

document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => { page = b.dataset.p; draw(); }));

const stripTags = s => String(s).replace(/<[^>]+>/g, "");

/* 每張圖 = 一個 ECharts 實例，就地填進版位格（.plot flex:1，尺寸由格子決定）。
   重繪／切分頁前先 dispose 舊實例（否則實例累積吃記憶體）；尺寸變動只 resize，不重建。 */
let _charts = [], _funnels = [], _donuts = [];
function renderCharts(D){
  _charts.forEach(ch => ch.dispose()); _charts = []; _funnels = []; _donuts = [];
  const tk = dvTokens();
  chEl.querySelectorAll(".plot[data-i]").forEach(el => {
    const c = D.charts[+el.dataset.i];
    if(!c) return;
    const chart = echarts.init(el, null, { renderer:"svg" });
    chart.setOption(buildOption(c, tk, el.clientHeight, el.clientWidth));   /* 傳實際寬高：漏斗流失欄靠它貼齊各步階右緣 */
    _charts.push(chart);
    if(c.type==='funnel') _funnels.push({chart, el, c});   /* 漏斗流失欄是像素定位 → resize 要帶新高度重對齊 */
    if(c.type==='donut')  _donuts.push({chart, el, c});    /* 半圓的圖例/數字也是像素定位 → resize 要用新寬高重算 */
  });
  /* KPI 卡內的 mini 長條（連帶率 UPT 等）也走 ECharts → 有正式懸浮窗 */
  chEl.querySelectorAll(".plot.kmini[data-ki]").forEach(el => {
    const k = (D.kpi || [])[+el.dataset.ki];
    if(!k || !k.bars) return;
    const chart = echarts.init(el, null, { renderer:"svg" });
    chart.setOption(k.type === "miniline" ? miniLineOption(k, tk) : miniBarOption(k, tk));
    _charts.push(chart);
  });
}

/* 事件委派：重繪會換掉 .plot 內容，逐一綁 listener 會漏綁；
   tooltip 與「深入分析」統一掛在 chEl 上，一次搞定、重繪不受影響。 */
chEl.addEventListener("mousemove", e => {
  /* 挑圖模式下整張面板是一個可點的目標，資料點 tooltip 只會干擾 */
  if(document.body.classList.contains("picking")){ hideTip(); return; }
  const t = e.target.closest("[data-tip]");
  t ? showTip(e, t.dataset.tip) : hideTip();
});
chEl.addEventListener("mouseleave", hideTip);
chEl.addEventListener("click", e => {
  /* 〔深入分析〕＝開「選角度」開場：先讓使用者挑這張圖要看哪個角度，選了才成為第一則問句。
     第一個角度＝ c.dig／k.dig，其餘兩句由 DIG_MORE 補上，三句都是 golden 原句或其標記過的變體。 */
  const b = e.target.closest(".dig");
  if(b) openDig(page, b.dataset.c, [b.dataset.q, ...(DIG_MORE[b.dataset.c] || [])]);
});

/* 視窗/格子尺寸變動 → 只叫 ECharts resize（rAF 去抖，避免縮放時狂重算）。
   漏斗的流失欄是像素定位，高度一變就要用新 clientHeight 重算 graphic 才不會脫齊。 */
let _raf;
new ResizeObserver(() => {
  cancelAnimationFrame(_raf);
  _raf = requestAnimationFrame(() => {
    _charts.forEach(ch => ch.resize());
    if(_funnels.length || _donuts.length){ const tk = dvTokens();
      _funnels.forEach(f => f.chart.setOption({ graphic: funnelDrops(f.c, tk, f.el.clientHeight, f.el.clientWidth) }));
      /* 半圓：用新寬高整段重算（圖例位置＋中央數字＋弧半徑都依 W/H） */
      _donuts.forEach(f => f.chart.setOption(buildOption(f.c, tk, f.el.clientHeight, f.el.clientWidth), true)); }
  });
}).observe(chEl);

/* Hero 快捷發問：每個模組三句，全部取自 golden 294（見 chips_golden_mapping.xlsx「HERO」分頁）。
   選句原則是**補大欄圖表的盲區**——坪效、退貨、轉換率、在途到貨、優惠碼、點數這些
   畫面上沒有圖、但主管會問的角度。因此這 12 句多半落到 GENERIC（「新問題 · 完整推理」），
   那正是要示範的另一條路徑；「秒回凍結答案」交由後端檢索決定，前端不再為它挑句。 */
const QC = {
  業績:["我們坪效最高的是哪家店？","上個月退貨對業績影響有多大？","哪個通路轉換率最低？"],
  庫存:["上週進的貨到底有沒有全部到齊？","上禮拜缺貨造成多少訂單流失？","有哪些品項庫存數量跟系統對不起來？"],
  促銷:["網紅合作的優惠碼有哪些？轉換率表現有比較好嗎？","上次活動期間客訴有沒有增加？增加多少？","APP 會員用優惠碼的比例，比非會員高多少？"],
  CRM :["點數累積最多的前一百個會員都是誰？","我們官網 EC 的會員跟百貨專櫃的會員重疊有多少？","會員推薦朋友加入的機制，這半年帶進來多少新會員？"]
};
const qcEl = document.getElementById("qchips");
/* 事件掛在容器上，重繪不受影響（比照 chEl 的做法） */
qcEl.addEventListener("click", e => {
  if(picking()) return;                 /* 挑圖模式下 chips 停用（CSS 也 pointer-events:none，這是雙保險）*/
  const b = e.target.closest(".chip");
  if(b) open_(b.textContent.trim(), null);
});
/* 柔邊：淡出寬度＝離該側邊界的捲動距離，夾在 0–24px。
   ⚠️ 不要用「過門檻就切 0↔24px」——那會在邊界瞬間跳一下（滑動時遮罩閃動）。
   漸變版：滑到頭左側自然收成 0（第一顆完整顯示）、滑到底右側收成 0，中段才滿 24。 */
function updateQcFade(){
  const max = qcEl.scrollWidth - qcEl.clientWidth, x = qcEl.scrollLeft;
  qcEl.style.setProperty("--fadeL", Math.max(0, Math.min(24, x)) + "px");
  qcEl.style.setProperty("--fadeR", Math.max(0, Math.min(24, max - x)) + "px");
}
qcEl.addEventListener("scroll", updateQcFade);
addEventListener("resize", updateQcFade);
/* ⚠️ 初次 draw() 時字型可能還沒載入完，文字較窄、量不到溢出（fadeR 會誤判為 0）。
   字型 ready 與 load 後各重算一次。 */
addEventListener("load", updateQcFade);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateQcFade);

function draw(){
  document.querySelectorAll(".tab").forEach(b =>
    b.dataset.p === page ? b.setAttribute("aria-current","page")
                         : b.removeAttribute("aria-current"));
  qcEl.innerHTML = (QC[page] || [])
    .map(q => `<button class="chip" type="button">${q}</button>`).join("");
  qcEl.scrollLeft = 0; updateQcFade();     /* 換頁後回捲到頭並重算柔邊 */
  const D = M[page];

  /* 上方頂端區：單一 hero 陣列，圓環（比率）＋ 數字（絕對量）逐項混排。 */
  gaugesEl.className = "hero-gauges";
  gaugesEl.innerHTML = renderHero(D.hero);

  /* KPI 卡：併入下方 12 欄網格（每張 cs:3，四張排一列）。CRM 無 KPI 卡。
     type:"gauge" → 進度環卡（比率對目標）；其餘 → 數字＋漲跌＋sparkline。 */
  const kpiHTML = (D.kpi || []).map((k, ki) => {
    if(k.type === "gauge") return kpiGauge(k);
    if(k.type === "target") return kpiTarget(k);
    if(k.type === "minibars" || k.type === "miniline") return kpiMiniBars(k, ki);
    if(k.type === "halfdonut") return kpiHalfDonut(k);
    const arrow = k.dc === "u" ? ic("up","ic sm") : k.dc === "d" ? ic("down","ic sm") : ic("dash","ic sm");
    return `<div class="kpi${k.sent ? " sent" : ""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
      <div class="kh">
        <span class="k">${k.k}</span>
        ${k.sent ? `<span class="warnicon" title="${k.sent}">${ic("alert","ic sm")}</span>` : ""}
        <span class="tag ${k.t[0]}">${k.t[1]}</span>
      </div>
      <span class="v num">${k.v}<small>${k.u}</small></span>
      <div class="foot">
        ${k.sp ? `<span class="sp">${sparkline(k.sp)}</span>` : ""}
        <span class="delta ${k.dc} num">${arrow}${k.d}</span>
      </div>
    </div>`;
  }).join("");

  /* 版位：--cs（跨欄）/--rs（跨列）由資料宣告，未給預設 cs:4（1/3 寬）。
     圖表本體先留空（.plot），innerHTML 落定後由 renderCharts 用 ECharts 填入。 */
  const chartHTML = D.charts.map((c,i) => {
    const inner = c.type === "list" ? chList(c) : `<div class="plot" data-i="${i}"></div>`;
    /* 多序列圖的圖例統一走面板頁腳（ECharts 內建圖例關掉）→ 圖區高度全給資料 */
    const lgOf = arr => `<span class="legend">` + arr.map(s =>
      `<span class="lg"><i style="background:${DV[s.c]}"></i>${s.n}</span>`).join("") + `</span>`;
    const leg  = c.type === "line"  ? lgOf(c.series)
               : c.type === "combo" ? lgOf([{n:c.bar.n, c:c.bar.c ?? 0}, {n:c.line.n, c:c.line.c ?? 2}])
               : "";
    return `<section class="panel${c.warn ? " sent" : ""}${(c.cs || 4) >= 6 ? " wide" : ""}" data-type="${c.type}"
        style="--cs:${c.cs || 4};--rs:${c.rs || 1}">
      <div class="phd">
        <div>
          <div class="ph-t"><h3>${c.h}</h3>${c.warn ? `<button class="warnbtn" type="button" aria-label="資料哨兵"
            title="${attr(stripTags(c.warn))}">${ic("alert","ic sm")}</button>` : ""}</div>
          <p class="sub">${c.s}</p>
        </div>
        ${c.legTop ? leg : ""}
        ${c.blocked ? `<span class="blocked">上線前阻斷</span>` : ""}
      </div>
      ${inner}
      ${!c.legTop && leg ? `<div class="pft">${leg}</div>` : ""}
    </section>`;
  });                                       /* 陣列（不 join）→ 下面才能把 KPI 卡插進中間 */

  /* 版位順序＝網格 auto-flow 順序（誰先出現誰先佔格）。
     D.kpiAfter = 先排幾張圖，KPI 卡才插進來；預設 0＝KPI 卡在最前（業績／庫存）。
     促銷／CRM 設 1 → 主角大圖佔左上，KPI 卡退到右上角。 */
  const kAfter = D.kpiAfter || 0;
  chEl.innerHTML = chartHTML.slice(0, kAfter).join("")
                 + kpiHTML
                 + chartHTML.slice(kAfter).join("");

  /* 動態列高：KPI 卡與圖表同排一張網格，用 placeRows 統一推算每列高度——
     含圖表的列 1fr（均分剩餘高度）、純 KPI 卡列 auto（緊湊）。
     業績模組 KPI 卡與 各店櫃／通路 同列 → 該列含圖，卡片會被撐高。
     順序必須與上面的 innerHTML 一致（同樣照 kpiAfter 插入），否則列高會算到別列去。 */
  const chartItems = D.charts.map(c => ({ cs:c.cs || 4, rs:c.rs || 1, chart:true }));
  const layoutItems = [
    ...chartItems.slice(0, kAfter),
    ...(D.kpi || []).map(k => ({ cs:k.cs || 3, rs:k.rs || 1, chart:false })),
    ...chartItems.slice(kAfter)
  ];
  chEl.style.gridTemplateRows = placeRows(layoutItems).join(" ");

  renderCharts(D);
}

  const p = GOLDEN_POOL.slice();
  for(let i=p.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
  return p.slice(0, n);
}

/* ---- 回饋：讚/倒讚（答案品質訊號，與後端凍結判斷無關，見 CSS .fb 註解）---------
   讚＝靜默記錄；倒讚＝先記錄再開 drawer 內彈窗收原因（不因懶得補充而遺失負評）。

   真接後端時把 postFeedback 換成打 API；demo 只 console.log（比照 index.html）。 */
const _fb = {};        /* _fb[id] = {vote:'up'|'down', categories:[], detail}（本次 render 的 id 對照） */
const _turnObj = {};   /* id → thread 的 turn 物件；回饋要落在它上面才能跨「重開歷史」還原 */
let _fbId = null;      /* 目前彈窗對應的 turn id */
let _fbTimer = null;   /* 感謝畫面自動關閉計時 */
let _fbPrev = null;    /* 開倒讚彈窗前的評價：沒送出就關 → 還原它（不留孤兒 active） */
let _fbDone = false;   /* 這次彈窗是否已送出（送出才是真的倒讚，取消不算） */
let _fbMode = "down";  /* 'down'＝倒讚回饋（收評價）；'report'＝問題回報（不動評價，見錯誤卡）*/
function fbHTML(id, hidden){

       <button class="fbtn fb-up" type="button" title="有幫助" aria-pressed="false" aria-label="這則回答有幫助">${ic("thumbUp")}</button>

function wireFeedback(scope, id){
  const fb = scope.querySelector(`.fb[data-fb="${id}"]`); if(!fb) return;
  fb.querySelector(".fb-up").addEventListener("click", () => setVote(id, "up"));
  fb.querySelector(".fb-down").addEventListener("click", () => setVote(id, "down"));

}
function syncFb(id){
  const fb = db.querySelector(`.fb[data-fb="${id}"]`); if(!fb) return;
  const v = _fb[id] && _fb[id].vote;
  const up = fb.querySelector(".fb-up"), down = fb.querySelector(".fb-down");
  up.classList.toggle("on", v==="up");     up.setAttribute("aria-pressed", v==="up");
  down.classList.toggle("on", v==="down"); down.setAttribute("aria-pressed", v==="down");
}
function setVote(id, vote){
  const cur = _fb[id] && _fb[id].vote;
  if(cur === vote){ delete _fb[id]; persistFb(id); syncFb(id); return; }   /* 再點一次同一顆＝收回 */
  if(vote === "up"){ _fb[id] = {vote:"up"}; persistFb(id); syncFb(id); postFeedback(id); return; }
  /* 倒讚：先讓鈕亮起（視覺回饋），但**不落地**——要送出才算數。取消/關閉會還原成 _fbPrev。 */
  _fbPrev = _fb[id] || null;
  _fb[id] = {vote:"down", categories:[], detail:""}; syncFb(id); openFb(id);
}
function postFeedback(id){ console.log("[Feedback]", id, _fb[id]); }   /* 真接後端改打 API */
/* 把回饋寫回 thread 的 turn 物件——重開歷史時 turn 會拿到新 id，靠這份才還原得回來。 */
function persistFb(id){
  const t = _turnObj[id]; if(!t) return;
  if(_fb[id]) t.fb = {..._fb[id]}; else delete t.fb;
}
/* ---- 倒讚彈窗 ---- */
const fbOtherCb = document.getElementById("fbother-cb"),

/* ---- 打字機：逐字吐答案，讓輸出有「正在生成」的動態感 -----------------
   答案含行內標記（<em>/<b>/<br>），不能直接切字串（會切斷標籤）。先把 HTML 切成
   「一個完整標籤／實體」或「一個字」的 token，再逐 token 累加後重寫 innerHTML——
   標籤成對累加，瀏覽器每步都收得住。標籤不佔一拍（跟著前一個字一起吐），只有「字」推進節奏。 */
const TYPE_MS = 18;       /* 每一拍毫秒 */
function tokenizeHTML(html){
  const out=[]; let i=0;
  while(i<html.length){
    const c=html[i];
    if(c==='<'){ const j=html.indexOf('>',i), k=j<0?html.length-1:j; out.push(html.slice(i,k+1)); i=k+1; }
    else if(c==='&'){ const j=html.indexOf(';',i); if(j>-1 && j-i<=8){ out.push(html.slice(i,j+1)); i=j+1; } else { out.push(c); i++; } }
    else { out.push(c); i++; }
  }
  return out;
}
function typeInto(id, el, html, perTick, done){
  const toks = tokenizeHTML(html); let k=0, acc="";
  const eat=()=>{ while(k<toks.length && toks[k][0]==='<') acc+=toks[k++]; };  /* 標籤不佔拍 */
  eat();                                                    /* 先吐掉開頭的標籤 */
  el.innerHTML = acc + (k<toks.length ? '<i class="caret"></i>' : '');
  _type[id] = setInterval(()=>{
    if(!el.isConnected){ stopType(id); return; }            /* thread 被切走／關閉 → 收手 */
    for(let n=0; n<perTick && k<toks.length; n++){ acc+=toks[k++]; eat(); }
    const more = k<toks.length;
    el.innerHTML = acc + (more ? '<i class="caret"></i>' : '');
    db.scrollTop = db.scrollHeight;
    if(!more){ stopType(id); done && done(); }
  }, TYPE_MS);
}
/* animate＝現場新問（逐字吐）；false＝重開歷史／減量動畫（直接鋪、不重演）。 */
function revealAnswer(id, q, animate){
  stopThink(id);
  const turn = db.querySelector(`.turn[data-t="${id}"]`); if(!turn){ _setReplying(false); return; }
  const pend = turn.querySelector(`#pend-${id}`); if(!pend){ _setReplying(false); return; }
  if(_typed[id] && !_demo[id]){         /* 自由輸入且非 demo 故障 → 拒答卡（不鋪思考軌跡） */
    pend.outerHTML = noansHTML();
    wireReject(turn);
    delete _typed[id]; delete _elapsed[id]; delete _demo[id]; _setReplying(false);
    db.scrollTop = db.scrollHeight; return;
  }
  const trace = pend.querySelector(".trace");
  const hasTrace = trace && trace.querySelector(".tstep");
  let head = "";
  if(hasTrace){
    const secs = (_elapsed[id] || 0).toFixed(1);
    const n = trace.querySelectorAll(".tstep").length;
    head = `<div class="trace-wrap collapsed">
       <button class="trace-sum" type="button" aria-expanded="false">
         ${ic("chev","ic sm")}<span>已思考 ${secs} 秒 · ${n} 步</span></button>
       ${trace.outerHTML}</div>`;
  }
  const kind = _demo[id];
  if(kind){                             /* demo 故障/截斷：思考跑完後鋪對應卡，保留思考軌跡摘要 */
    pend.outerHTML = head + (kind==="timeout" ? timeoutHTML(id)
                          : kind==="fail"    ? failHTML(id)
                          : truncAnswerHTML());
    wireTraceSum(turn);
    if(kind!=="trunc") wireErrCard(turn, id, q);
    delete _typed[id]; delete _elapsed[id]; delete _demo[id]; _setReplying(false);
    db.scrollTop = db.scrollHeight; return;
  }
  const r = A[q] || GENERIC;
  const doType = animate && !reduced();
  pend.outerHTML = head + `<div class="a">
       <p class="av"></p>
       <p class="ab"></p>
       <div class="chips"${doType?" hidden":""}>${r.f.map(f=>`<button class="chip" type="button">${f}</button>`).join("")}</div>
       ${fbHTML(id, doType)}
     </div>`;
  turn.querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => {          /* 點一顆＝選定，整排追問移除，避免回頭重複選 */
      const q = b.textContent.trim(), row = b.closest(".chips");
      if(row) row.remove();
      ask(q, null);
    }));
  wireFeedback(turn, id);   /* 回饋鈕接線 ＋ 從 _fb[id] 還原讚/倒讚態（歷史重開會用到） */
  wireTraceSum(turn);
  const a = turn.querySelector(".a"),
        avEl = a.querySelector(".av"), abEl = a.querySelector(".ab"), chipsEl = a.querySelector(".chips"),
        fbEl = a.querySelector(".fb");
  if(doType){
    /* 結論句逐字吐 → 內文（快一點）→ 追問 chips ＋ 回饋列一起淡入；全程 _replyingId
       維持著，停止鈕在打字階段仍是「停止」，按下就留住已吐出的部分（見 stopReply）。 */
    typeInto(id, avEl, r.v, 1, () =>
      typeInto(id, abEl, r.b, 2, () => {
        chipsEl.hidden = false; chipsEl.classList.add("rin");
        if(fbEl){ fbEl.hidden = false; fbEl.classList.add("rin"); }
        db.scrollTop = db.scrollHeight; _setReplying(false);
      }));
  } else {
    avEl.innerHTML = r.v; abEl.innerHTML = r.b; _setReplying(false);
  }
  delete _typed[id];
  delete _elapsed[id];
  db.scrollTop = db.scrollHeight;
}
/* Claude 式軌跡：步驟逐條 append，前一條做完打勾留著，最後一條是動態。 */
function runThink(id, q, ctx){
  const pend = document.getElementById(`pend-${id}`); if(!pend) return;
  _setReplying(true, id);
  const steps = traceSteps(q, ctx);
  pend.innerHTML = `<div class="trace" id="trace-${id}"></div>`;
  const wrap = document.getElementById(`trace-${id}`);
  const t0 = performance.now();
  let si = -1, fi = 0;
  const frameTimer = setInterval(() => {
    if(!wrap.isConnected){ stopThink(id); return; }   /* thread 被切走／關閉 → 收手 */
    fi = (fi + 1) % LOGO_FRAMES.length;
    const p = wrap.querySelector(".tstep.active .tdot path"); if(p) p.setAttribute("d", LOGO_FRAMES[fi]);
  }, 280);
  const advance = () => {
    const cur = wrap.querySelector(".tstep.active");   /* 收掉上一條：打勾、轉灰 */
    if(cur){ cur.classList.replace("active","done");
      cur.querySelector(".tdot").innerHTML = ic("check","ic sm"); }
    si++;
    if(si >= steps.length){ _elapsed[id] = (performance.now() - t0) / 1000; revealAnswer(id, q, true); return; }
    const [tt, td] = steps[si];
    wrap.insertAdjacentHTML("beforeend",
      `<div class="tstep active"><span class="tdot">${logoSvg(fi)}</span>
         <span class="tlbl"><span class="tt">${tt}</span><span class="td">${td}</span></span></div>`);
    db.scrollTop = db.scrollHeight;
  };
  advance();                                            /* 第一條立刻出現 */
  const stepTimer = setInterval(advance, STEP_MS);
  _think[id] = {frameTimer, stepTimer};
}

/* 一輪：引用（可選）＋ 問 ＋ 答，append 而非覆寫。
   animate＝現場新問（先思考再出答案）；false＝重開歷史（直接鋪，不重演）。 */
function renderTurn(q, ctx, animate, typed, turnObj){
  const id = ++TURN_SEQ;
  _typed[id] = !!typed;
  if(typed) _demo[id] = classifyDemo(q);               /* demo：關鍵字模擬故障/截斷；''＝拒答 */
  _turnObj[id] = turnObj || null;                       /* 回饋落點：thread 的 turn 物件 */
  if(turnObj && turnObj.fb) _fb[id] = {...turnObj.fb};  /* 重開歷史：把上次的評價 hydrate 回來 */
  db.insertAdjacentHTML("beforeend",
    `<div class="turn" data-t="${id}">
       ${ctx ? ctxHTML(ctx) : ""}
       <p class="q">${q}</p>
       <div class="pend" id="pend-${id}"></div>
     </div>`);
  db.scrollTop = db.scrollHeight;
  /* 拒答直接鋪（沒在算就別演在算）；chip 問答與 demo 故障/截斷都先跑思考動畫（像真的查了才有結果/失敗）。 */
  if(animate && !reduced() && (!typed || _demo[id])) runThink(id, q, ctx);
  else revealAnswer(id, q, false);
}
/* 追加一輪到當前 thread；沒有當前 thread 就先開一串。typed＝非 chip 的自由輸入。 */
function ask(q, ctx, typed){
  if(!TH) startThread(q, ctx, typed);
  else { const t = {q,ctx,typed}; TH.turns.push(t); renderTurn(q, ctx, true, typed, t); }
}
/* 開新的一串（舊的先存進歷史） */
function startThread(q, ctx, typed){
  archive();
  TH = {title:q, turns:[{q,ctx,typed}]};
  dt.textContent = trim_(q);
  stopAllThink(); db.innerHTML = "";
  renderTurn(q, ctx, true, typed, TH.turns[0]);
  showDrawer();
}
/* 把當前 thread 收進側欄歷史（同一串重開再關不會重複堆） */
function archive(){
  if(!TH || !TH.turns.length) return;
  const i = HIST.indexOf(TH); if(i > -1) HIST.splice(i,1);
  HIST.unshift(TH); TH = null; renderHist();
}
function showDrawer(){
  /* 從「關著」變「開著」時才復位尺寸與位置——使用者拖過／拉過的版面只保留到關閉為止。
     ⚠️ 復位放在這裡而不是 close_()：close_ 當下抽屜還在淡出，那時復位會看到它彈回右側。
     抽屜「已經開著」時再開新的一串（點另一張圖的深入分析）不復位，
     否則正在對照看圖的版面會在眼前跳掉。 */
  if(!drawer.classList.contains("on")) resetDrawer();
  drawer.classList.add("on");
  drawer.setAttribute("aria-hidden","false");
  ci.focus();
}
/* 對外：Hero（askbar／快捷 chips）的入口。
   ⚠️ 抽屜**開著**＝延續當前同一串（ask append，同一視窗、同一紀錄）；
      抽屜**關著**＝開新的一串並展開。圖表〔深入分析〕走 openDig（先選角度）。 */
function open_(q, ctx, typed){
  if(drawer.classList.contains("on")) ask(q, ctx, typed);
  else startThread(q, ctx, typed);
}

/* ---- 深入分析：開「選角度」開場 -------------------------------------
   點圖表的〔深入分析〕不直接問一句，而是先在抽屜鋪一個開場：

function openDig(m, h, angles){
  /* 抽屜開著＝延續同串：把「選角度」接在當前對話尾端，選了角度就 append 成新一輪（引用該圖）。
     抽屜關著＝開新場：收掉舊串、清空、TH=null（選了角度才由 ask→startThread 起新串）。 */
  const append = drawer.classList.contains("on");
  if(!append){ archive(); TH = null; dt.textContent = "深入分析"; stopAllThink(); db.innerHTML = ""; }
  const chooser = document.createElement("div");
  chooser.className = "chooser";
  chooser.innerHTML = `${ctxHTML({m, h})}
       <p class="dig-prompt">這張圖你想從哪個角度看？</p>
       <div class="chips">${angles.map(a => `<button class="chip" type="button">${a}</button>`).join("")}</div>`;
  db.appendChild(chooser);
  chooser.querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => { const q = b.textContent.trim(); chooser.remove(); ask(q, {m, h}); }));
  db.scrollTop = db.scrollHeight;
  showDrawer();
}

function close_(){
  stopAllThink(); archive(); clearAtt(); closePick();
  drawer.classList.remove("on");
  drawer.setAttribute("aria-hidden","true");
}
/* 側欄點某一則歷史 → 原封不動重開那一串，可以繼續問。
   重開＝直接鋪答案（animate=false），不把歷史每一輪都重演一次思考動畫。 */
function openThread(t){
  archive();
  TH = t; const i = HIST.indexOf(t); if(i > -1) HIST.splice(i,1);
  dt.textContent = trim_(t.title);
  stopAllThink(); db.innerHTML = "";
  t.turns.forEach(x => renderTurn(x.q, x.ctx, false, x.typed, x));
  renderHist(); showDrawer();
}

/* ---- 引用圖表（＋）＝直接跟大欄互動 ---------------------------------

   要引用的東西就在旁邊，改成：抽屜滑開讓位 → 大欄轉灰 → hover 那張回復彩色 → 點擊帶入。
   Hero 保持原樣（它不是可引用的對象）。Esc 或再按一次 ＋ 取消。 */

/* ---- 抽屜可拖曳、可縮放 -------------------------------------------------
   預設仍是右側靠邊的浮卡（CSS 的 top/right/bottom）。使用者一動它才切成
   .free ＋ 明確的 left/top/width/height——在那之前不要寫死尺寸，否則視窗
   一縮，抽屜就凸出畫面外。尺寸／位置記在 BOX，關掉再開會回到使用者擺的地方。
   標頭連按兩下＝復位。 */
/* MARGIN 用 --space-4＝預設浮卡離螢幕邊緣的縫隙，拖曳時的邊界跟它對齊 */
const MINW = 380, MINH = 240, MARGIN = 16;
let BOX = null, drag = null;
/* ⤢ 最大化：撐到近滿版（避開左 rail、四周留 MARGIN）。⤡ 還原＝回到按下前的狀態。
   ⚠️ 這不是 ③ 全屏對話（那換版型、且卡在「吸收 vs 跳頁」）——這只是視窗最大化，
   還是同一個抽屜。maximized 記狀態、_preMax 記按下前的 BOX（null＝當時是預設浮卡）。 */
let maximized = false, _preMax = null;

/* 把目前的實際位置固定下來（第一次拖／拉時呼叫） */
function dockDrawer(){
  if(BOX) return;
  const r = drawer.getBoundingClientRect();
  BOX = {x:r.left, y:r.top, w:r.width, h:r.height};
  drawer.classList.add("free"); applyBox();
}
function applyBox(){
  drawer.style.left   = BOX.x + "px";
  drawer.style.top    = BOX.y + "px";
  drawer.style.width  = BOX.w + "px";
  drawer.style.height = BOX.h + "px";
}
/* 完全不許出界：抽屜是唯一能看到答案的地方，被拖出去一半就等於答案被裁掉。
   ⚠️ 左界不是 0 而是 rail 寬——側欄 z-index 66 蓋在抽屜(61)之上，
   貼到 x=16 會鑽進 rail 底下、左緣文字被吃掉（截圖才看出來的）。
   先夾尺寸（不得大於可用區），再夾位置（右／下界要扣掉自身寬高）。 */
const RAIL = parseInt(getComputedStyle(document.documentElement)
               .getPropertyValue("--rail")) || 56;
function clampBox(){
  const minX = RAIL + MARGIN;
  const maxW = innerWidth - minX - MARGIN, maxH = innerHeight - MARGIN*2;
  BOX.w = Math.min(Math.max(MINW, BOX.w), maxW);
  BOX.h = Math.min(Math.max(MINH, BOX.h), maxH);
  BOX.x = Math.min(Math.max(minX,   BOX.x), innerWidth  - BOX.w - MARGIN);
  BOX.y = Math.min(Math.max(MARGIN, BOX.y), innerHeight - BOX.h - MARGIN);
}
function resetDrawer(){
  BOX = null; drawer.classList.remove("free");
  drawer.style.left = drawer.style.top = drawer.style.width = drawer.style.height = "";
  setMax(false); _preMax = null;      /* 任何復位都同時解除最大化，圖示回 ⤢ */
}
/* ⤢／⤡ 一顆鈕兩種狀態 */
function setMax(on){
  maximized = on;
  dex.innerHTML = ic(on ? "shrink" : "expand","ic sm");
  dex.setAttribute("aria-label", on ? "還原大小" : "放大");
}
function maxBox(){
  const minX = RAIL + MARGIN;
  return {x:minX, y:MARGIN, w:innerWidth - minX - MARGIN, h:innerHeight - MARGIN*2};
}
function toggleMax(){
  if(!maximized){
    _preMax = BOX ? {...BOX} : null;   /* null＝按下前是預設浮卡（還原時 resetDrawer） */
    dockDrawer();
    BOX = maxBox(); clampBox(); applyBox();
    setMax(true);
  } else if(_preMax){
    BOX = {..._preMax}; clampBox(); applyBox();
    setMax(false); _preMax = null;
  } else {
    resetDrawer();                     /* resetDrawer 內已 setMax(false) */
  }
}

function onMove(e){
  if(!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py, s = drag.start;
  if(drag.mode === "move"){ BOX.x = s.x + dx; BOX.y = s.y + dy; }
  else {
    const m = drag.mode;
    if(m.includes("e")) BOX.w = Math.max(MINW, s.w + dx);
    if(m.includes("s")) BOX.h = Math.max(MINH, s.h + dy);
    /* 往左／上拉：寬高增加的同時，原點要跟著往回移 */
    if(m.includes("w")){ BOX.w = Math.max(MINW, s.w - dx); BOX.x = s.x + (s.w - BOX.w); }
    if(m.includes("n")){ BOX.h = Math.max(MINH, s.h - dy); BOX.y = s.y + (s.h - BOX.h); }
  }
  clampBox(); applyBox();
}
function endDrag(){
  if(!drag) return;
  drag = null;
  drawer.classList.remove("dragging","resizing");
  removeEventListener("pointermove", onMove);
  removeEventListener("pointerup", endDrag);
}
function beginDrag(e, mode){
  /* 最大化狀態下手動拖／拉 → 視為離開最大化（圖示回 ⤢，之後 ⤡ 不會亂還原） */
  if(maximized){ maximized = false; _preMax = null; setMax(false); }
  dockDrawer();
  drag = {mode, px:e.clientX, py:e.clientY, start:{...BOX}};
  drawer.classList.add(mode === "move" ? "dragging" : "resizing");
  addEventListener("pointermove", onMove);
  addEventListener("pointerup", endDrag);
  e.preventDefault();
}
drawer.querySelector(".dhd").addEventListener("pointerdown", e => {
  if(e.target.closest("button")) return;      /* ⤢／✕ 照常可點 */
  beginDrag(e, "move");
});
drawer.querySelectorAll(".rz").forEach(h =>
  h.addEventListener("pointerdown", e => beginDrag(e, h.dataset.rz)));
drawer.querySelector(".dhd").addEventListener("dblclick", e => {
  if(!e.target.closest("button")) resetDrawer();
});
/* 視窗變動時：最大化中就重算滿版，否則把抽屜拉回可見範圍 */
addEventListener("resize", () => {
  if(!BOX) return;
  if(maximized) BOX = maxBox();
  clampBox(); applyBox();
});

document.getElementById("dx").addEventListener("click", close_);
/* ⤢ ＝最大化 ↔ 還原（視窗控制）。真正的 ③ 全屏對話（換版型）等「吸收 vs 跳頁」
   拍板後另接——屆時可以是「已最大化時再按一次才進 ③」。 */
dex.addEventListener("click", toggleMax);

const sendCi = () => {
  if(_replyingId != null){ stopReply(); return; }   /* 回覆中：這顆鈕＝停止 */
  const q = ci.value.trim(); if(!q) return;
  ask(q, ATT, true); ci.value = ""; clearAtt();      /* 自由輸入 → 無法回答 */
};
document.getElementById("cs").addEventListener("click", sendCi);
/* ⚠️ CJK 友善：中文靠輸入法組字，選字／確認候選也是按 Enter。若不擋，注音打到一半
   按 Enter 選字會被當成「送出」，把半成品或錯字直接送掉。isComposing／keyCode 229＝
   組字中，這時的 Enter 只屬於輸入法，不觸發送出。 */
ci.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229) sendCi();
});

/* 頂欄常駐輸入列 —— 自由問句一律走完整 AI（第一版不做路由器），
   而且每一句都要記進側欄的歷史：問了三次以上的問題，就是該凍結成元件的問題。 */
const ti = document.getElementById("ti");
const askTop = () => { if(ti.value.trim()){ open_(ti.value.trim(), null, true); ti.value=""; } };
document.getElementById("ts").addEventListener("click", askTop);
ti.addEventListener("keydown", e => {   /* 同 ci：組字中的 Enter 屬於輸入法選字，不送出 */
  if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229) askTop();
});

/* ---- 側欄：預設收起，展開是 overlay（不推擠主區） ---- */
const side = document.getElementById("side"), sscrim = document.getElementById("sscrim");
const openSide  = () => { side.classList.add("open"); sscrim.classList.add("on"); hideTip(); };
const closeSide = () => { side.classList.remove("open"); sscrim.classList.remove("on"); };

document.getElementById("tog").addEventListener("click", closeSide);

<!-- ── 開場 loading 動畫驅動（自 index.html 移植；index 的 _stagger 內容進場為該頁專屬，未移植）── -->
<script>
(function(){
  const _sleep = ms => new Promise(r => setTimeout(r, ms));
  const TAGLINE = "從提問到洞察，幾秒內完成";
  let _done = false;
  function _finish(){
    if(_done) return; _done = true;
    const ov = document.getElementById("intro-overlay");
    if(ov){ ov.classList.add("intro-out"); setTimeout(() => { if(ov.parentNode) ov.remove(); }, 650); }
  }
  async function _run(){
    const ov = document.getElementById("intro-overlay");
    const wordEl = document.getElementById("intro-wordmark-wrap");
    const aiTagEl = document.getElementById("intro-ai-tag");
    const tagEl = document.getElementById("intro-tagline");
    if(!ov) return;
    ov.addEventListener("click", _finish);
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      /* 無障礙底線（DS 規則 8）：直接跳到結束態 */
      if(wordEl) wordEl.classList.add("revealed");
      if(aiTagEl) aiTagEl.classList.add("visible");
      if(tagEl){ tagEl.style.opacity = "1"; tagEl.textContent = TAGLINE; }
      await _sleep(400); _finish(); return;
    }
    /* Phase 1：wordmark 左→右 reveal（.sheen 底下自己來回掃光） */
    if(wordEl) wordEl.classList.add("revealed");
    await _sleep(1600); if(_done) return;
    /* Phase 1b：停在掃光的 wordmark 上當「載入中」的一拍 */
    await _sleep(2000); if(_done) return;
    if(aiTagEl) aiTagEl.classList.add("visible");
    /* Phase 2：tagline 打字機 */
    await _sleep(320); if(_done) return;
    tagEl.style.opacity = "1";
    for(const ch of TAGLINE){ if(_done) return; tagEl.textContent += ch; await _sleep(78); }
    /* Phase 3：shimmer 停頓 → Phase 4：淡出露出 dashboard */
    tagEl.classList.add("shimmer");
    await _sleep(1050); if(_done) return;
    _finish();
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", _run);
  else _run();
}());
</script>
