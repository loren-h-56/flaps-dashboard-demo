    const tx=Math.max(20,Math.min(W-20,+px(r1)));   /* 夾住標籤，避免貼近兩端時溢出 */
    return `<line x1="${px(r0)}" y1="${py(r0)}" x2="${px(r1)}" y2="${py(r1)}"
        stroke="var(--accent-2)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="${tx}" y="${(+py(r1)-3).toFixed(1)}" text-anchor="middle"
        class="hd-ref">${k.avgLab||"其他月均"}</text>`;
  };
  /* dim＝對照期那條弧，降透明度退到背景，當月仍是主角 */
  const ring=(val,lab,dim,ref)=>{
    const fill=semi*clamp(val)/100;
    return `<div class="hd-ring">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k.k} ${lab} ${val}%">
        <path d="${path}" fill="none" stroke="var(--accent-soft)" stroke-width="${sw}" stroke-linecap="round"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="${sw}" stroke-linecap="round"
          ${dim?'opacity=".45"':""} stroke-dasharray="${fill.toFixed(1)} ${(semi-fill).toFixed(1)}"/>
        ${ref!=null?refLine(ref):""}
        <text x="${cx}" y="${cy-7}" text-anchor="middle"
          class="hd-cur${dim?" dim":""}">${val}<tspan class="hd-u">%</tspan></text>
      </svg>
      <span class="hd-cap">${lab}</span>
    </div>`;
  };

  const avgLab=k.avgLab||"其他月均";
  return `<div class="kpi kpi-hd${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="hd-body">
      ${ring(cur, k.curLab||"當月", false, avg)}
      <div class="hd-mid">
        <span class="delta ${cls} num">${arrow}${Math.abs(delta)} 百分點</span>
        <span class="hd-cap">較${avgLab}</span>
      </div>
      ${ring(avg, avgLab, true, null)}
    </div>
  </div>`;
}
/* mini 長條卡的 ECharts option：月份為 x 軸、末柱高亮、hover 顯示月份+值。
   yAxis 下探壓低基準 → 放大高低差視覺。 */
function miniBarOption(k, tk){
  const n=k.bars.length, mn=Math.min(...k.bars), mx=Math.max(...k.bars), rg=(mx-mn)||1;
  return {
    animation:false,
    grid:{ left:2, right:2, top:6, bottom:16 },
    tooltip:{ trigger:"axis", axisPointer:{type:"shadow"}, confine:true,
      textStyle:{fontSize:11,color:tk.body}, backgroundColor:tk.paper,
      borderColor:tk.border, borderWidth:1,
      extraCssText:"border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:6px 9px;",
      formatter:p=>`${p[0].axisValue} <b>${p[0].value}</b>${k.u||""}` },
    xAxis:{ type:"category", data:k.bx||k.bars.map((_,i)=>i+1),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:tk.tick,fontSize:9,interval:0,margin:5} },
    yAxis:{ type:"value", show:false, min:mn-rg*0.8, max:mx+rg*0.15 },
    series:[{ type:"bar", barWidth:"58%",
      data:k.bars.map((v,i)=>({ value:v,
        itemStyle:{ color:tk.dv[0], opacity:i===n-1?1:0.32, borderRadius:[2,2,0,0] } })) }]
  };
}

/* mini 折線卡的 ECharts option：比率型「連續惡化」的趨勢（如年度流失率）。
   為什麼這類指標走線不走柱：截斷基準的長條會誇大量級——56.8→62.4 只差 5.6 個
   百分點，壓過基準後末柱卻是首柱的 ~2.2 倍，眼睛讀成「翻倍」。線編碼的是斜率／位置，
   本來就該配壓過的基準，一路往上的斜線才是訊息本身。y 軸上下各留 35% 全距當緩衝，
   線不會貼邊。共用 minibars 的卡殼與 .kmini 機制 → 保留逐月懸浮窗。 */
function miniLineOption(k, tk){
  const n=k.bars.length;
  /* 軸域要把目標線一起框進來：目標若落在資料範圍之外（例如 DOI 目標 120 < 最小值 128），
     不含它的話線會被切掉，而那條線正是「128 到底算好算壞」的唯一判準。 */
  const vs=k.ref!=null?[...k.bars,k.ref]:k.bars;
  const mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  /* 軸界取整到一個「讀得順」的步階，讓 ECharts 分出來的刻度是 110／130／150 這種數字。
     不取整的話（112.3–149.7）會冒出 115／135 之類的刻度，小卡上多一個位數就擠。
     ── 2026-08-05：步階從**寫死 10** 改成依全距推算 ────────────────────────────
     ⚠️ 寫死 10 對窄幅指標會把軸撐得太寬，實測三張卡的資料佔軸高比例：
          庫存 DOI    128–142（全距 22）→ 軸 110–150　佔 55%　（10 剛好合身）
          促銷毛利率  36.2–41.8（全距 5.6）→ 軸 **30–50**　佔 **28%**
          CRM 流失率  56.9–62.4（全距 5.5）→ 軸 **50–70**　佔 **27%**
        後兩張的線被壓成一條扁帶，六個月一路往下掉的斜率讀不出來——而「是不是在持續
        失血」正是這兩張卡選 line 而不選半圓的唯一理由（見兩張卡的註解）。
     `nice(rg/3)` ＝ 把全距切三格再吸附到 1／2／5／10 階梯。代進三張卡：
          DOI     rg/3=7.3 → 步階 10 → 110／130／150（**與改前完全相同**）
          毛利率  rg/3=1.9 → 步階  2 → 34／40／46　 佔 47%，而且**目標 40 落在中間刻度**
          流失率  rg/3=1.8 → 步階  2 → 54／60／66　 佔 46%
     ⚠️ 刻度只有三根（yAxis 的 interval 寫死 (hi−lo)/2），所以 (hi−lo)/S **必須是偶數**，
        否則中間那根會落在半格上（例如 30／37.5／45）。是奇數就往資料餘裕較小的那側再讓
        一格；兩側一樣就讓上界——毛利率就是這條，讓完剛好把目標線推到中間刻度上。 */
  const nice=v=>{ const p=Math.pow(10,Math.floor(Math.log10(v))), m=v/p;
    return (m<=1?1:m<=2?2:m<=5?5:10)*p; };
  const S=nice(rg/3);
  let lo=Math.floor((mn-rg*0.35)/S)*S, hi=Math.ceil((mx+rg*0.35)/S)*S;
  if(Math.round((hi-lo)/S) % 2){ if(mn-lo < hi-mx) lo-=S; else hi+=S; }
  /* 第一個掉到 ref 壞側的索引（見 series 的 symbolSize／itemStyle）。>0 才算穿越。 */
  const b = (k.ref==null||k.badBelow==null) ? -1
    : k.bars.findIndex(v => k.badBelow ? v<k.ref : v>k.ref);
  const bad = b>0 ? b : -1;
  return {
    animation:false,
    /* left 給 y 軸刻度讓位（原本 2）。10px 兩位數字約 17px，留 26 含 margin。
       ⚠️ top 8→4（2026-08-03）：bottom 的 16 是 x 軸標籤（9px ＋ margin 5）要的，收不得；
          top 只是為了讓最高的那個 y 軸刻度不貼邊，4px 就夠。 */
    grid:{ left:k.axis?26:2, right:4, top:4, bottom:16 },
    tooltip:{ trigger:"axis", axisPointer:{type:"line",lineStyle:{color:tk.border}}, confine:true,
      textStyle:{fontSize:11,color:tk.body}, backgroundColor:tk.paper,
      borderColor:tk.border, borderWidth:1,
      extraCssText:"border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:6px 9px;",
      formatter:p=>`${p[0].axisValue} <b>${p[0].value}</b>${k.u||""}` },
    /* boundaryGap 留 true（預設）：首/末點才不會貼邊，"1月"/"6月" 標籤置中不被裁。 */
    xAxis:{ type:"category", data:k.bx||k.bars.map((_,i)=>i+1),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:tk.tick,fontSize:9,interval:0,margin:5} },
    /* k.axis ＝ 顯示 y 軸刻度。壓過基準的線圖本來就讀不到絕對水位，而 DOI 這種
       「128 天」的指標，水位就是它的意思——只給斜率等於把一半的資訊丟掉。
       splitNumber:2 ＝ 只要兩三個刻度；小卡上刻度多一根就變成格線牆。
       ⚠️ 刻度線關掉（splitLine.show:false）只留數字：這張圖只有 ~48px 高，
          橫線會跟折線本身搶讀者的眼睛。 */
    /* ⚠️ 用 `interval` 寫死三格（下界／中點／上界），不要用 `splitNumber`。
       splitNumber 只是「建議值」，ECharts 仍會依 40px 的間隔上限自行加密刻度，
       然後在小卡上把擠在一起的那幾個**自動隱藏**——實測 110–150 的軸畫出
       110／120／140／150（130 被藏掉），看起來像刻度間距不一致。 */
    yAxis:{ type:"value", show:!!k.axis, min:lo, max:hi, interval:(hi-lo)/2,
      splitLine:{show:false}, axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{ color:tk.tick, fontSize:9, margin:4,
        formatter:v=>Math.round(v) } },
    series:[{ type:"line", data:k.bars, smooth:false, showSymbol:true,
      lineStyle:{color:tk.dv[0],width:2},
      areaStyle:{color:tk.dv[0],opacity:0.10},
      /* ── 跌破目標的那一點標紅（2026-08-05）───────────────────────────────
         `k.badBelow` ＝ 低於 ref 是壞事（毛利率 true）。不給就不標。
         改前這張卡只畫得出「現在 36.2、目標 40」，但**第幾個月跌破的才是行動觸發點**——
         41.8 一路掉到 36.2 中間有一個穿越點，畫面上完全讀不到。
         ⚠️ 只在**真的有穿越**時標（bad>0）：DOI 那張六個月全都在目標之上，findIndex
            會回 0，標在首點等於把「一直沒達標」誤畫成「這個月才跌破」。
         ⚠️ 只加一個點、不加標籤。這張圖在 1366 只有 45px 高，任何文字都會壓到折線
            （目標線的標籤就是為了這個才搬去 .vrow，見下方 markLine 的註解）。
            x 軸的月份標籤本來就在，紅點落在哪個月讀得出來。 */
      symbol:"circle", symbolSize:(v,p)=>(p.dataIndex===n-1||p.dataIndex===bad)?6:0,
      itemStyle:{color:p=>p.dataIndex===bad?tk.bad:tk.dv[0],
        borderColor:tk.paper,borderWidth:1.4},
      emphasis:{scale:false},
      /* ⚠️ markLine 必須 animation:false —— 同 hbar 那條的理由：它靠 rAF 展開，
         headless 的 --virtual-time-budget 下 rAF 不推進，線會塌成一點。
         參考線是靜態註記，本來就不需要動畫。 */
      markLine: k.ref!=null?{ silent:true, symbol:'none', animation:false,
        lineStyle:{ color:tk.tick, type:'dashed', width:1 },
        /* ⚠️ 標籤整個關掉（2026-08-03）——「目標 120 天」改印在卡片的 .vrow 右端（見 kpiMiniBars）。
           位置在圖內換過三輪都不對，而三輪都是同一個病因：**圖區根本不夠高**。
             insideEndTop（上）→ 壓到折線，資料整段都在目標線之上；
             insideStartBottom（左下）→ 跟 y 軸最低的刻度擠在同一行；
             insideEndBottom（右下）→ 1366 的可畫帶只有 21px，一個 9px 的字帶就吃掉一半。
           參考線本來就是靜態註記，它的「值」是卡片層級的資訊、不是圖上的資料點——
           搬到文字區之後圖內只留一條虛線，位置問題連同它的成本一起消失。 */
        label:{ show:false },
        data:[{ yAxis:k.ref }] }:undefined }]
  };
}

/* Hero 摘要卡的一格：標籤在上、大數字在下（漲跌章 tone 決定好壞配色，摘要列預設不帶）。
   dual＝升/降兩個數字並列（升降級）。 */
function heroStat(s){
  if(s.dual) return `<div class="hstat">
    <span class="hl">${s.label}</span>
    <div class="hv-dual">
      <span class="up">${ic("up","ic sm")}${s.up}</span>
      <span class="down">${ic("down","ic sm")}${s.down}</span>
    </div>
  </div>`;
  const tri = s.arw==="u"?"triUp":s.arw==="d"?"triDown":null;
  const arrow = tri?`<svg class="tri" viewBox="0 0 24 24" aria-hidden="true">${P[tri]}</svg>`:"";
  const badge = s.note ? `<span class="hbadge ${s.tone||"flat"} num">${arrow}${s.note}</span>` : "";
  /* drill＝這一格可以點開明細。改成真正的 <button>（不是加 click 的 div）——
     鍵盤可及性與 screen reader 語意都由原生元素負責，不用手接 role/tabindex/Enter/Space。
     chevR 是「裡面還有東西」的視覺線索；不用文字，因為 hero 卡寬度是內容驅動的，
     多四個中文字會把整塊量表區推寬。 */
  const tag  = s.drill ? "button" : "div";
  const attr = s.drill
    ? ` class="hstat hstat-drill" type="button" data-drill="${s.drill}" data-metric="${s.metric}"`
      /* 螢幕閱讀器要聽到「點下去會看到什麼」，而彈窗標題就是那句話——取自資料集本身，
         換模組時不會漏改（DRILLS 宣告在彈窗那一段，但這裡只在 draw() 期間才求值）。 */
      + ` aria-label="${s.label} ${s.v}${s.u||""}，查看${(DRILLS[s.drill]||{}).title||"明細"}"`
    : ` class="hstat"`;
  const chev = s.drill ? ic("chevR","ic dchev") : "";
  return `<${tag}${attr}>
    <span class="hl">${s.label}${s.per?`<span class="hper num">（${s.per}）</span>`:""}${s.partial?`<span class="hpart">進行中</span>`:""}${chev}</span>
    <div class="hrow"><span class="hv num">${s.v}${s.u?`<small>${s.u}</small>`:""}</span>${badge}</div>
    ${s.scope?`<span class="hscope num">${s.scope}${s.vper?`（${s.vper}）`:""}</span>`:""}
  </${tag}>`;
}
/* 頂端混排派發：每項 t=ring→圓環（比率）、t=dual→升降雙值、其餘→數字格（絕對量）。 */
function heroItem(it){
  if(it.t === "ring") return gaugeRing(it);
  if(it.t === "dual") return heroStat({dual:true, up:it.up, down:it.down, label:it.label});
  return heroStat(it);
}
const renderHero = arr => arr.map(heroItem).join("");

/* ============================================================
   render
   ============================================================ */
const chEl    = document.getElementById("charts"),
      gaugesEl= document.getElementById("hero-gauges");

/* 依 12 欄網格模擬自動排版，回傳內容占用的「列數」（含 rs 跨列）。
   draw() 用它算 grid-template-rows —— 之後改 cs/rs 或增減張數都自動對。 */
function gridSpanRows(items, wOf){
  const cols = 12, occ = [];
  const ensure = r => { while(occ.length <= r) occ.push(new Array(cols).fill(false)); };
  for(const it of items){
    const w = Math.min(wOf(it), cols), h = it.rs || 1;
    let placed = false;
    for(let r = 0; !placed; r++){
      ensure(r + h - 1);
      for(let c = 0; c + w <= cols; c++){
        let ok = true;
        for(let dr = 0; dr < h && ok; dr++)
          for(let dc = 0; dc < w; dc++) if(occ[r+dr][c+dc]){ ok = false; break; }
        if(ok){
          for(let dr = 0; dr < h; dr++) for(let dc = 0; dc < w; dc++) occ[r+dr][c+dc] = true;
          placed = true; break;
        }
      }
    }
  }
  return occ.length;
}

/* 統一排版：KPI 卡與圖表同放一張網格。回傳每列的高度設定——
   只要該列含圖表就 1fr（圖需要高度），純 KPI 卡列則 auto（緊湊）。
   items: {cs, rs, chart:bool}，順序＝實際 innerHTML 流。 */
function placeRows(items){
  const cols = 12, occ = [], hasChart = [];
  const ensure = r => { while(occ.length <= r){ occ.push(new Array(cols).fill(false)); hasChart.push(false); } };
  for(const it of items){
    const w = Math.min(it.cs, cols), h = it.rs || 1;
    let placed = false;
    for(let r = 0; !placed; r++){
      ensure(r + h - 1);
      for(let c = 0; c + w <= cols; c++){
        let ok = true;
        for(let dr = 0; dr < h && ok; dr++)
          for(let dc = 0; dc < w; dc++) if(occ[r+dr][c+dc]){ ok = false; break; }
        if(ok){
          for(let dr = 0; dr < h; dr++){
            for(let dc = 0; dc < w; dc++) occ[r+dr][c+dc] = true;
            if(it.chart) hasChart[r+dr] = true;
          }
          placed = true; break;
        }
      }
    }
  }
  return hasChart.map(hc => hc ? "minmax(0,1fr)" : "auto");
}
let page = "業績";

document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => { page = b.dataset.p; draw(); }));

const stripTags = s => String(s).replace(/<[^>]+>/g, "");

/* 每張圖 = 一個 ECharts 實例，就地填進版位格（.plot flex:1，尺寸由格子決定）。
   重繪／切分頁前先 dispose 舊實例（否則實例累積吃記憶體）；尺寸變動只 resize，不重建。 */
/* _byI：data-i → ECharts 實例。⚠️ 不能用 _charts 的索引代替——_charts 尾端還接著
   KPI 卡的小柱實例，兩者的序號對不上。可點圖例要靠這張表找到自己那張圖。 */
let _charts = [], _funnels = [], _pxlay = [], _heats = [], _kmini = [], _byI = {};
function renderCharts(D){
  _charts.forEach(ch => ch.dispose()); _charts = []; _funnels = []; _pxlay = []; _heats = []; _kmini = []; _byI = {};
  const tk = dvTokens();
  chEl.querySelectorAll(".plot[data-i]").forEach(el => {
    const c = D.charts[+el.dataset.i];
    if(!c) return;
    const chart = echarts.init(el, null, { renderer:"svg" });
    /* ⚠️ 用 chart.getHeight() 不是 el.clientHeight——`.plot` 有 padding-bottom:4px，
       clientHeight **含** padding（101）而 ECharts 只畫到 content box（97）。
       拿 clientHeight 去算像素座標，手繪的 graphic 就會比 ECharts 的格線多 4px 可用高度，
       表現成「愈往下偏得愈多」的線性錯位（deltabar 實測 1px/列）。寬度同理。 */
    chart.setOption(buildOption(c, tk, chart.getHeight(), chart.getWidth()));
    _charts.push(chart); _byI[el.dataset.i] = chart;
    if(c.type==='funnel') _funnels.push({chart, el, c});   /* 漏斗流失欄是像素定位 → resize 要帶新高度重對齊 */
    /* _pxlay ＝ 版面本身（不只 graphic）是用 W/H 算出來的圖型 → resize 必須整段重建 option，
       光 ch.resize() 會讓 ECharts 依新尺寸重排格線、但手算的像素座標還停在舊尺寸。
       deltabar 就是這樣錯位過：掛載時 H=101、實際 115，於是通路名依 rowH 20.5 排、
       長條依 rowH 24 排，四列愈往下偏得愈多。 */
    /* c.topN 的圖同樣進 _pxlay：它的**列數**本身是 H 的函數，resize 只 resize 不重建的話，
       視窗拉高了列數也不會跟著變（而且副標會停在舊的「前後各 N 名」）。 */
    if(c.type==='donut' || c.type==='deltabar' || c.type==='rings'
       || c.type==='waffle' || c.topN) _pxlay.push({chart, el, c});
    syncSub(el, c, chart.getHeight());
    if(c.type==='heatmap'){ _heats.push({chart, c}); squareHeat(chart, c); }   /* 格子校正要在算得出像素之後 */
    /* Stackbar 的圖例＝篩選器，不只是開關顯示：關掉一段就把它移出分母、剩下的重新正規化
       撐滿整條。ECharts 內建圖例只會隱藏 series（分母不動 → 右側留白 ＋ % 加不到 100），
       所以要攔下事件、帶著新的 selected 整段重建。
       ⚠️ notMerge:true 是必要的——series 數量與 xAxis.max 都變了，merge 會留下舊值；
       但 notMerge 也會清掉圖例的勾選狀態，所以 buildOption 裡要把 selected 回寫（見該處）。
       ⚠️ 不可以在這裡再 dispatchAction 動圖例，否則會遞迴觸發自己。 */
    if(c.type==='stackbar'){
      const applySel = ev => {
        /* ⚠️ 三個事件都要掛：使用者點圖例走 legendselectchanged，
           但程式用 dispatchAction 走的是 legendselected／legendunselected——
           只掛前者的話，手點有效、程式呼叫無效（探針因此量到「完全沒反應」）。
           事件沒帶 selected 時（部分版本如此）就從 option 讀回來，不要自己記狀態。 */
        const sel = (ev && ev.selected) || ((chart.getOption().legend || [])[0] || {}).selected;
        if(!sel) return;
        chart.setOption(buildOption(c, tk, chart.getHeight(), chart.getWidth(), sel), true);
        /* 分母變了就要講出來——42% 變 52% 而副標還寫「本月佔比」會被當成資料跳動。 */
        const off = Object.values(sel).filter(v => v === false).length;
        const sub = el.closest('.panel')?.querySelector('.sub');
        if(sub) sub.textContent = c.s + (off ? `（已排除 ${off} 項）` : '');
      };
      ['legendselectchanged','legendselected','legendunselected'].forEach(e => chart.on(e, applySel));
    }
  });
  /* KPI 卡內的 mini 長條（連帶率 UPT 等）也走 ECharts → 有正式懸浮窗。 */
  _kmini = [];
  chEl.querySelectorAll(".plot.kmini[data-ki]").forEach(el => {
    const k = (D.kpi || [])[+el.dataset.ki];
    if(!k || !k.bars) return;
    _kmini.push({ el, k, chart:null });
  });
  mountKMini(tk);
}

/* 容器高度為 0 時 init 會拿到 0×0（ECharts 會警告且畫不出來）→ 跳過，等有高度了再補建。
   已建好的交給 resize()。 */
function mountKMini(tk){
  _kmini.forEach(m => {
    if(m.chart || !m.el.clientHeight) return;
    m.chart = echarts.init(m.el, null, { renderer:"svg" });
    m.chart.setOption(m.k.type === "miniline" ? miniLineOption(m.k, tk) : miniBarOption(m.k, tk));
    _charts.push(m.chart);
  });
}

/* 事件委派：重繪會換掉 .plot 內容，逐一綁 listener 會漏綁；
   tooltip 與「深入分析」統一掛在 chEl 上，一次搞定、重繪不受影響。 */
chEl.addEventListener("mousemove", e => {
  /* 挑圖模式下整張面板是一個可點的目標，資料點 tooltip 只會干擾 */
  if(document.body.classList.contains("picking")){ hideTip(); return; }
  const t = e.target.closest("[data-tip]");
  t ? showTip(e, t.dataset.tip) : hideTip();
});
chEl.addEventListener("mouseleave", hideTip);
chEl.addEventListener("click", e => {
  /* 〔深入分析〕＝開「選角度」開場：先讓使用者挑這張圖要看哪個角度，選了才成為第一則問句。
     第一個角度＝ c.dig／k.dig，其餘兩句由 DIG_MORE 補上，三句都是 golden 原句或其標記過的變體。 */
  const b = e.target.closest(".dig");
  if(b){ openDig(page, b.dataset.c, [b.dataset.q, ...(DIG_MORE[b.dataset.c] || [])]); return; }
  /* 可點圖例：點一下暫時隱藏／顯示那條序列（line／combo 的圖例走面板頁首頁腳的手刻 HTML，
     ECharts 內建圖例是 show:false）。⚠️ show:false 的 legend **元件仍然存在**，
     legendToggleSelect 照樣生效——這正是「圖例外置、行為內建」能成立的原因，
     不必自己去改 series.data。挑圖模式下停用：此刻整張面板是一個可點的目標。 */
  /* 清單的分段切換（排序依據／期間）。只重排這一張清單，不重畫整頁——
     重畫會讓所有 ECharts 重新掛載、開場動畫整片重跑，切一下排序不該有那種代價。
     挑圖模式下停用（此刻整張面板是一個可點的目標，理由同下方圖例）。 */
  const sg = e.target.closest(".sgb[data-sg]");
  if(sg && !document.body.classList.contains("picking")){
    const panel = sg.closest(".panel"), box = panel && panel.querySelector(".rows[data-li]");
    const l = box && _lists.find(x => x.box === box);
    if(!l) return;
    segOf(l.c)[sg.dataset.sg] = sg.dataset.sv;
    sg.closest(".sgrp").querySelectorAll(".sgb").forEach(b =>
      b.setAttribute("aria-pressed", String(b === sg)));
    syncList(box, l.c);
    return;
  }
  const lg = e.target.closest(".lg[data-lg]");
  if(lg && !document.body.classList.contains("picking")){
    const panel = lg.closest(".panel"), plot = panel && panel.querySelector(".plot[data-i]");
    const chart = plot && _byI[plot.dataset.i];
    if(!chart) return;
    const off = lg.classList.toggle("off");
    lg.setAttribute("aria-pressed", off ? "false" : "true");
    chart.dispatchAction({ type:"legendToggleSelect", name:lg.dataset.lg });
  }
});

/* 視窗/格子尺寸變動 → 只叫 ECharts resize（rAF 去抖，避免縮放時狂重算）。
   漏斗的流失欄是像素定位，高度一變就要用新 clientHeight 重算 graphic 才不會脫齊。 */
let _raf;
new ResizeObserver(() => {
  cancelAnimationFrame(_raf);
  _raf = requestAnimationFrame(() => {
    mountKMini(dvTokens());                     /* 補建先前因容器 0 高而跳過的小柱 */
    _charts.forEach(ch => ch.resize());
    _heats.forEach(h => squareHeat(h.chart, h.c));   /* 格子比例隨面板寬高變 → 每次都要重校 */
    if(_funnels.length || _pxlay.length){ const tk = dvTokens();
      _funnels.forEach(f => f.chart.setOption({ graphic: funnelDrops(f.c, tk, f.chart.getHeight(), f.chart.getWidth()) }));
      /* 半圓／deltabar：用新寬高整段重算（圖例位置、中央數字、弧半徑、欄寬、列高都依 W/H） */
      _pxlay.forEach(f => { f.chart.setOption(buildOption(f.c, tk, f.chart.getHeight(), f.chart.getWidth()), true);
        syncSub(f.el, f.c, f.chart.getHeight()); }); }
    /* 清單的列數同樣是高度的函數（見 fillList）→ 跟 topN 的圖表一起重算，否則拉高視窗
       會出現「圖表多了兩列、旁邊的清單還是五列」。 */
    _lists.forEach(l => syncList(l.box, l.c));
  });
}).observe(chEl);

/* Hero 快捷發問：每個模組三句，全部取自 golden 294（見 chips_golden_mapping.xlsx「HERO」分頁）。
   選句原則是**補大欄圖表的盲區**——坪效、退貨、轉換率、在途到貨、優惠碼、點數這些
   畫面上沒有圖、但主管會問的角度。因此這 12 句多半落到 GENERIC（「新問題 · 完整推理」），
   那正是要示範的另一條路徑；「秒回凍結答案」交由後端檢索決定，前端不再為它挑句。 */
const QC = {
  業績:["我們坪效最高的是哪家店？","上個月退貨對業績影響有多大？","哪個通路轉換率最低？"],
  /* ⚠️ 第 1 句 2026-07-31 換過。原本是 庫存-102（S9）「上週進的貨到底有沒有全部到齊？」，
     選它的理由寫的是「到貨進度沒有圖、在途是盲區」——上一輪加了「在途待收」面板之後
     那個理由就不成立了，而且與該面板的第 1 句 dig（庫存-193，同為 S9）撞在同一件事上。
     換成 **改寫自 庫存-147（S7）**「雙11前要備多少貨才夠？」，補的是畫面上完全沒有的
     前瞻備貨角度（現有的斷貨風險講的是**現有**可售天數，不是**下一檔要進多少**）。
     ⚠️ 這句是**改寫不是原句**（「雙11前」放寬成「接下來的檔期」），
        已列進 chips_golden_mapping.xlsx「工程待辦」待實測 cosine，不當免驗證。
     同列三句 shape：S7（147 改寫）／S4（125）／S10（157），互異 ✓ */
  庫存:["接下來的檔期要備多少貨才夠？","上禮拜缺貨造成多少訂單流失？","有哪些品項庫存數量跟系統對不起來？"],
  促銷:["網紅合作的優惠碼有哪些？轉換率表現有比較好嗎？","上次活動期間客訴有沒有增加？增加多少？","APP 會員用優惠碼的比例，比非會員高多少？"],
  CRM :["點數累積最多的前一百個會員都是誰？","我們官網 EC 的會員跟百貨專櫃的會員重疊有多少？","會員推薦朋友加入的機制，這半年帶進來多少新會員？"]
};
const qcEl = document.getElementById("qchips");
const qcPrev = document.getElementById("qcprev"), qcNext = document.getElementById("qcnext");
qcPrev.innerHTML = ic("chevL"); qcNext.innerHTML = ic("chevR");

/* ── 快捷發問列的捲動：四條路徑 ────────────────────────────────────────────
   這條列在任何螢幕寬度都溢出（見 .qchips 的 CSS 註解），所以捲動不是「加分項」
   而是「拿得到第三顆 chip 的唯一方法」。四條路徑各自服務不同的人：
     ① 捲動鈕 .qcnav —— 唯一看得見的，負責可發現性
     ② 滾輪 deltaY→scrollLeft —— 滑鼠熟手最快
     ③ 拖曳（只限 pointerType==="mouse"）—— 觸控／筆走原生捲動，不要攔
     ④ 鍵盤 Tab —— 瀏覽器自動 scroll-into-view，本來就通，一個字都沒動
   ①②③ 都只在真的溢出時才生效，不溢出時完全不介入。 */

/* 拖過就要吃掉緊接著的那次 click，否則「拖到第三顆」會順手把第二顆送出去。 */
let _qcDrag = null, _qcNoClick = false;

/* 事件掛在容器上，重繪不受影響（比照 chEl 的做法） */
qcEl.addEventListener("click", e => {
  if(_qcNoClick){ _qcNoClick = false; return; }   /* 這次 click 是拖曳的尾巴，不是發問 */
  if(picking()) return;                 /* 挑圖模式下 chips 停用（CSS 也 pointer-events:none，這是雙保險）*/
  const b = e.target.closest(".chip");
  if(b) open_(b.textContent.trim(), null);
});

const qcMax = () => qcEl.scrollWidth - qcEl.clientWidth;

/* 柔邊：淡出寬度＝離該側邊界的捲動距離，夾在 0–24px。
   ⚠️ 不要用「過門檻就切 0↔24px」——那會在邊界瞬間跳一下（滑動時遮罩閃動）。
   漸變版：滑到頭左側自然收成 0（第一顆完整顯示）、滑到底右側收成 0，中段才滿 24。
   捲動鈕的顯隱同一個函式決定：**用實測 scrollWidth，不用斷點猜**——
   沒測過的螢幕尺寸（含未來換字級、換文案）也會自己得出正確答案。 */
function updateQcFade(){
  const max = qcMax(), x = qcEl.scrollLeft;
  qcEl.style.setProperty("--fadeL", Math.max(0, Math.min(24, x)) + "px");
  qcEl.style.setProperty("--fadeR", Math.max(0, Math.min(24, max - x)) + "px");
  qcPrev.classList.toggle("on", x > 1);
  qcNext.classList.toggle("on", x < max - 1);
}
qcEl.addEventListener("scroll", updateQcFade);
addEventListener("resize", updateQcFade);
/* ⚠️ 初次 draw() 時字型可能還沒載入完，文字較窄、量不到溢出（fadeR 會誤判為 0）。
   字型 ready 與 load 後各重算一次。 */
addEventListener("load", updateQcFade);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateQcFade);

/* ① 捲動鈕：一次走 80% 可視寬——不走滿版，留一顆在畫面上當「接續點」，
   不然每按一次整排全換，會失去自己捲到哪裡的感覺。 */
const qcStep = dir => qcEl.scrollBy({
  left: dir * qcEl.clientWidth * .8,
  behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
qcPrev.addEventListener("click", () => qcStep(-1));
qcNext.addEventListener("click", () => qcStep(1));

/* ② 滾輪：垂直滾輪轉橫捲。
   ⚠️ 只在「這一捲真的有被吃掉」時才 preventDefault——捲到底就放行讓事件冒泡，
   否則在 ≤1400（頁面本身可捲）時，游標壓在這條 30px 高的列上會整頁捲不動。
   |deltaX| ≥ |deltaY| 代表是觸控板橫向手勢，原生已經會處理，不要插手。 */
qcEl.addEventListener("wheel", e => {
  const max = qcMax();
  if(max <= 0 || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  const next = Math.max(0, Math.min(max, qcEl.scrollLeft + e.deltaY));
  if(next === qcEl.scrollLeft) return;
  e.preventDefault();
  qcEl.scrollLeft = next;
}, {passive:false});

/* ③ 拖曳：4px 閾值後才算拖曳，之前一律當點擊。
   限 pointerType==="mouse"：觸控與筆的原生慣性捲動比手刻的好，攔了只會變差。 */
qcEl.addEventListener("pointerdown", e => {
  if(e.pointerType !== "mouse" || e.button !== 0) return;
  if(picking() || qcMax() <= 0) return;
  _qcDrag = {x:e.clientX, from:qcEl.scrollLeft, id:e.pointerId, moved:false};
});
qcEl.addEventListener("pointermove", e => {
  if(!_qcDrag || e.pointerId !== _qcDrag.id) return;
  const dx = e.clientX - _qcDrag.x;
  if(!_qcDrag.moved){
    if(Math.abs(dx) < 4) return;        /* 手抖不算拖曳，否則點不動 chip */
    _qcDrag.moved = true;
    qcEl.setPointerCapture(_qcDrag.id); /* 拖出容器外仍跟手 */
    qcEl.classList.add("grabbing");
  }
  qcEl.scrollLeft = _qcDrag.from - dx;
});
const qcEndDrag = () => {
  if(!_qcDrag) return;
  if(_qcDrag.moved && qcEl.hasPointerCapture(_qcDrag.id)) qcEl.releasePointerCapture(_qcDrag.id);
  qcEl.classList.remove("grabbing");
  _qcNoClick = _qcDrag.moved;           /* pointerup 早於 click，旗標來得及擋 */
  _qcDrag = null;
};
qcEl.addEventListener("pointerup", qcEndDrag);
qcEl.addEventListener("pointercancel", qcEndDrag);

function draw(){
  document.querySelectorAll(".tab").forEach(b =>
    b.dataset.p === page ? b.setAttribute("aria-current","page")
                         : b.removeAttribute("aria-current"));
  qcEl.innerHTML = (QC[page] || [])
    .map(q => `<button class="chip" type="button">${q}</button>`).join("");
  qcEl.scrollLeft = 0; updateQcFade();     /* 換頁後回捲到頭並重算柔邊 */
  const D = M[page];

  /* 上方頂端區：單一 hero 陣列，圓環（比率）＋ 數字（絕對量）逐項混排。 */
  gaugesEl.className = "hero-gauges";
  gaugesEl.innerHTML = renderHero(D.hero);

  /* KPI 卡：併入下方 12 欄網格（每張 cs:3，四張排一列）。CRM 無 KPI 卡。
     type:"gauge" → 進度環卡（比率對目標）；其餘 → 數字＋漲跌＋sparkline。 */
  const kpiHTML = (D.kpi || []).map((k, ki) => {
    if(k.type === "gauge") return kpiGauge(k);
    if(k.type === "break") return kpiBreak(k);
    if(k.type === "target") return kpiTarget(k);
    if(k.type === "minibars" || k.type === "miniline") return kpiMiniBars(k, ki);
    if(k.type === "halfdonut") return kpiHalfDonut(k);
    if(k.type === "share") return kpiShare(k);
    const arrow = k.dc === "u" ? ic("up","ic sm") : k.dc === "d" ? ic("down","ic sm") : ic("dash","ic sm");
    return `<div class="kpi${k.sent ? " sent" : ""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
      <div class="kh">
        <span class="k">${k.k}</span>
        ${k.sent ? `<span class="warnicon" title="${k.sent}">${ic("alert","ic sm")}</span>` : ""}
        <span class="tag ${k.t[0]}">${k.t[1]}</span>
      </div>
      <span class="v num">${k.v}<small>${k.u}</small></span>
      <div class="foot">
        ${k.sp ? `<span class="sp">${sparkline(k.sp)}</span>` : ""}
        <span class="delta ${k.dc} num">${arrow}${k.d}</span>
      </div>
    </div>`;
  }).join("");

  /* 版位：--cs（跨欄）/--rs（跨列）由資料宣告，未給預設 cs:4（1/3 寬）。
     圖表本體先留空（.plot），innerHTML 落定後由 renderCharts 用 ECharts 填入。 */
  const chartHTML = D.charts.map((c,i) => {
    const inner = c.type === "list" ? chList(c, i) : `<div class="plot" data-i="${i}"></div>`;
    /* 多序列圖的圖例統一走面板頁腳（ECharts 內建圖例關掉）→ 圖區高度全給資料 */
    /* 色塊要跟著序列的明度走——五年階梯若圖例一律滿色，圖上分得出來、圖例卻分不出來 */
    /* data-lg ＝ 該序列名稱，點下去切換顯示（見 chEl 的 click 委派）。名稱必須與
       series.name 一字不差——legendToggleSelect 是靠 name 對上的。 */
    const lgOf = arr => `<span class="legend">` + arr.map(s =>
      `<button class="lg" type="button" data-lg="${attr(s.n)}" aria-pressed="true"
        ><i style="--sw:${DV[s.c]}${s.op!=null?`;--swo:${s.op}`:""}"></i>${s.n}</button>`)
      .join("") + `</span>`;
    const leg  = c.type === "line"  ? lgOf(c.series)
               /* c.line2 有值時圖例要跟著長第三項——序列畫出來了、圖例沒有，
                  那條線就變成一條沒人解釋的虛線（且點不掉，切換是靠名稱對上的） */
               : c.type === "combo" ? lgOf([{n:c.bar.n, c:c.bar.c ?? 0}, {n:c.line.n, c:c.line.c ?? 2}]
                   .concat(c.line2 ? [{n:c.line2.n, c:c.line2.c ?? 1}] : []))
               : "";
    return `<section class="panel${c.warn ? " sent" : ""}${(c.cs || 4) >= 6 ? " wide" : ""}" data-type="${c.type}"
        style="--cs:${c.cs || 4};--rs:${c.rs || 1}">
      <div class="phd">
        <div>
          <div class="ph-t"><h3>${c.h}</h3>${c.warn ? `<button class="warnbtn" type="button" aria-label="資料哨兵"
            title="${attr(stripTags(c.warn))}">${ic("alert","ic sm")}</button>` : ""}</div>
          <p class="sub">${c.s}</p>
        </div>
        ${c.legTop ? leg : ""}
        ${c.blocked ? `<span class="blocked">上線前阻斷</span>` : ""}
      </div>
      ${inner}
      ${c.seg ? segHTML(c) : ""}
      ${!c.legTop && leg ? `<div class="pft">${leg}</div>` : ""}
    </section>`;
  });                                       /* 陣列（不 join）→ 下面才能把 KPI 卡插進中間 */

  /* 版位順序＝網格 auto-flow 順序（誰先出現誰先佔格）。
     D.kpiAfter = 先排幾張圖，KPI 卡才插進來；預設 0＝KPI 卡在最前（業績／庫存）。
     促銷／CRM 設 1 → 主角大圖佔左上，KPI 卡退到右上角。 */
  const kAfter = D.kpiAfter || 0;
  chEl.innerHTML = chartHTML.slice(0, kAfter).join("")
                 + kpiHTML
                 + chartHTML.slice(kAfter).join("");

  /* 動態列高：KPI 卡與圖表同排一張網格，用 placeRows 統一推算每列高度——
     含圖表的列 1fr（均分剩餘高度）、純 KPI 卡列 auto（緊湊）。
     業績模組 KPI 卡與 各店櫃／通路 同列 → 該列含圖，卡片會被撐高。
     順序必須與上面的 innerHTML 一致（同樣照 kpiAfter 插入），否則列高會算到別列去。 */
  const chartItems = D.charts.map(c => ({ cs:c.cs || 4, rs:c.rs || 1, chart:true }));
  const layoutItems = [
    ...chartItems.slice(0, kAfter),
    ...(D.kpi || []).map(k => ({ cs:k.cs || 3, rs:k.rs || 1, chart:false })),
    ...chartItems.slice(kAfter)
  ];
  chEl.style.gridTemplateRows = placeRows(layoutItems).join(" ");

  renderCharts(D);
  renderLists(D);
  assertNoClip();
}

/* 清單面板：版面落定後才填得出來（列數是 .rows 實測高度的函數）。
   _lists 留給 ResizeObserver 與分段切換重用，語意等同圖表那邊的 _pxlay。 */
let _lists = [];
function renderLists(D){
  _lists = [];
  chEl.querySelectorAll(".rows[data-li]").forEach(box => {
    const c = D.charts[+box.dataset.li];
    if(!c) return;
    _lists.push({ box, c });
    syncList(box, c);
  });
}
/* 填列 ＋ 同步副標。副標必須跟著切換走：期間換了副標還寫「近 12 個月」，
   會被讀成資料沒更新；列數隨螢幕變、副標卻寫死「前 5 家」也是同一種錯（同 syncSub 的理由）。
   ⚠️ 2026-08-05：副標模板搬到 c.sub(n, seg)，與 c.s（初始文案）並排放在同一個物件裡。
      這順手修掉一個踩過的坑——舊版模板寫死在這裡，而初始文案寫在 c.s，改口徑要記得
      改兩個相隔兩千行的地方，只改一處的話掛載後會被覆寫回舊口徑而且畫面完全正常。
      現在兩份字串上下相鄰，漏改看得到。 */
function syncList(box, c){
  const n = fillList(box, c);
  if(!c.seg || !c.sub) return;
  const sub = box.closest(".panel")?.querySelector(".sub");
  if(sub) sub.textContent = c.sub(n, segOf(c));
}

/* 爆版守門（開發期）：?dev 才跑。
   .panel／.kpi 都是 overflow:hidden——內容超出時「沒有捲軸、沒有 console error」，
   在開發機的單一尺寸上完全看不出來。第十一輪就是這樣讓三張卡的漲跌數字在
   1366／1280／1512×700 上被裁掉而沒人發現。這個斷言把靜默失效變成有聲失效。
   用 setTimeout 不用 requestAnimationFrame：headless（--virtual-time-budget）下
   rAF 不推進，斷言會整個不執行（交接第十六節）。 */
function assertNoClip(){
  if(!/(\?|&)dev\b/.test(location.search)) return;
  setTimeout(() => {
    const bad = [];
    document.querySelectorAll(".panel,.kpi").forEach(el => {
      const dv = el.scrollHeight - el.clientHeight, dh = el.scrollWidth - el.clientWidth;
      if(dv > 1 || dh > 1) bad.push({
        版位: (el.querySelector("h3,.k") || {}).textContent?.trim() || "?",
        縱向超出: dv > 1 ? dv + "px" : "",
        橫向超出: dh > 1 ? dh + "px" : "",
        卡片尺寸: Math.round(el.getBoundingClientRect().width) + "×"
                + Math.round(el.getBoundingClientRect().height)
      });
    });
    if(bad.length){
      console.warn(`⚠️ 爆版 ${bad.length} 處 @ ${page} ${innerWidth}×${innerHeight}`
        + "（overflow:hidden 已把它裁掉，畫面上看不到）");
      console.table(bad);
    }
    /* Hero 量表塊單獨查一次：上面那圈只掃 .panel／.kpi，而 .hero-gauges 不是它們之一。
       它是 flex-wrap:nowrap 又住在 .hero{overflow:hidden} 裡面——加第四格量表時
       **不會換行、不會出捲軸、不會報錯**，就是安靜地被裁掉一截（交接第十六節待辦 4）。
       這裡不量 scrollWidth（nowrap 的 flex 容器自己會被撐大，量不到），改比對它與
       .hero 內容框的左右緣。1px 容差是給次像素捨入用的。 */
    const hg = document.getElementById("hero-gauges"), hero = hg && hg.closest(".hero");
    if(hg && hero){
      const a = hg.getBoundingClientRect(), b = hero.getBoundingClientRect(),
            cs = getComputedStyle(hero),
            l = b.left + parseFloat(cs.paddingLeft), r = b.right - parseFloat(cs.paddingRight),
            over = Math.max(l - a.left, a.right - r);
      if(over > 1) console.warn(`⚠️ Hero 量表塊超出 hero ${Math.round(over)}px `
        + `@ ${page} ${innerWidth}×${innerHeight}——flex-wrap:nowrap ＋ .hero{overflow:hidden}，`
        + "畫面上只會看到被切掉的那一格，不會有捲軸也不會報錯。");
    }
  }, 0);
}
/* 拖窗即時複檢——爆版是「某些高度才會發生」，靜態掛載一次抓不到臨界點。
   節流 150ms：拖曳過程每一像素都跑 querySelectorAll 會拖慢畫面。 */
let _clipT;
addEventListener("resize", () => { clearTimeout(_clipT); _clipT = setTimeout(assertNoClip, 150); });

/* ============================================================
   抽屜 — 答案落在這裡，Dashboard 上的圖完全不動。
   隱式的改動不保存；只有顯式「釘選」才會進 Dashboard。
   （目前是示意答案。接後端時：帶 card context 的走凍結 SQL，
     自由問句走完整 AI，而且每一句自由問句都要記下來——
     問了三次以上的問題，就是該凍結成 Dashboard 元件的問題。）
   ============================================================ */
const drawer = document.getElementById("drawer"),
      db     = document.getElementById("db"),
      dt     = document.getElementById("dt"),
      dex    = document.getElementById("dex"),
      ci     = document.getElementById("ci"),
      dft    = document.getElementById("dft"),
      attwrap= document.getElementById("attwrap"),
      fbov   = document.getElementById("fbov");

const A = {

/* ---- 停止回覆（沿用 index.html 的 send↔stop 切換）------------------
   回覆進行中（思考動畫跑著），送出鈕變成「停止」；按下＝靜默中止這一輪、
   不吐答案，pend 換成一條置中的「您停止了這則回覆」分隔線當作斷點痕跡。 */
let _replyingId = null;             /* 目前正在回覆的 turn；null＝沒有在跑 */
function _setReplying(on, id){
  _replyingId = on ? id : null;
  ci.disabled = on;
  const btn = document.getElementById("cs");
  if(btn){
    btn.classList.toggle("is-stop", on);
    btn.innerHTML = ic(on ? "stop" : "send", "ic sm");
    btn.setAttribute("aria-label", on ? "停止回覆" : "送出");
  }
}
function stopReply(){
  const id = _replyingId; if(id == null) return;
  stopThink(id); stopType(id); delete _elapsed[id];
  const turn = db.querySelector(`.turn[data-t="${id}"]`);
  const a = turn && turn.querySelector(".a");
  if(a){                                  /* 正在逐字吐答案：留住已吐出的部分，砍掉游標與未出現的追問 */
    const cr = a.querySelector(".caret"); if(cr) cr.remove();
    const chips = a.querySelector(".chips"); if(chips) chips.remove();
    a.insertAdjacentHTML("afterend", `<div class="stopped">您停止了這則回覆</div>`);
  } else {                                /* 還在思考、還沒有內容：整段換成分隔線 */
    const pend = document.getElementById(`pend-${id}`);
    if(pend) pend.outerHTML = `<div class="stopped">您停止了這則回覆</div>`;
  }
  _setReplying(false);
  db.scrollTop = db.scrollHeight;
}

const GOLDEN_POOL = [...new Set([].concat(...Object.values(QC), Object.keys(A)))];
function sampleChips(n){
  const p = GOLDEN_POOL.slice();
  for(let i=p.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
  return p.slice(0, n);
}

/* 思考軌跡收合摘要（「已思考 X 秒 · N 步」）點擊展開——正常答案與 demo 故障卡共用。 */

/* ---- 回饋：讚/倒讚（答案品質訊號，與後端凍結判斷無關，見 CSS .fb 註解）---------
   讚＝靜默記錄；倒讚＝先記錄再開 drawer 內彈窗收原因（不因懶得補充而遺失負評）。
   狀態存 _fb[id]，歷史重開 thread 會由 wireFeedback→syncFb 還原。
   真接後端時把 postFeedback 換成打 API；demo 只 console.log（比照 index.html）。 */
const _fb = {};        /* _fb[id] = {vote:'up'|'down', categories:[], detail}（本次 render 的 id 對照） */
const _turnObj = {};   /* id → thread 的 turn 物件；回饋要落在它上面才能跨「重開歷史」還原 */

let _fbTimer = null;   /* 感謝畫面自動關閉計時 */
let _fbPrev = null;    /* 開倒讚彈窗前的評價：沒送出就關 → 還原它（不留孤兒 active） */
let _fbDone = false;   /* 這次彈窗是否已送出（送出才是真的倒讚，取消不算） */
let _fbMode = "down";  /* 'down'＝倒讚回饋（收評價）；'report'＝問題回報（不動評價，見錯誤卡）*/
function fbHTML(id, hidden){
  return `<div class="fb" data-fb="${id}"${hidden?" hidden":""}>
       <button class="fbtn fb-up" type="button" title="有幫助" aria-pressed="false" aria-label="這則回答有幫助">${ic("thumbUp")}</button>

function wireFeedback(scope, id){
  const fb = scope.querySelector(`.fb[data-fb="${id}"]`); if(!fb) return;
  fb.querySelector(".fb-up").addEventListener("click", () => setVote(id, "up"));
  fb.querySelector(".fb-down").addEventListener("click", () => setVote(id, "down"));

  const v = _fb[id] && _fb[id].vote;

}
function setVote(id, vote){
  const cur = _fb[id] && _fb[id].vote;
  if(cur === vote){ delete _fb[id]; persistFb(id); syncFb(id); return; }   /* 再點一次同一顆＝收回 */
  if(vote === "up"){ _fb[id] = {vote:"up"}; persistFb(id); syncFb(id); postFeedback(id); return; }
  /* 倒讚：先讓鈕亮起（視覺回饋），但**不落地**——要送出才算數。取消/關閉會還原成 _fbPrev。 */
  _fbPrev = _fb[id] || null;

}

/* 把回饋寫回 thread 的 turn 物件——重開歷史時 turn 會拿到新 id，靠這份才還原得回來。 */
function persistFb(id){

/* ---- 倒讚彈窗 ---- */
const fbOtherCb = document.getElementById("fbother-cb"),
      fbOther   = document.getElementById("fbother"),

    : "感謝您花時間告訴我們！<b>每一則回饋都能讓 FLAPS AI 變得更好。</b>任何不符合預期的地方，請放心分享。";

/* ---- 打字機：逐字吐答案，讓輸出有「正在生成」的動態感 -----------------
   答案含行內標記（<em>/<b>/<br>），不能直接切字串（會切斷標籤）。先把 HTML 切成
   「一個完整標籤／實體」或「一個字」的 token，再逐 token 累加後重寫 innerHTML——
   標籤成對累加，瀏覽器每步都收得住。標籤不佔一拍（跟著前一個字一起吐），只有「字」推進節奏。 */
const TYPE_MS = 18;       /* 每一拍毫秒 */
function tokenizeHTML(html){
  const out=[]; let i=0;
  while(i<html.length){
    const c=html[i];
    if(c==='<'){ const j=html.indexOf('>',i), k=j<0?html.length-1:j; out.push(html.slice(i,k+1)); i=k+1; }
    else if(c==='&'){ const j=html.indexOf(';',i); if(j>-1 && j-i<=8){ out.push(html.slice(i,j+1)); i=j+1; } else { out.push(c); i++; } }
    else { out.push(c); i++; }
  }
  return out;
}
function typeInto(id, el, html, perTick, done){
  const toks = tokenizeHTML(html); let k=0, acc="";
  const eat=()=>{ while(k<toks.length && toks[k][0]==='<') acc+=toks[k++]; };  /* 標籤不佔拍 */
  eat();                                                    /* 先吐掉開頭的標籤 */
  el.innerHTML = acc + (k<toks.length ? '<i class="caret"></i>' : '');
  _type[id] = setInterval(()=>{
    if(!el.isConnected){ stopType(id); return; }            /* thread 被切走／關閉 → 收手 */
    for(let n=0; n<perTick && k<toks.length; n++){ acc+=toks[k++]; eat(); }
    const more = k<toks.length;
    el.innerHTML = acc + (more ? '<i class="caret"></i>' : '');
    db.scrollTop = db.scrollHeight;
    if(!more){ stopType(id); done && done(); }
  }, TYPE_MS);
}
/* animate＝現場新問（逐字吐）；false＝重開歷史／減量動畫（直接鋪、不重演）。 */
function revealAnswer(id, q, animate){
  stopThink(id);
  const turn = db.querySelector(`.turn[data-t="${id}"]`); if(!turn){ _setReplying(false); return; }
  const pend = turn.querySelector(`#pend-${id}`); if(!pend){ _setReplying(false); return; }
  if(_typed[id] && !_demo[id]){         /* 自由輸入且非 demo 故障 → 拒答卡（不鋪思考軌跡） */
    pend.outerHTML = noansHTML();
    wireReject(turn);
    delete _typed[id]; delete _elapsed[id]; delete _demo[id]; _setReplying(false);
    db.scrollTop = db.scrollHeight; return;
  }
  const trace = pend.querySelector(".trace");
  const hasTrace = trace && trace.querySelector(".tstep");
  let head = "";
  if(hasTrace){
    const secs = (_elapsed[id] || 0).toFixed(1);
    const n = trace.querySelectorAll(".tstep").length;
    head = `<div class="trace-wrap collapsed">
       <button class="trace-sum" type="button" aria-expanded="false">
         ${ic("chev","ic sm")}<span>已思考 ${secs} 秒 · ${n} 步</span></button>
       ${trace.outerHTML}</div>`;
  }
  const kind = _demo[id];
  if(kind){                             /* demo 故障/截斷：思考跑完後鋪對應卡，保留思考軌跡摘要 */
    pend.outerHTML = head + (kind==="timeout" ? timeoutHTML(id)
                          : kind==="fail"    ? failHTML(id)
                          : truncAnswerHTML());
    wireTraceSum(turn);
    if(kind!=="trunc") wireErrCard(turn, id, q);
    delete _typed[id]; delete _elapsed[id]; delete _demo[id]; _setReplying(false);
    db.scrollTop = db.scrollHeight; return;
  }
  const r = A[q] || GENERIC;
  const doType = animate && !reduced();
  pend.outerHTML = head + `<div class="a">
       <p class="av"></p>
       <p class="ab"></p>
       <div class="chips"${doType?" hidden":""}>${r.f.map(f=>`<button class="chip" type="button">${f}</button>`).join("")}</div>
       ${fbHTML(id, doType)}
     </div>`;
  turn.querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => {          /* 點一顆＝選定，整排追問移除，避免回頭重複選 */
      const q = b.textContent.trim(), row = b.closest(".chips");
      if(row) row.remove();
      ask(q, null);
    }));
  wireFeedback(turn, id);   /* 回饋鈕接線 ＋ 從 _fb[id] 還原讚/倒讚態（歷史重開會用到） */
  wireTraceSum(turn);
  const a = turn.querySelector(".a"),
        avEl = a.querySelector(".av"), abEl = a.querySelector(".ab"), chipsEl = a.querySelector(".chips"),
        fbEl = a.querySelector(".fb");
  if(doType){
    /* 結論句逐字吐 → 內文（快一點）→ 追問 chips ＋ 回饋列一起淡入；全程 _replyingId
       維持著，停止鈕在打字階段仍是「停止」，按下就留住已吐出的部分（見 stopReply）。 */
    typeInto(id, avEl, r.v, 1, () =>
      typeInto(id, abEl, r.b, 2, () => {
        chipsEl.hidden = false; chipsEl.classList.add("rin");
        if(fbEl){ fbEl.hidden = false; fbEl.classList.add("rin"); }
        db.scrollTop = db.scrollHeight; _setReplying(false);
      }));
  } else {
    avEl.innerHTML = r.v; abEl.innerHTML = r.b; _setReplying(false);
  }
  delete _typed[id];
  delete _elapsed[id];
  db.scrollTop = db.scrollHeight;
}
/* Claude 式軌跡：步驟逐條 append，前一條做完打勾留著，最後一條是動態。 */
function runThink(id, q, ctx){
  const pend = document.getElementById(`pend-${id}`); if(!pend) return;
  _setReplying(true, id);
  const steps = traceSteps(q, ctx);
  pend.innerHTML = `<div class="trace" id="trace-${id}"></div>`;
  const wrap = document.getElementById(`trace-${id}`);
  const t0 = performance.now();
  let si = -1, fi = 0;
  const frameTimer = setInterval(() => {
    if(!wrap.isConnected){ stopThink(id); return; }   /* thread 被切走／關閉 → 收手 */
    fi = (fi + 1) % LOGO_FRAMES.length;
    const p = wrap.querySelector(".tstep.active .tdot path"); if(p) p.setAttribute("d", LOGO_FRAMES[fi]);
  }, 280);
  const advance = () => {
    const cur = wrap.querySelector(".tstep.active");   /* 收掉上一條：打勾、轉灰 */
    if(cur){ cur.classList.replace("active","done");
      cur.querySelector(".tdot").innerHTML = ic("check","ic sm"); }
    si++;
    if(si >= steps.length){ _elapsed[id] = (performance.now() - t0) / 1000; revealAnswer(id, q, true); return; }
    const [tt, td] = steps[si];
    wrap.insertAdjacentHTML("beforeend",
      `<div class="tstep active"><span class="tdot">${logoSvg(fi)}</span>
         <span class="tlbl"><span class="tt">${tt}</span><span class="td">${td}</span></span></div>`);
    db.scrollTop = db.scrollHeight;
  };
  advance();                                            /* 第一條立刻出現 */
  const stepTimer = setInterval(advance, STEP_MS);
  _think[id] = {frameTimer, stepTimer};
}

/* 一輪：引用（可選）＋ 問 ＋ 答，append 而非覆寫。
   animate＝現場新問（先思考再出答案）；false＝重開歷史（直接鋪，不重演）。 */
function renderTurn(q, ctx, animate, typed, turnObj){
  const id = ++TURN_SEQ;
  _typed[id] = !!typed;
  if(typed) _demo[id] = classifyDemo(q);               /* demo：關鍵字模擬故障/截斷；''＝拒答 */
  _turnObj[id] = turnObj || null;                       /* 回饋落點：thread 的 turn 物件 */
  if(turnObj && turnObj.fb) _fb[id] = {...turnObj.fb};  /* 重開歷史：把上次的評價 hydrate 回來 */
  db.insertAdjacentHTML("beforeend",
    `<div class="turn" data-t="${id}">
       ${ctx ? ctxHTML(ctx) : ""}
       <p class="q">${q}</p>
       <div class="pend" id="pend-${id}"></div>
     </div>`);
  db.scrollTop = db.scrollHeight;
  /* 拒答直接鋪（沒在算就別演在算）；chip 問答與 demo 故障/截斷都先跑思考動畫（像真的查了才有結果/失敗）。 */
  if(animate && !reduced() && (!typed || _demo[id])) runThink(id, q, ctx);
  else revealAnswer(id, q, false);
}
/* 追加一輪到當前 thread；沒有當前 thread 就先開一串。typed＝非 chip 的自由輸入。 */
function ask(q, ctx, typed){
  if(!TH) startThread(q, ctx, typed);
  else { const t = {q,ctx,typed}; TH.turns.push(t); renderTurn(q, ctx, true, typed, t); }
}
/* 開新的一串（舊的先存進歷史） */
function startThread(q, ctx, typed){
  archive();
  TH = {title:q, turns:[{q,ctx,typed}]};
  dt.textContent = trim_(q);
  stopAllThink(); db.innerHTML = "";
  renderTurn(q, ctx, true, typed, TH.turns[0]);
  showDrawer();
}
/* 把當前 thread 收進側欄歷史（同一串重開再關不會重複堆） */
function archive(){
  if(!TH || !TH.turns.length) return;
  const i = HIST.indexOf(TH); if(i > -1) HIST.splice(i,1);
  HIST.unshift(TH); TH = null; renderHist();
}
function showDrawer(){
  /* 從「關著」變「開著」時才復位尺寸與位置——使用者拖過／拉過的版面只保留到關閉為止。
     ⚠️ 復位放在這裡而不是 close_()：close_ 當下抽屜還在淡出，那時復位會看到它彈回右側。
     抽屜「已經開著」時再開新的一串（點另一張圖的深入分析）不復位，
     否則正在對照看圖的版面會在眼前跳掉。 */
  if(!drawer.classList.contains("on")) resetDrawer();
  drawer.classList.add("on");
  drawer.setAttribute("aria-hidden","false");
  ci.focus();
}
/* 對外：Hero（askbar／快捷 chips）的入口。
   ⚠️ 抽屜**開著**＝延續當前同一串（ask append，同一視窗、同一紀錄）；
      抽屜**關著**＝開新的一串並展開。圖表〔深入分析〕走 openDig（先選角度）。 */
function open_(q, ctx, typed){
  if(drawer.classList.contains("on")) ask(q, ctx, typed);
  else startThread(q, ctx, typed);
}

/* ---- 深入分析：開「選角度」開場 -------------------------------------
   點圖表的〔深入分析〕不直接問一句，而是先在抽屜鋪一個開場：
   引用（這張圖）＋ 提示 ＋ 一排「角度」chips。選一顆角度，那句才成為

   ✅ 文案已全量對齊 golden 294（chips_golden_mapping.xlsx「深入分析」分頁）。每組三句的邏輯是
   「這張圖答不了的事 → 下鑽一層 → 換維度橫向對照」，且刻意避開圖上直接讀得到答案的問法。
   標 `←改寫自 xxx` 的句子不是 golden 原文，是為了去掉綁死的事件／日期而調整過的版本，
   上線前要跑 ask_golden.py retrieve 實測 top-1 ≥ 0.5（清單見該檔「工程待辦」分頁）。 */
const DIG_MORE = {
  /* 業績 */
  /* ⚠️ 2026-08-04 換掉第 3 句。原本是 業績-37（S5）「今年業績達成率整體怎麼樣？」——

     ⚠️ 同日稍後使用者再把「去年全年」改成「去年同期」——這是修掉一個真的錯：
        卡的大數字是**年度累計**（今年只走到 6 月），拿半年去比去年全年本來就不對等。
        改後屬改寫（換詞），要跑 cosine 實測（業績-81 原句用的是「去年全年」）。 */
  "目標達成率":["上個季度業績有沒有按照計畫走？"/* 業績-79 S5 */,"今年業績有沒有超過去年同期？"/* ←改寫自 業績-81 S1 */],
  /* ⚠️ 2026-08-04 兩句一起換。原本是「街邊店最近業績表現怎麼樣？有沒有哪幾家掉比較多？」
     （改寫自 業績-8）與「這個月哪個門市業績成長最快？」（改寫自 業績-80）——三句全是 S4，

/* ---- 抽屜可拖曳、可縮放 -------------------------------------------------
   預設仍是右側靠邊的浮卡（CSS 的 top/right/bottom）。使用者一動它才切成
   .free ＋ 明確的 left/top/width/height——在那之前不要寫死尺寸，否則視窗
   一縮，抽屜就凸出畫面外。尺寸／位置記在 BOX，關掉再開會回到使用者擺的地方。
   標頭連按兩下＝復位。 */
/* MARGIN 用 --space-4＝預設浮卡離螢幕邊緣的縫隙，拖曳時的邊界跟它對齊 */
const MINW = 380, MINH = 240, MARGIN = 16;
let BOX = null, drag = null;
/* ⤢ 最大化：撐到近滿版（避開左 rail、四周留 MARGIN）。⤡ 還原＝回到按下前的狀態。
   ⚠️ 這不是 ③ 全屏對話（那換版型、且卡在「吸收 vs 跳頁」）——這只是視窗最大化，
   還是同一個抽屜。maximized 記狀態、_preMax 記按下前的 BOX（null＝當時是預設浮卡）。 */
let maximized = false, _preMax = null;

/* 把目前的實際位置固定下來（第一次拖／拉時呼叫） */
function dockDrawer(){
  if(BOX) return;
  const r = drawer.getBoundingClientRect();
  BOX = {x:r.left, y:r.top, w:r.width, h:r.height};
  drawer.classList.add("free"); applyBox();
}
function applyBox(){
  drawer.style.left   = BOX.x + "px";
  drawer.style.top    = BOX.y + "px";
  drawer.style.width  = BOX.w + "px";
  drawer.style.height = BOX.h + "px";
}
/* 完全不許出界：抽屜是唯一能看到答案的地方，被拖出去一半就等於答案被裁掉。
   ⚠️ 左界不是 0 而是 rail 寬——側欄 z-index 66 蓋在抽屜(61)之上，
   貼到 x=16 會鑽進 rail 底下、左緣文字被吃掉（截圖才看出來的）。
   先夾尺寸（不得大於可用區），再夾位置（右／下界要扣掉自身寬高）。 */
const RAIL = parseInt(getComputedStyle(document.documentElement)
               .getPropertyValue("--rail")) || 56;
function clampBox(){
  const minX = RAIL + MARGIN;
  const maxW = innerWidth - minX - MARGIN, maxH = innerHeight - MARGIN*2;
  BOX.w = Math.min(Math.max(MINW, BOX.w), maxW);
  BOX.h = Math.min(Math.max(MINH, BOX.h), maxH);
  BOX.x = Math.min(Math.max(minX,   BOX.x), innerWidth  - BOX.w - MARGIN);
  BOX.y = Math.min(Math.max(MARGIN, BOX.y), innerHeight - BOX.h - MARGIN);
}
function resetDrawer(){
  BOX = null; drawer.classList.remove("free");
  drawer.style.left = drawer.style.top = drawer.style.width = drawer.style.height = "";
  setMax(false); _preMax = null;      /* 任何復位都同時解除最大化，圖示回 ⤢ */
}
/* ⤢／⤡ 一顆鈕兩種狀態 */
function setMax(on){
  maximized = on;
  dex.innerHTML = ic(on ? "shrink" : "expand","ic sm");
  dex.setAttribute("aria-label", on ? "還原大小" : "放大");
}
function maxBox(){
  const minX = RAIL + MARGIN;
  return {x:minX, y:MARGIN, w:innerWidth - minX - MARGIN, h:innerHeight - MARGIN*2};
}
function toggleMax(){
  if(!maximized){
    _preMax = BOX ? {...BOX} : null;   /* null＝按下前是預設浮卡（還原時 resetDrawer） */
    dockDrawer();
    BOX = maxBox(); clampBox(); applyBox();
    setMax(true);
  } else if(_preMax){
    BOX = {..._preMax}; clampBox(); applyBox();
    setMax(false); _preMax = null;
  } else {
    resetDrawer();                     /* resetDrawer 內已 setMax(false) */
  }
}

function onMove(e){
  if(!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py, s = drag.start;
  if(drag.mode === "move"){ BOX.x = s.x + dx; BOX.y = s.y + dy; }
  else {
    const m = drag.mode;
    if(m.includes("e")) BOX.w = Math.max(MINW, s.w + dx);
    if(m.includes("s")) BOX.h = Math.max(MINH, s.h + dy);
    /* 往左／上拉：寬高增加的同時，原點要跟著往回移 */
    if(m.includes("w")){ BOX.w = Math.max(MINW, s.w - dx); BOX.x = s.x + (s.w - BOX.w); }
    if(m.includes("n")){ BOX.h = Math.max(MINH, s.h - dy); BOX.y = s.y + (s.h - BOX.h); }
  }
  clampBox(); applyBox();
}
function endDrag(){
  if(!drag) return;
  drag = null;
  drawer.classList.remove("dragging","resizing");
  removeEventListener("pointermove", onMove);
  removeEventListener("pointerup", endDrag);
}
function beginDrag(e, mode){
  /* 最大化狀態下手動拖／拉 → 視為離開最大化（圖示回 ⤢，之後 ⤡ 不會亂還原） */
  if(maximized){ maximized = false; _preMax = null; setMax(false); }
  dockDrawer();
  drag = {mode, px:e.clientX, py:e.clientY, start:{...BOX}};
  drawer.classList.add(mode === "move" ? "dragging" : "resizing");
  addEventListener("pointermove", onMove);
  addEventListener("pointerup", endDrag);
  e.preventDefault();
}
drawer.querySelector(".dhd").addEventListener("pointerdown", e => {
  if(e.target.closest("button")) return;      /* ⤢／✕ 照常可點 */
  beginDrag(e, "move");
});
drawer.querySelectorAll(".rz").forEach(h =>
  h.addEventListener("pointerdown", e => beginDrag(e, h.dataset.rz)));
drawer.querySelector(".dhd").addEventListener("dblclick", e => {

/* 視窗變動時：最大化中就重算滿版，否則把抽屜拉回可見範圍 */
addEventListener("resize", () => {
  if(!BOX) return;
  if(maximized) BOX = maxBox();
  clampBox(); applyBox();
});

document.getElementById("dx").addEventListener("click", close_);
/* ⤢ ＝最大化 ↔ 還原（視窗控制）。真正的 ③ 全屏對話（換版型）等「吸收 vs 跳頁」
   拍板後另接——屆時可以是「已最大化時再按一次才進 ③」。 */
dex.addEventListener("click", toggleMax);

const sendCi = () => {

   按 Enter 選字會被當成「送出」，把半成品或錯字直接送掉。isComposing／keyCode 229＝

/* 頂欄常駐輸入列 —— 自由問句一律走完整 AI（第一版不做路由器），
   而且每一句都要記進側欄的歷史：問了三次以上的問題，就是該凍結成元件的問題。 */

/* ---- 側欄：預設收起，展開是 overlay（不推擠主區） ---- */

/* ---- 側欄的兩個對話入口 ----
   點一則歷史 → openThread()：thread 本來就住在抽屜(②)，重開它不需要知道 ③ 長什麼樣，

   「吸收進 dashboard.html vs 跳去 index.html」尚未拍板（見 進度與交接.md 第十一節），

   跳頁＝location.href + sessionStorage 交接）。刻意留白，不先接之後要拆的假動作。 */

const histlist = document.getElementById("histlist");

/* 種幾串舊對話，讓側欄一開就有東西（都對到 A{} 裡的凍結答案，點下去秒回）。
   接後端後改成讀真實歷史。 */
[["現在最快斷貨的前十款是哪些？", null],

/* 收起態只有 icon，靠 tooltip 補回標籤 */
[["plane","開啟選單"],["newchat","新對話"],["search","搜尋對話"]].forEach(([id,label]) => {

/* ============================================================
   Hero 數字卡下鑽：各店櫃明細彈窗
   ============================================================ */
const drillov = document.getElementById("drillov"),
      drillTb = document.getElementById("drill-tb");
document.getElementById("drill-x").innerHTML = ic("x");
let _drillFrom = null;                       /* 開啟前的焦點，關閉時還回去 */

const drillOpen = () => drillov.classList.contains("open");
/* 客單價由業績與筆數導出（業績單位是萬 → ×10000 才是元）。單一來源，全檔共用。 */
const _aov = (amt, cnt) => Math.round(amt * 10000 / cnt);

/* 資料集登錄表：Hero 卡的 data-drill 就是這裡的 key。
   彈窗的 DOM／CSS／鍵盤行為只有一套，換模組＝換資料集，不複製第二個彈窗。
   每個資料集要提供：title / rows / metrics / cols / val / nums / flag（見各自定義處）。 */
/* ⚠️ 2026-08-06：`member: MEMBER_DRILL` 換成 `newc: NEWC_DRILL`（見該處的改建說明）。
   **key 改名要與 M["促銷"].hero[0].drill 一起改**——對不上時 openDrill 第一行的
   `if(!S …) return` 會讓那張卡靜默點不開，畫面照常、不報錯。 */
const DRILLS = { store: STORE_DRILL, wh: INV_DRILL,
                 newc: NEWC_DRILL, camp: CAMP_DRILL, disc: DISC_DRILL,
                 mtier: MEMBER_TIER_DRILL, mact: MEMBER_ACT_DRILL };

/* ⚠️ 2026-08-03 擴了三個**選用**欄位，都有預設值 → STORE_DRILL／INV_DRILL 不用改：
     S.rowHead   第一欄表頭（預設「店櫃／通路」）。CAMP_DRILL 的列是檔期不是店。
     S.groups    分組與小計，`[{k:群組鍵, sub:小計標籤或 null}]`
                 （預設 `[{k:"on",sub:"線下小計"},{k:"off",sub:null}]` ＝ 原本寫死的行為）。
     S.units     逐欄單位陣列（預設全部回退到 metrics[metric].unit）。
                 CAMP_DRILL 四欄分別是 萬／萬／人／萬。
   ⚠️ 單位**不能塞進 `cols[i][3]`**（第一版是這樣寫的，錯了）：`INV_DRILL` 的 cols
      本來就是 `["目前",2,3,4]` 四元素——第 4 個是滯銷欄索引。塞進去的結果是庫存表頭
      變成「目前（4）／上月（7）／去年同期（10）」，**不報錯、只有表頭數字看起來很怪**。
      用獨立的 `S.units` 陣列就沒有索引撞車的問題。
   ⚠️ 合計列**一律逐欄相加**，這是引擎的前提而不是巧合——所以資料集的欄位只能放
      可加總的絕對量。放比率欄（毛利率／ROI）會算出「合計 ＝ 各列相加」這種
      看起來正常、實際無意義的數字，而且不會報錯。 */
function openDrill(kind, metric){
  const S = DRILLS[kind];
  if(!S || !S.metrics[metric]) return;
  const M_ = S.metrics[metric], C = S.cols;
  const HEAD = S.rowHead || "店櫃／通路";
  const GRPS = S.groups || [{k:"on", sub:"線下小計"},{k:"off", sub:null}];
  /* 一格的值＝把該欄成對的兩個原始量餵進被點的指標，由資料集自己的 val 決定怎麼組合
     （業績：amt／cnt／兩者相除；庫存：總額／滯銷／兩者相減）。 */
  const val = (r, col) => S.val(r, col, metric);
  /* ── 高亮／排序欄（2026-08-06）────────────────────────────────────────────
     原本寫死第 0 欄。CRM 的兩張卡共用一份資料集但頭條窗不同（新入會看近 28 天、
     有消費看近 12 個月），所以改成可指定：先看該 metric 自己的 hi，再看資料集層的
     S.hi，都沒有就是 0 —— 既有四個資料集一個字都不用改。
     ⚠️ 這忠於下面那條註解原本的意思（「被點的那一欄＝這次下鑽的主角」），
        只是在此之前「被點的那一欄」剛好永遠是第 0 欄。 */
  const HI = M_.hi != null ? M_.hi : (S.hi || 0);
  /* 小計／合計：先把原始量逐欄加總、再套指標——不是把各列的值平均
     （客單價的加權不同，平均起來會對不上 Hero 的 2,580）。 */
  const aggRow = (pick, label) => {
    const s = S.rows.filter(pick);
    const row = [label, ""];
    for(let i = S.nums[0]; i <= S.nums[1]; i++) row[i] = s.reduce((a,r) => a + r[i], 0);
    return row;
  };
  /* ── 去重合計（2026-08-06）─────────────────────────────────────────────────
     背景：**檔期會重疊**（demo 七檔就有三組，EM26SS 完全包住 EM 0401），而「人」不能
     被切成兩半——同一個人在兩檔的窗口裡首購，他真的屬於兩檔。所以**人數相關的欄位
     逐檔相加會大於實際人數**，那個和是「人次」不是「人」。
     ⚠️ 這件事對金額／筆數欄**不成立與否目前未確認**（見 S.dedup 各資料集的註解），
        所以引擎不去猜哪一欄該去重——**由資料集逐欄指定**（`dedup` 的鍵就是欄索引）。
     做法：合計列上方多一列「逐檔相加」（原始加總，退一階顯示），合計列本身的指定欄
     改用 `dedup` 給的去重值，並在數字後面釘一個 † 指向表尾說明。
     ⚠️ 去重值**不是前端算得出來的**（前端只拿得到逐檔的數），必須由後端一支
        COUNT(DISTINCT 會員ID) 供給。少了它就退回原本的行為（見下面的 if）。 */
  const DD = S.dedup;
  const dedupRow = () => {
    const row = aggRow(() => true, DD.label || "合計 · 去重");
    for(const k in DD.v) row[k] = DD.v[k];
    return row;
  };
  const by  = (a,b) => val(b, C[HI]) - val(a, C[HI]);   /* 依高亮欄由高到低（見上方 HI） */

  /* 第一欄（當期）＝這張卡的 Hero 大數字本身，給它高亮當視線起點。
     dag＝去重欄要釘的 †（只在合計列上出現，指向表尾說明）。 */
  const tr = (r, cls, dag) => `<tr class="${cls||""}">`
    + `<td>${r[0]}${r[S.flag]?`<span class="flag">${r[S.flag]}</span>`:""}</td>`
    + C.map((c,i) => `<td class="${i===HI?"on":""}">${F(val(r,c))}`
        + (dag && DD.v[c[1]] != null ? `<span class="dag">†</span>` : "") + `</td>`).join("")
    + `</tr>`;
  drillTb.innerHTML = `<thead><tr><th>${HEAD}</th>`
    + C.map((c,i) => `<th class="${i===HI?"on":""}">${c[0]}（${(S.units && S.units[i]) || M_.unit}）</th>`).join("")
    + `</tr></thead><tbody>`
    + GRPS.map(g => S.rows.filter(r => r[1] === g.k).sort(by).map(r => tr(r)).join("")
        + (g.sub ? tr(aggRow(r => r[1] === g.k, g.sub), "sub") : "")).join("")
    /* 掛了 dedup 才多一列「逐檔相加」；沒掛就是原本的單一合計列。 */
    + (DD ? tr(aggRow(() => true, DD.rawLabel || "逐檔相加"), "raw") : "")
    + tr(DD ? dedupRow() : aggRow(() => true, "合計"), "tot", !!DD)
    + `</tbody>`;

  const ft = document.getElementById("drill-ft");
  ft.innerHTML = (DD && DD.note) || "";
  ft.hidden = !(DD && DD.note);

  document.getElementById("drill-t").innerHTML = `${S.title} · <em>${M_.title}</em>`;

  _drillFrom = document.activeElement;
  drillov.classList.add("open");
  drillov.setAttribute("aria-hidden","false");
  document.getElementById("drill-x").focus();
}
function closeDrill(){
  if(!drillOpen()) return;
  drillov.classList.remove("open");
  drillov.setAttribute("aria-hidden","true");
  if(_drillFrom && _drillFrom.isConnected) _drillFrom.focus();
  _drillFrom = null;
}
/* 事件委派掛在 hero-gauges 上——卡片每次切分頁都重繪，掛在卡片本身會掉。 */
gaugesEl.addEventListener("click", e => {
  const b = e.target.closest("[data-drill]");
  if(b) openDrill(b.dataset.drill, b.dataset.metric);
});
document.getElementById("drill-x").addEventListener("click", closeDrill);
drillov.addEventListener("click", e => { if(e.target === drillov) closeDrill(); });  /* 點外面關 */

/* Esc：挑圖模式優先——只取消挑圖，不要順手把抽屜也關掉 */
addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(drillOpen()){ closeDrill(); return; }  /* 明細彈窗是最上層：Esc 只關它 */
  if(fbOpen()){ closeFb(); return; }        /* 倒讚彈窗開著：Esc 只關彈窗，不關抽屜 */
  if(picking()){ closePick(); return; }
  close_(); closeSide(); closeProfile();
});

draw();
</script>

<!-- ── 開場 loading 動畫驅動（自 index.html 移植；index 的 _stagger 內容進場為該頁專屬，未移植）── -->
<script>
(function(){
  const _sleep = ms => new Promise(r => setTimeout(r, ms));
  const TAGLINE = "從提問到洞察，幾秒內完成";
  let _done = false;
  function _finish(){
    if(_done) return; _done = true;
    const ov = document.getElementById("intro-overlay");
    if(ov){ ov.classList.add("intro-out"); setTimeout(() => { if(ov.parentNode) ov.remove(); }, 650); }
  }
  async function _run(){
    const ov = document.getElementById("intro-overlay");
    const wordEl = document.getElementById("intro-wordmark-wrap");
    const aiTagEl = document.getElementById("intro-ai-tag");
    const tagEl = document.getElementById("intro-tagline");
    if(!ov) return;
    ov.addEventListener("click", _finish);
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      /* 無障礙底線（DS 規則 8）：直接跳到結束態 */
      if(wordEl) wordEl.classList.add("revealed");
      if(aiTagEl) aiTagEl.classList.add("visible");
      if(tagEl){ tagEl.style.opacity = "1"; tagEl.textContent = TAGLINE; }
      await _sleep(400); _finish(); return;
    }
    /* Phase 1：wordmark 左→右 reveal（.sheen 底下自己來回掃光） */
    if(wordEl) wordEl.classList.add("revealed");
    await _sleep(1600); if(_done) return;
    /* Phase 1b：停在掃光的 wordmark 上當「載入中」的一拍 */
    await _sleep(2000); if(_done) return;
    if(aiTagEl) aiTagEl.classList.add("visible");
    /* Phase 2：tagline 打字機 */
    await _sleep(320); if(_done) return;
    tagEl.style.opacity = "1";
    for(const ch of TAGLINE){ if(_done) return; tagEl.textContent += ch; await _sleep(78); }
    /* Phase 3：shimmer 停頓 → Phase 4：淡出露出 dashboard */
    tagEl.classList.add("shimmer");
    await _sleep(1050); if(_done) return;
    _finish();
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", _run);
  else _run();
}());
</script>
