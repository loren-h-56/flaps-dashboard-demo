   圖表區 420→400）；收一階後是 236，圖表區 432 —— 五種高度全部改善。
   ⚠️ min-width:1280px 是必要的：下方 max-width:1279 那段已把 hero 改成四邊等距 --space-4，
      不加寬度條件，這段會在「窄又矮」的視窗把左右內距又推回 --space-6。 */
@media (min-width:1280px) and (max-height:820px){
  .hero{padding:var(--space-4) var(--space-6) var(--space-3);}
  .heroleft{gap:var(--space-2);}
  .heroright{gap:var(--space-3);}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}
  .hero::before,.hero::after{animation:none;}}

/* ─── 開場 loading 動畫（自 index.html 移植）：wordmark 掃光 reveal → AI → tagline 打字 → 淡出 ─── */
#intro-overlay{position:fixed;inset:0;z-index:10000;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  user-select:none;-webkit-user-select:none;}
#intro-overlay.intro-out{animation:introFadeOut .6s cubic-bezier(.4,0,.6,1) forwards;pointer-events:none;}
@keyframes introFadeOut{to{opacity:0;}}
#intro-logo-area{position:relative;display:flex;align-items:baseline;justify-content:center;gap:14px;}
/* clip-path 只控制 wordmark 何時左→右現身；光本身是 .sheen 自己的循環（DS 規則 7） */
/* 只用 clip-path 做左→右 wipe；不加 overflow:hidden（會多裁掉粗體 S 的右緣）。
   revealed 右側留 -6%（負 inset＝往外擴）確保 S 完整不被切。 */
.intro-wordmark-wrap{position:relative;display:inline-block;clip-path:inset(0 100% 0 0);}
.intro-wordmark-wrap.revealed{clip-path:inset(0 -6% 0 0);transition:clip-path 1.6s var(--ease-out);}
#intro-wordmark{font-size:84px;}
.intro-ai-tag{font-family:var(--font-mono);font-size:16px;font-weight:var(--fw-medium);
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;
  opacity:0;transition:opacity .4s var(--ease-out);}
.intro-ai-tag.visible{opacity:1;}
/* tagline：ink→iris→coral shimmer（小字用 --accent-2-ink 保 AA 對比） */
#intro-tagline{font-family:var(--font-body);font-size:15px;font-weight:var(--fw-medium);
  letter-spacing:.8px;text-align:center;min-height:26px;
  background:linear-gradient(90deg,var(--text) 0%,var(--accent) 28%,var(--accent-2-ink) 50%,
    var(--accent) 72%,var(--text) 100%);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;opacity:0;transition:opacity .4s var(--ease-out);}
#intro-tagline.shimmer{animation:introShimmer 2s ease .1s both;}
@keyframes introShimmer{from{background-position:200% center;}to{background-position:-100% center;}}
#intro-skip-hint{position:absolute;bottom:24px;font-family:var(--font-mono);font-size:10px;
  color:color-mix(in srgb,var(--text),transparent 82%);letter-spacing:.5px;pointer-events:none;}
@media (prefers-reduced-motion:reduce){
  .intro-wordmark-wrap{clip-path:inset(0 0 0 0)!important;}
  .intro-ai-tag,#intro-tagline{transition:none;}
  #intro-tagline.shimmer{animation:none;}}
</style>
</head>
<body>

<!-- ── 開場 loading 動畫 ── -->
<div id="intro-overlay">
  <div id="intro-logo-area">
    <div class="intro-wordmark-wrap" id="intro-wordmark-wrap">
      <span class="wm sheen" id="intro-wordmark">FLAPS</span>
    </div>
    <span class="intro-ai-tag" id="intro-ai-tag">AI</span>
  </div>
  <div id="intro-tagline"></div>
  <div id="intro-skip-hint">點擊任意處跳過</div>
</div>

<div class="sscrim" id="sscrim"></div>
<aside class="side" id="side" aria-label="對話紀錄與帳號">
  <div class="shd">
    <button class="plane" id="plane" type="button" aria-label="開啟選單">
      <i></i>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m10 8 4 4-4 4"/></svg>
    </button>
    <span class="logo"><span class="wm sheen">FLAPS</span><b>AI</b></span>
    <button class="tog" id="tog" type="button" aria-label="收起選單">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
  </div>

  <div class="srail">
    <button class="sbtn" id="newchat" type="button"></button>
    <button class="sbtn" id="search" type="button"></button>
  </div>
  <div class="sdiv"></div>

  <!-- 對話資產：抽屜裡的每一串關閉後都落在這裡，點回去可以原封不動繼續問。
       清單由 JS 的 HIST 生成（renderHist），不寫死。
       ⚠️「釘選」區已於第六次 session 移除——大欄維持不捲、不做客製化，
       抽屜那顆〔把這個加進 Dashboard〕不接，留著只會承諾一個不存在的功能。 -->
  <div class="sbody" id="sbody">
    <span class="slbl">近期對話</span>
    <div id="histlist"></div>
  </div>

  <div class="sft profile" id="profile">
    <button class="sftbtn" id="profile-btn" type="button" aria-haspopup="menu" aria-expanded="false">
      <span class="ava">王</span>
      <span class="pinfo"><b id="pname">王老闆</b><em>全店權限</em></span>
      <span class="chev"></span>
    </button>
    <div class="pmenu" id="pmenu" role="menu" aria-label="帳號選單">
      <button class="pmi" type="button" role="menuitem" data-act="settings">設定</button>
      <hr class="pmdiv">
      <button class="pmi" type="button" role="menuitem" data-act="terms">服務條款</button>
      <button class="pmi" type="button" role="menuitem" data-act="privacy">隱私權政策</button>
      <button class="pmi" type="button" role="menuitem" data-act="report">問題回報</button>
      <hr class="pmdiv">
      <button class="pmi danger" type="button" role="menuitem" data-act="logout">登出</button>
    </div>
  </div>
</aside>

<header class="hero">
  <div class="heroleft">
    <div class="hero-greet">
      <b id="ttl">歡迎回來</b>
      <span class="greet-sub">從提問到洞察，幾秒內完成</span>

const tip = document.getElementById("tip");
function showTip(e, html){
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 10) + "px";
  tip.style.top  = Math.max(e.clientY - r.height - 12, 8) + "px";
}
const hideTip = () => tip.classList.remove("on");

function sparkline(d){
  const W=100, H=26, mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
  const pt = d.map((v,i)=>[i/(d.length-1)*W, H-(v-mn)/rg*(H-4)-2]);
  const path = pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const e = pt[pt.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${path} L${W} ${H} L0 ${H} Z" fill="var(--dv-1-soft)"/>
    <path d="${path}" fill="none" stroke="var(--dv-1)" stroke-width="1.6"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="2.4" fill="var(--dv-1)"
      stroke="var(--paper)" stroke-width="1.4"/></svg>`;
}

/* ============================================================
   圖表引擎 — ECharts（自 host：vendor/echarts.min.js，SVG renderer）
   主題不寫死：每次繪製從 CSS token 讀色 → light/dark、改 token 都自動跟上。
   手刻 SVG 時代的敘事細節，在此以 ECharts 手法對應保留：
     · 高亮柱 → per-item itemStyle 換色＋數值標籤
     · 參考線 → markLine   · 哨兵警示色（ci=9）→ per-item 換警示色
     · 甜甜圈中央數字 → title   · 柱圖 note 註記 → graphic text
   ============================================================ */
function dvTokens(){
  const s = getComputedStyle(document.documentElement), g = n => s.getPropertyValue(n).trim();
  return {
    dv:[g('--dv-1'),g('--dv-2'),g('--dv-3'),g('--dv-4'),g('--dv-5')],
    grid:g('--dv-grid'), tick:g('--text-muted'), body:g('--text-body'), soft:g('--accent-soft'),
    text:g('--text'), paper:g('--paper'), border:g('--border'), warn:g('--color-warning'),
    good:g('--color-success'), bad:g('--color-danger'),
    isDark: document.documentElement.getAttribute('data-theme')==='dark'
  };
}

/* ── 排名圖的「顯示幾列」隨圖區高伸縮 ─────────────────────────────
   c.topN = { mode, min, max, pitch }：資料給**完整排序清單**，這裡依實測圖區高截出要畫的列。
     mode:'headtail' → 取前 k ＋ 後 k（頭尾對照，n 必為偶數）；'head' → 純 Top-N。
     pitch → 每列最少要有幾 px 才讀得下去（含 11px 標籤）。

   ⚠️ **pitch 不是全站一個值**。17 是為 rs:2 的密集排名圖（各店櫃達成率）量出來的下限；
      rs:3／rs:4 的圖如果沿用 17，1366 上就會冒出 9–14 列——那不是「隨螢幕伸縮」，
      是把一張主角圖變成密密麻麻的清單。實際用值：
        各店櫃達成率 rs:2 → 17（4–8 列）    斷貨風險 rs:4 → 34（7–12 款）
        週轉最差品類 rs:3 → 24（6–8 類）    全年檔期排行 rs:4 → 34（7–10 檔）
      判準：這張圖是「掃一眼抓重點」還是「逐列讀完」。前者放寬 pitch，後者才收緊。

   ⚠️ **母體是封閉集合的圖不要套 topN**。判斷式是「第 N+1 列從哪來」有沒有答案。
      舊例子（各通路促銷 ROI，四個通路就是全量）已於 2026-08-03 隨圖移除，
      但規則本身仍然成立——庫存「週轉最差品類」的 max 封在 8 就是同一條
      （品類本來只有十來個，列到第 9、10 名已是週轉正常的品類）。
   ⚠️ 反過來也要小心：**「目前只填了 N 筆」不等於「母體只有 N 個」**。各促銷機制毛利率
      初版只給 5 種，看起來像封閉集合，其實機制在 ERP 的活動設定檔裡想開幾種就幾種——
      那次的正解是把母體編到 10 種再套 topN，不是硬套在 5 種上。

   ⚠️ **不可以用螢幕寬度（@media）決定列數。** 實測：1440×900 的圖區高 134px，比
      1470×841 的 115px 還多 19px —— 較窄的螢幕反而放得下更多列，因為它比較高。
      寬度斷點在這裡會給出相反的答案。唯一可靠的輸入是 buildOption 收到的 H，
      而且必須是 chart.getHeight()（真實畫布）不是 el.clientHeight（含 padding，多 4px）。

   ⚠️ pitch 的下限是量出來的不是猜的：現況 1366 的 各店櫃達成率 就是 4 列、列距 18.3px，
      那是已經在出貨的密度。取 17 讓 1440/1600（圖區 134）剛好進到 6 列，實際列距 17.7px，
      與現行密度同級。調小這個值之前先去 1366 上看字有沒有開始黏。

   實測階梯（gridH = H − grid.top − grid.bottom）：
     1366×768   H 97  gridH 73  → 4 列（前2後2）
     1470×841   H 111 gridH 87  → 5→偶數 4 列
     1440/1600  H 130 gridH 106 → 6 列（前3後3）
     1920×1080  H 190 gridH 166 → 9→偶數 8，封頂 max=8（前4後4）
     2560×1440  H 310 gridH 286 → 16，封頂 8
   ⚠️ max 封在 8 是刻意的：24 家店顯示 14 家已經不是「頭尾對照」，
      而是一張中間破洞的完整排名，那要改用可捲清單而不是這張圖。 */
function pickRows(c, H){
  const tn = c.topN;
  if(!tn) return { d:c.d, k:null };
  const gridH = (H||0) - (c.note?26:(c.ref!=null?18:8)) - 6;
  let n = Math.floor(gridH / (tn.pitch||17));
  if(tn.mode==='headtail') n -= n % 2;            /* 頭尾對稱 → 只能是偶數 */
  n = Math.max(tn.min, Math.min(tn.max, n, c.d.length));
  /* 'head' 的 k ＝ 顯示總列數（副標寫「前 {k} 名」）；'headtail' 的 k ＝ 每邊幾名。
     兩者語意不同但都由副標文案自行說清楚，這裡只負責給數字。 */
  if(tn.mode!=='headtail') return { d:c.d.slice(0,n), k:n };
  const k = Math.floor(n/2);
  /* 列數多到頭尾會重疊時就整份畫出來（避免同一家店出現兩次） */
  return { d: n>=c.d.length ? c.d : [...c.d.slice(0,k), ...c.d.slice(-k)], k };
}
/* 副標裡的 {k} ＝ 目前每邊顯示幾名。列數會隨螢幕變，副標就不能寫死「前後各 2 名」——
   同一張圖在不同機器顯示不同家數、副標卻說 2 名，會被讀成資料錯了。 */
function syncSub(el, c, H){
  if(!c.topN || !/\{k\}/.test(c.s||'')) return;
  const sub = el.closest('.panel')?.querySelector('.sub');
  if(sub) sub.textContent = c.s.replace('{k}', pickRows(c, H).k);
}

/* c = M 裡的原生圖表物件（沿用既有 schema，不另立資料格式）→ ECharts option */
/* 漏斗流失欄（graphic）：第 2 層起，每個「步階」（層與層之間）標它較上一層的流失 %，
   貼著漏斗右緣、隨漏斗收窄往內移。位置用實際容器寬高 W/H 回推像素——
   · 垂直：步階＝下層頂邊（兩段間的縫）中心
   · 水平：ECharts 漏斗寬度映射 wf(v)=minSize+(1-minSize)·v/maxV（min=0、maxSize=100%、
     funnelAlign 置中、左右各留 6%），算出該步階右緣 x，再往外 8px 貼齊。
   不寫死尺寸；resize 後由 renderCharts 帶新 W/H 重呼叫。文字走設計規範 muted 色票、克制字重。 */
/* ⚠️ c.cmp ＝ 對照世代（選用），`{n:"正價", d:[逐層值]}`。只用來算**逐層流失率**，
   不畫第二個漏斗——漏斗的形狀已經被主世代佔滿，疊第二個只會互相遮蔽。
   為什麼要有它：單一漏斗給得出「掉了 67%」，卻給不出「67% 算好還是壞」。
   ⚠️ **兩個數字不能排成同一行。** 流失標籤起點是 `edgeX+8`，而 edgeX 取的是**下一層**
      的邊緣——第一步（12,480→4,120）的 wf ＝ 0.558，edgeX ＝ 0.746×W，
      右邊只剩 0.254×W（1280 是 71px、1470 是 83px），而「↓ 67%（正價 ↓52%）」約 106px
      會直接溢出面板。改成上下兩行：主行 12px、對照行 10px，寬度 ~62px，最窄的 1280 也放得下。
   ⚠️ 對照行低於主行 ＝ 促銷世代流失得更兇，這一層上 danger 色。**只有主行變色**，
      對照行永遠是 tick——顏色在這裡只說一件事：「這一層比正價掉得更快」。 */
function funnelDrops(c, tk, H, W){
  const n=c.d.length, Hh=H||220, Ww=W||330, pad=8, gpx=3;
  const seg=(Hh-2*pad-(n-1)*gpx)/n, maxV=c.d[0][1], minSize=0.34, band=0.88*Ww, cx=0.5*Ww;
  const wf=v=> minSize+(1-minSize)*v/maxV, g=[];
  const cd=c.cmp&&c.cmp.d&&c.cmp.d.length===n?c.cmp.d:null;
  for(let i=1;i<n;i++){
    const d=Math.round((c.d[i-1][1]-c.d[i][1])/c.d[i-1][1]*100);
    const cdp=cd?Math.round((cd[i-1]-cd[i])/cd[i-1]*100):null;
    const worse=cdp!=null&&d>cdp;
    const stepY=pad+i*seg+(i-1)*gpx+gpx/2, edgeX=cx+wf(c.d[i][1])*band/2;
    /* 有對照行時主行往上讓 7px，兩行合起來仍以 stepY 為中心 */
    g.push({ type:'text', left:edgeX+8, top:cdp!=null?stepY-7:stepY,
      style:{ text:'↓ '+d+'%', fill:worse?tk.bad:tk.tick, fontSize:12, fontWeight:500,
        textAlign:'left', textVerticalAlign:'middle' } });
    if(cdp!=null) g.push({ type:'text', left:edgeX+8, top:stepY+7,
      style:{ text:(c.cmp.n||'對照')+' ↓'+cdp+'%', fill:tk.tick, fontSize:10, fontWeight:400,
        textAlign:'left', textVerticalAlign:'middle' } });
  }
  return g;
}

/* 熱力圖的 grid 基準（buildOption 與 squareHeat 共用一份，避免兩邊的數字走鐘）。 */
/* 底部色標的預留高度 40（原 26）：26 只夠色標本身，量到的淨空是「離 x 軸標籤 9px、
   離卡片底緣 7px」——擠在最下面。40 讓色標可以往上擺，兩側都有呼吸空間
   （實測後變成 離標籤 10px、離底緣 18px）。代價是熱力格少 14px 高，可接受。
   ⚠️ 只加在 vm==='bottom'。全站現在只剩庫存那張熱力圖（各倉×庫齡）用 bottom 色標；
   業績原本那張 7×5 已於 2026-07-31 換成「百貨抽成成本」清單。 */
const heatGrid = c => ({ left:6, right: c.vm==='bottom'?8:60, top:3,
  bottom: c.vm==='bottom'?40:3, containLabel:true });

/* ── 熱力圖的列縮減：`c.cap` ＝ 最多畫幾列 ──────────────────────────
   實務上倉別會遠多於畫面放得下的數量（總倉／區域倉／退貨倉／客訂暫存／各電商平台倉／
   街邊店倉…，8–15 列起跳）。這裡把完整清單縮成 cap 列：
     **依最後一欄（180 天+）佔該列的比重由高到低排序 → 取前 cap−1 列 → 其餘逐欄加總成末列。**

   ⚠️ 排序**不分列數多寡一律執行**（不是只在超過 cap 時才排）。理由是這張圖問的是
      「哪個倉囤的是老貨」——把老貨佔比最高的排最上面，整張圖才有由上而下的閱讀方向；
      只在超過 cap 時才排序會讓同一張圖在不同資料量下有兩種列序，讀者無從預期。

   ⚠️ cap 的上限是**量出來的**（2026-07-31 實測，六尺寸，判準沿用 dashboard.html 既有的
      「cs:3 中文標籤 17px 列距開始黏、24px 舒適」）。1366×768 是地板：
        rs:4 → 8 列格高 25.8px 舒適 ／ 11 列 18.7px 是硬上限
        rs:6 → 10 列 24.8px 舒適 ／ 13 列 19.1px 是硬上限（已經像橫條不像格子）
      現用 rs:6 ＋ cap 8 → 1366 上格高 31.0px，長寬比 0.53，還有餘裕。
      **要放寬 cap 之前先回去量，不要照抄這裡的數字**——格高是面板高的函數，
      而面板高隨可視高度伸縮（見第七節版位速查那張表）。 */
function heatRows(c){
  const y = c.y, g = c.grid, last = (g[0] || []).length - 1;
  const share = r => { const s = r.reduce((a,b) => a+b, 0); return s ? r[last]/s : 0; };
  const idx = y.map((_,i) => i).sort((a,b) => share(g[b]) - share(g[a]));
  const cap = c.cap || 0;
  if(!cap || y.length <= cap) return { y: idx.map(i => y[i]), g: idx.map(i => g[i]) };
  const keep = idx.slice(0, cap-1), rest = idx.slice(cap-1);
  /* 末列＝其餘各倉**逐欄加總**（不是平均）：合併後這一列的庫齡輪廓仍然是真的，
     列正規化算出來的佔比也還是對的。 */
  const sum = g[0].map((_,ci) => rest.reduce((a,i) => a + g[i][ci], 0));
  return { y:[...keep.map(i => y[i]), `其他 ${rest.length} 倉`], g:[...keep.map(i => g[i]), sum] };
}

/* 把熱力圖的格子校成正方形。
   為什麼要校：格子寬高由「面板寬 ÷ 欄數」與「面板高 ÷ 列數」各自決定，兩者無關。
   業績的 7 欄 × 5 列在 1470 螢幕上量到格子 39×49（**高比寬多 25%**），
   讀熱力圖是在比色塊的相對深淺，格子不等比會讓橫向與縱向的比較尺度不一致。
   （庫存的 4×4 本來就接近 1:1，這段對它幾乎不動作——slack < 4px 就直接跳過。）

   做法：寬度被 cs:3 鎖死不能加，所以只能收高度。收下來的餘裕**不全塞在底下**——
   45% 給上緣（圖與副標之間），55% 給下緣（正好讓「低—高」色標有呼吸空間，
   原本它是貼著 x 軸標籤的）。

   ⚠️ **1:1 已經改成「容忍到 1.15 為止」，slack 上限從 22% 收到 7%。** 原因是實測發現
      「處處正方」在大螢幕上根本做不到、卻付了很貴的代價：
        2560×1440 上圖區 599×640，7 欄 × 5 列要正方需要 599×428 —— **212px 沒地方去**。
        舊設定（上限 22%）挖掉 141px（上 63／下 78），格子仍然是 1.16:1（沒真的方），
        使用者回報「上下空白間距太大」，紅框正是那兩個洞。
      根因是面板高度隨螢幕高長得比寬快（Hero 268 與面板開銷 88 是常數，越大的螢幕
      被扣掉的比例越小）：同一個面板在 1366 是 301×214（1.41，橫）、2560 是 599×640
      （0.94，直）。**沒有任何固定的格子形狀能同時貼合這兩個比例**，所以只能二選一：
      要方就得挖洞，不挖洞格子就得長一點。現在選後者。
      實測結果：1366／1470 本來就接近方（1.12 以內）→ 完全不動作，零留白；
      2560 挖 45px（上 20／下 25，原本 141），格子 1.40:1。
      要往回調就改 AR 與那個 .07；兩個方向都會動到「洞的大小」與「格子的方正」，
      這是一條線上的兩端，沒有兩全的設定。

   ⚠️ 必須先把 grid 還原成基準再量：第二次呼叫（resize）時，量到的會是上一次已經
      校正過的格子，不還原就會一路把圖越收越扁。 */
function squareHeat(chart, c){
  chart.setOption({ grid: heatGrid(c) });
  /* ⚠️ 列數要問 heatRows 不是 c.grid.length——套了 c.cap 之後畫面上的列數比資料少，
     用原始列數算 need 會高估要補的高度，補出來的洞剛好是被縮掉那幾列的份。 */
  const hr = heatRows(c);
  const rows = hr.g.length, cols = hr.g[0] ? hr.g[0].length : 0;
  if(rows < 2 || cols < 2) return;
  const a = chart.convertToPixel({gridIndex:0}, [0,0]);
  const b = chart.convertToPixel({gridIndex:0}, [1,1]);
  if(!a || !b) return;
  const cw = Math.abs(b[0]-a[0]), ch = Math.abs(b[1]-a[1]);
  /* AR＝容忍到「高是寬的 1.15 倍」為止（不是硬校 1:1），slack 再夾在圖高的 7% 以內。
     兩道限制的分工：AR 決定「要不要動」，7% 決定「最多挖多大的洞」。理由見上方註解。 */
  const AR = 1.15, budget = Math.round(chart.getHeight() * .07);
  const need = Math.round((ch - cw * AR) * rows);
  if(need < 4) return;                        /* 已經在容忍範圍內，不為 3px 折騰 */
  /* ⚠️ **全有或全無**：補不到位就一點都不要補。
     部分校正是最糟的一格——付了洞的代價，卻沒換到方格子。實測 2560：補滿要 97px、
     預算只有 45px，硬補的結果是挖掉 45px 的洞、格子從 1.51 只變到 1.40（幾乎沒差）。
     跳過的話洞是 0、格子 1.51 —— 在那個直立比例的面板裡，1.5:1 的格子看起來很自然，
     141px（舊設定）或 45px 的空洞看起來是版面壞了。
     於是：筆電（≤1470，本來就差一點點）補到方、大螢幕零留白讓格子長一點。 */
  if(need > budget) return;
  const slack = need;
  const g = heatGrid(c), up = Math.round(slack * .45);
  chart.setOption({ grid:{ ...g, top:g.top + up, bottom:g.bottom + (slack - up) } });
}

/* ── 滾動 12 個月的相對 x 軸（c.roll）─────────────────────────────
   資料仍以**日曆年**存放（每條 series.d 都是 1–12 月），這裡只負責把它切成
   「今年最後一個有資料的月份 +1，往前推 12 格」的相對窗。

   為什麼要這樣切：日曆 x 軸在年初會讓本期線退化——1 月時只剩**一個點**，
   一個點畫不出趨勢，整張圖等於空的。滾動窗讓本期線永遠是滿的 12 格，
   只有最末那一格（尚未發生的當月）是空的，形狀仍然說得出「才走到一半」。

   切法（lastIdx=5／6 月時）：
     anchor = 6（7 月）→ 窗 = 8月,9月,10月,11月,12月,1月,…,6月,7月
     每條線在 m<=anchor 的格子取「自己那年」，m>anchor 取「前一年」——
     所以第 i 條線的前段來自 series[i+1]，最舊那條（i=4）沒有下一條可取，
     由 c.tail 補（見資料物件）。少了 tail，最舊那條的前 5 格會整段消失。
   ⚠️ anchor 夾在 11：今年若已滿 12 個月，窗就退回單純的日曆年、不留空格，
      否則會需要「下一年」的資料而那是不存在的。 */
function rollWindow(c){
  const Y = c.series.map(s => s.d);
  let last = -1; Y[0].forEach((v,i) => { if(v != null) last = i; });
  const anchor = Math.min(last + 1, 11);
  const order = []; for(let k = 11; k >= 0; k--) order.push(((anchor - k) % 12 + 12) % 12);
  const srcOf = (i,m) => m <= anchor ? Y[i] : (Y[i+1] || c.tail);
  return {
    x: order.map(m => c.month[m]),
    series: c.series.map((s,i) => ({ ...s,
      d: order.map(m => { const a = srcOf(i,m); return a ? (a[m] ?? null) : null; }) }))
  };
}

function buildOption(c, tk, H, W, sel){
  const tip = { confine:true, textStyle:{fontSize:11,color:tk.body},
    backgroundColor:tk.paper, borderColor:tk.border, borderWidth:1,
    extraCssText:'border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:8px 11px;' };
  const axX = { axisLine:{show:false}, axisTick:{show:false}, axisLabel:{color:tk.tick,fontSize:11} };
  const axY = { splitLine:{lineStyle:{color:tk.grid,type:'dashed'}}, axisLine:{show:false},
    axisTick:{show:false}, axisLabel:{color:tk.tick,fontSize:11,formatter:v=>F(v)} };

  /* ── Line：多線；缺值斷點不連（今年只到 6 月 → 線自然收在半路，不假裝有資料）。
       序列可各自宣告：
         s.c    palette 索引（跨序列用「不同顏色」時用）
         s.op   明度（0–1）  s.w 線寬  s.dash [實,虛] 虛線 pattern  s.sym:false 不畫點
       為什麼要 op/dash：五年對照若給五個語意色，等於五個語意在同一張圖裡互搶，
       而且 dv-3 在本站一直是警示／強調色。改用**同色明度階梯**——年份的「遠近」直接
       對應「淡濃」，不查圖例也知道哪條是哪年；虛線 pattern 再疊一層冗餘編碼，
       色盲與低對比螢幕上仍分得出來。色仍出自 --dv-1，沒有新增品牌 hex。
       z：先宣告的畫在上層 → 今年永遠壓在過去年份之上，不會被淡線蓋掉。
       c.mark（x 軸類別值）→ 垂直虛線標轉折點；c.ref（y 值）→ 水平基準線（如 0 成長）；
       c.smooth 覆寫平滑度（多線交纏時要調低，0.35 會讓交叉點糊掉）；c.note → 右上註記 ── */
  if(c.type==='line'){
  const R = c.roll ? rollWindow(c) : null;      /* c.roll → 相對 x 軸；否則照 c.x 畫 */
  const X = R ? R.x : c.x, SER = R ? R.series : c.series;
  return {
    animation:true,
    tooltip:{ trigger:'axis', ...tip,
      valueFormatter:v=> v==null?'—':F(v)+(c.unit||'') },
    legend:{ show:false },                              /* 圖例走面板頁腳，避免重複 */
    grid:{ left:6, right:14, top: c.note?26:12, bottom:0, containLabel:true },
    xAxis:{ type:'category', data:X, boundaryGap:false, ...axX },
    /* c.ymin：截斷 y 軸。多年對照比的是「形狀與相對位置」，不是量體——0 起算會把
       五條線全擠進上半部（實測 214px 的圖裡，2,887–5,428 只用掉 42% 高度，下半部全空）。
       ⚠️ 只有 line 開放這個參數：柱狀圖截斷基準會誇大量級，那是另一回事（見 miniLineOption 註解）。 */
    yAxis:{ type:'value', ...(c.ymin!=null?{min:c.ymin}:{}), ...axY },
    series: SER.map((s,si)=>{
      const col = tk.dv[s.c], op = s.op ?? 1, ml = [];
      if(si===0 && c.mark!=null) ml.push({ xAxis:c.mark,
        label:{ show:!!c.markLabel, formatter:c.markLabel, position:'insideEndTop',
          color:tk.dv[2], fontSize:11, fontWeight:600 },
        lineStyle:{ color:tk.dv[2], type:'dashed', width:1.5 } });
      if(si===0 && c.ref!=null) ml.push({ yAxis:c.ref, label:{show:false},
        lineStyle:{ color:tk.tick, type:'dashed', width:1 } });
      return {
        name:s.n, type:'line', data:s.d, smooth: c.smooth ?? 0.35, connectNulls:false,
        symbol:'circle', symbolSize:5, showSymbol: s.sym!==false, z: 10-si,
        lineStyle:{ width:s.w ?? 2.5, color:col, opacity:op, type:s.dash || 'solid' },
        itemStyle:{ color:col, opacity:op, borderColor:tk.paper, borderWidth:1.5 },
        markLine: ml.length ? { silent:true, symbol:'none', data:ml } : undefined
      };
    }),
    graphic: c.note?[{ type:'text', right:6, top:6,
      style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } }]:[]
  };
  }

  /* ── Deltabar：YoY 跌幅橫條表。每一列 ＝ 名稱｜跌幅條｜YoY%｜本月金額。
     為什麼是這個圖型（前三代的死路寫在 業-C2 的資料物件上方，別重走）：
     佔比類圖表撞的是「變化量比水位小一個數量級」的尺度天花板，換成畫**變化量本身**之後
     天花板就消失了——軸是 0–36%，−10% 到 −33% 吃滿整條寬（1366 實測 127px 可畫），
     對比小倍數走勢表在垂直方向只有 7px 可用。

     三個設計決定，各自解掉一個具體的誤讀：
     ① **c.ref 參考線（全公司 YoY）**：沒有它就只是四個數字排排站。有了它，四列被切成
        「比公司平均還糟」與「撐住的」兩群，超過線的那幾條換 danger 色——這條線才是本圖的論點。
     ② **右側金額欄不可省**：第三方平台 −10.0% 看起來最健康，但它只有 234 萬；
        真正該擔心的是 1,612 萬的百貨專櫃。少了這一欄，YoY 圖必然把讀者引到錯的地方。
     ③ **依跌幅排序**（資料物件裡就排好，這裡不再排）：形狀本身說「線上跌得比線下少」，
        所以不需要分群 hairline——那正是上一代黏字爆版的元兇。

     ── 軸：**真正的分歧軸**（上一版是「跌幅軸」，條長取絕對值一律往右長，只有全負時才成立）──
     現在 x 軸帶正負號，0 有真實位置：負值往左長、正值往右長，混合正負也畫得對。

     ⚠️ **0 不強制置中**。軸域取 [min(0,各值,ref), max(0,各值,ref)] 再往外側各留 5%，
     所以 0 落在它「該落的地方」：
       全負（現況四列）→ 0 在最右緣，條往左長，最長那條吃掉 95% 圖寬
       混正負          → 0 落在中間某處，兩側各自長出去
       全正            → 0 在最左緣，退化成一般橫條圖
     為什麼不做對稱置中：cs:3 在 1366 上圖區只有約 127px 寬，強制對稱會讓全負資料
     只用到左半的 63px，條長腰斬一半而右半全空。0 的位置本身就是資訊——它在最右緣，
     說的正是「沒有任何一個通路在成長」。

     ⚠️ **`c.ref` 是帶號的**（−27.1 不是 27.1）。它同時是參考線位置與 danger 的判準：
     `v < ref` ＝ 跌得比全公司更兇 ＝ 在拖累整體。用帶號比較，全公司平均是正的時候
     也一樣成立（成長 2% 而公司平均 5% → 仍是落後方），不必為正負各寫一套。
     舊版寫 `Math.abs(v) > c.ref` 只在雙方同為負時才等價。 */
  if(c.type==='deltabar'){
    const rows=c.rows, n=rows.length, Hh=H||101, Ww=W||301;
    /* ⚠️ pad ＝ 內容左右不貼面板內緣。這格是自己用 graphic 排欄的，**不會自動吃到**
       hbar／bar 那條 `grid:{left:6,…}` 的約定，第一版寫死 left:0／right:0 → 實測
       內容左右留白只有 1px（其餘六格是 5–8px），通路名貼左緣、金額貼右緣。
       用 tools/measure.sh 量「內容左／內容右」可以直接抓到這種問題。 */
    const pad=6;
    /* 兩側落地寬度按容器寬按比例讓，但不低於「字寫得完」的下限（同 smallmult 的算法）：
       名稱最長 5 個中文字（第三方平台）＝ 11px×5 ≈ 55；「−32.8%」≈ 42；「1,612 萬」≈ 50。 */
    const nameW=pad+Math.max(56, Math.min(84, Ww*0.24)), pctW=46, amtW=56, rightW=pctW+amtW+pad;
    /* 底部留一條給參考線說明。矮於 72px 時放棄它——列高會掉到 17px 以下，11px 的通路名
       就會開始貼線（上一代 hairline 壓字的成因，見 業-C2 註解）。 */
    const refLabH = (c.ref!=null && Hh>=72) ? 15 : 0, top0=4, botPad=refLabH||4;
    const gridH=Hh-top0-botPad, rowH=gridH/n, plotW=Ww-nameW-rightW;
    /* 軸域含 0 與 c.ref：0 一定要在軸上（不然「分歧」無從談起），參考線若落在最長那條
       之外也不能被切掉，那條線是整張圖的論點。外側各留 5% 免得最長的條頂到格線邊。 */
    const vals=rows.map(r=>r[1]);
    const lo0=Math.min(0, ...vals, c.ref!=null?c.ref:0),
          hi0=Math.max(0, ...vals, c.ref!=null?c.ref:0), span=(hi0-lo0)||1;
    /* 只往有資料的那一側外擴：全負時右界維持在 0（不留白），全正時左界維持在 0 */
    const vlo=lo0<0?lo0-span*0.05:0, vhi=hi0>0?hi0+span*0.05:0, vspan=(vhi-vlo)||1;
    const xOf=v=>nameW+(v-vlo)/vspan*plotW, midY=i=>top0+(i+0.5)*rowH;
    /* 條粗綁列高（不寫死 px）：1366 列高 20px → 9px，1920 列高 44px → 16px 封頂 */
    const barW=Math.max(6, Math.min(16, rowH*0.46));
    /* 跌得比全公司更兇（v < ref）＝ 在拖累整體 → danger；成長 → success；其餘 dv-1。
       ⚠️ 順序不能顛倒：正成長的列即使低於一個正的公司平均，也先吃 success——
       「在成長」是比「落後平均」更該先讀到的一件事，用紅色標一個正成長的通路會誤導。 */
    /* ⚠️ `c.inv` ＝ **漲是壞事**（庫存用；業績不用）。同一個 deltabar 引擎服務兩種語意：
         業績：成長＝好 → v>0 綠、跌得比全公司更兇（v<ref）＝紅
         庫存：囤積＝壞 → v<0 綠（貨在消化）、漲得比全公司更兇（v>ref）＝紅
       沒有這個開關的話，庫存件數 +29.9% 會被塗成綠色——那是**反過來的**，
       而且顏色錯得無聲無息（畫面照樣好看，只是把最該處理的品類標成健康）。 */
    const worse = v => c.ref!=null && (c.inv ? v>c.ref : v<c.ref);
    const better = v => c.inv ? v<0 : v>0;
    const colOf=v=> better(v) ? tk.good : (worse(v) ? tk.bad : tk.dv[0]);
    /* ⚠️ 百分比**文字**不跟著條的顏色走，兩個理由：
       ① 無障礙：暗色的 dv-1（#7A6FF0 對 #141A33）只有 4.37:1，當 11px 小字**過不了 AA 4.5**。
          條子是圖形物件（門檻 3.0）沒問題，字不行。實測四色對比：
          淺色 dv-1 6.29／danger 4.93／muted 5.11；暗色 dv-1 4.37❌／danger 5.92／muted 4.71。
       ② 語意：三個數字上 iris、一個上紅，等於「預設色」也被當成一種色。改成中性色打底、
          只有超過全公司跌幅那列才上警示色之後，顏色才真的只在說一件事。 */
    const txtOf=v=> better(v) ? tk.good : (worse(v) ? tk.bad : tk.text);
    const sign=v=> (v>0?'+':'−')+Math.abs(v).toFixed(1)+'%';
    /* ⚠️ graphic 的 top 定位的是元素**邊界框上緣**，`textVerticalAlign:'middle'` 並**不會**
       把它改成「以 top 為中心」——實測四列名稱整體低了 5.5px（= 半個字高），而長條是
       ECharts 依格線排的，於是名稱與條穩定錯開半行。所以垂直一律自己扣半個字高，
       不依賴 textVerticalAlign（水平方向的 right + textAlign:'right' 兩者同向，可以並用）。
       估寬：CJK 約 1 個字級、半形約 0.55 個字級。 */
    const estW=(t,px)=>[...t].reduce((w,ch)=>w+(/[　-鿿＀-￯]/.test(ch)?px:px*0.55),0);
    const topOf=(i,fs)=>midY(i)-fs/2;
    const g=[];
    rows.forEach((r,i)=>{
      const [nm,v,amt]=r;
      g.push({ type:'text', left:pad, top:topOf(i,11), style:{ text:nm, fill:tk.body,
        font:'11px sans-serif' } });
      g.push({ type:'text', right:amtW+pad, top:topOf(i,11), style:{ text:sign(v), fill:txtOf(v),
        font:'600 11px sans-serif', textAlign:'right' } });
      /* 金額走 muted＋常規字重：它是「這條有多重要」的上下文，不是主角，
         給它跟 YoY 一樣的份量會讓兩欄互相打架。 */
      g.push({ type:'text', right:pad, top:topOf(i,10.5), style:{ text:F(amt)+(c.unit||''),
        fill:tk.tick, font:'10.5px sans-serif', textAlign:'right' } });
    });
    /* ⚠️ 參考線用 graphic 畫，**不要用 markLine**。markLine 靠 ECharts 動畫展開，而
       ECharts 動畫走 requestAnimationFrame——headless（--virtual-time-budget）下 rAF 不推進，
       實測那條線在 SVG 裡塌成 0.16px 高（d="M167.5 4L167.5 4.156"），截圖與量測都看不到它。
       這條線是整張圖的論點，不能掛在動畫上。graphic 是靜態繪製，一次到位。 */
    /* 0 基線：實線 hairline，用 --border（比參考線的 tick 淡一階）。
       ⚠️ 分歧軸一定要畫它，否則「往左長多少」沒有起點可讀。全負時它會落在圖區最右緣、
       看起來像格線收邊，那是對的——0 就在那裡；有正值時它才會移進來變成真正的分界。
       畫在 ref 之前 → 虛線的參考線疊在上面，兩線重合時讀得到的是有標籤的那條。 */
    const zx=xOf(0);
    g.push({ type:'line', shape:{ x1:zx, y1:top0, x2:zx, y2:top0+gridH },
      style:{ stroke:tk.border, lineWidth:1 }, z:1 });
    if(c.ref!=null){
      const rx=xOf(c.ref);
      g.push({ type:'line', shape:{ x1:rx, y1:top0, x2:rx, y2:top0+gridH },
        style:{ stroke:tk.tick, lineWidth:1, lineDash:[4,2] }, z:3 });
    }
    if(refLabH){ const t=c.refLab||('平均 '+c.ref+'%'), w=estW(t,10);
      /* 貼著參考線置中，但夾在 [名稱欄右緣, 金額欄左緣] 之內——1366 上這兩者只差 127px，
         不夾的話標籤會壓到左邊的通路名或右邊的金額。 */
      const cx=Math.min(Math.max(xOf(c.ref)-w/2, nameW-8), Ww-rightW-w+8);
      g.push({ type:'text', left:cx, bottom:2,
        style:{ text:t, fill:tk.tick, font:'10px sans-serif' } });
    }
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip, formatter:p=>{ const r=rows[p.dataIndex];
        return `<b>${r[0]}</b> ${sign(r[1])}<br>${F(r[2])}${c.unit||''} vs. 去年同期 ${F(r[3])}${c.unit||''}`; } },
      grid:{ left:nameW, right:rightW, top:top0, bottom:botPad },
      xAxis:{ type:'value', min:vlo, max:vhi, show:false },
      /* inverse ＝ rows[0] 排最上（category 軸預設由下往上長）。hbar 是先 reverse 資料，
         這裡不能那樣做——graphic 的 midY(i) 跟 series 的 i 必須是同一個索引。 */
      yAxis:{ type:'category', data:rows.map(r=>r[0]), inverse:true, show:false },
      series:[{
        /* value 帶號（不再取絕對值）→ ECharts 自己從 0 往正確方向長。
           圓角只給遠離 0 的那一端：負值圓左、正值圓右，貼著 0 的那端保持方角，
           兩側的條才會像是從同一條基線長出去的。 */
        type:'bar', barWidth:barW, z:2,
        data:rows.map(r=>({ value:r[1],
          itemStyle:{ color:colOf(r[1]),
            borderRadius: r[1]<0 ? [3,0,0,3] : [0,3,3,0] } }))
      }],
      graphic:g   /* ⚠️ 忘了這行，通路名／YoY／金額三欄全部不會畫出來（而且不報錯，只剩四根裸條） */
    };
  }


  /* ── Bar：直柱；c.hl 高亮換色＋值標籤；c.note 右上註記 ────────── */
  if(c.type==='bar'){
    const labels=c.d.map(x=>x[0]), vals=c.d.map(x=>x[1]);
    return {
      animation:true,
      tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, ...tip,
        valueFormatter:v=>F(v)+(c.unit||'') },
      grid:{ left:6, right:6, top: (c.note||c.labelAll)?26:12, bottom:0, containLabel:true },  /* 左右等寬 → 留白對稱 */
      /* interval:0 → 四個庫齡區間都要出現。ECharts 的 auto 在窄面板會隔一個藏一個，
         而這裡藏掉的正好是「180 天+」——那是整張圖的重點（死貨），不能省。
         窄面板（12 欄下探到 1280 後 cs:3 約 281px）字級退一階讓四個標籤排得下。 */
      xAxis:{ type:'category', data:labels, ...axX,
        axisLabel:{...axX.axisLabel, interval:0, fontSize: W < 300 ? 10 : 11} },
      yAxis:{ type:'value', ...axY,
        axisLabel: c.labelAll ? {show:false} : axY.axisLabel },  /* 值已標在柱上 → 藏 Y 軸刻度 */
      series:[{
        type:'bar', barMaxWidth:46,
        data: vals.map((v,i)=>({ value:v,
          itemStyle:{ color: c.multi?tk.dv[i%5]:(i===c.hl?tk.dv[2]:tk.dv[0]),
            opacity: i===c.hl?1:(c.multi?0.92:0.82), borderRadius:[4,4,0,0] },
          label: (i===c.hl||c.labelAll)?{ show:true, position:'top',
            color: i===c.hl?tk.dv[2]:tk.tick, fontSize:11, fontWeight:600,
            formatter:F(v)+(c.labelAll?(c.unit||''):'') }:{ show:false } }))
      }],
      graphic: c.note?[{ type:'text', right:6, top:6,
        style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } }]:[]
    };
  }

  /* ── Stackbar：單一 100% 堆疊橫條；每段＝一類別，段內標 %、圖例列名稱。
       適合「各部分佔整體幾成」的組成型資料（商品線貢獻/庫別分配）。 */
  if(c.type==='stackbar'){
    /* 圖例關掉一段 → **分母跟著扣掉**，剩下的重新正規化撐滿整條（使用者拍板）。
       原本的行為是壞的：ECharts 只是把那一段藏起來，xAxis.max 仍是原始總額，
       於是右側留下一塊沒人解釋的空白，而剩下四段的 % 還是照原始總額算——
       實測關掉「配件」後圖上是 42+16+13+10＝81%，一張自稱「佔比」的圖加不到 100。
       ⚠️ 所以 total／xAxis.max／段內標籤／懸浮窗四處**必須共用同一個分母**，
       改任何一處都要四處一起改，否則就會回到「加不到 100」那個狀態。
       sel 由 legendselectchanged 事件帶進來（見 renderCharts），沒有時＝全選。 */
    const on = x => !sel || sel[x[0]] !== false;
    const shown = c.d.filter(on);
    const total = shown.reduce((s,x)=>s+x[1],0)||1;
    /* 標籤門檻要跟著版位寬度換算：同一個百分比在 cs:3 只有 cs:6 一半的像素。
       用實際可用寬度回推——「名稱 NN%」約需 58px、「NN%」約需 26px。 */
    const plotW=(c.cs||4)/12*1430-40;
    const needName=58/plotW*100, needPct=26/plotW*100;
    return {
      animation:true,
      /* 懸浮窗第二行＝該品類的**最熱銷單品 ＋ 它的業績**（c.d 第 3、4 欄，可省略）。
         圖上只畫得出「這一類佔幾成」，但看到「服裝 42%」的下一個問題必然是「是哪一款在撐」。
         放在懸浮窗而不是圖上：段內標籤在 cs:3 只有 329px，連類別名都要靠門檻換算才塞得下。 */
      tooltip:{ trigger:'item', ...tip,
        formatter:p=>{ const r=c.d[p.seriesIndex]||[];
          return `<b>${p.seriesName}</b> ${(p.value/total*100).toFixed(1)}% · ${F(p.value)}${c.unit||''}`
            + (r[2]?`<br><span style="color:${tk.tick}">最熱銷 </span>${r[2]} · ${F(r[3])}${c.unit||''}`:''); } },
      /* selected 要回寫，否則 setOption(notMerge) 重建後圖例會全部回到選取狀態 */
      legend:{ data:c.d.map(x=>x[0]), selected: sel||undefined, bottom:2, left:'center',
        itemWidth:9, itemHeight:9,
        icon:'roundRect', itemGap:12, textStyle:{color:tk.body,fontSize:11} },
      grid:{ left:4, right:4, top:12, bottom:34, containLabel:false },
      xAxis:{ type:'value', max:total, show:false },   /* max ＝ 現行分母 → 剩下的段自動撐滿 */
      yAxis:{ type:'category', data:[''], show:false },
      series: c.d.map((x,i)=>{
        const pct=x[1]/total*100;   /* 分母同上；被關掉的段 ECharts 自己不畫，pct 不會用到 */
        /* c.tint ＝ 每段的色階索引（選用，與 c.d 同長）。不給時沿用 dv[i%5] 的**分類**配色。
           ⚠️ **有序分桶不能用分類配色**：貨齡 <30／30–90／90–180／180+ 這種有大小關係的
              四段，用四個不相干的色相會被讀成四個無關的類別，而且 dv[i%5] 剛好把 coral
              （全站的「該處理」色）發給了 90–180，把最該警示的 180+ 染成粉紅。
              給 tint 就能自己決定哪一段吃 coral。
           ⚠️ 不用透明度階梯做漸層：段內標籤是白字，淡色段上的白字過不了對比。 */
        const ti = c.tint && c.tint[i];
        /* c.fill ＝ 讓單列堆疊條隨面板高度長高（選用）。預設 90 是為 rs:2 調的，
           放進 rs:3／rs:4 會變成一條細帶浮在大片空白中間。上限 150 是避免在 2560
           上長成一塊沒有意義的色磚。 */
        const bw = c.fill ? Math.min(150, Math.max(80, Math.round((H||0)*0.45))) : 90;
        return { name:x[0], type:'bar', stack:'total', barWidth:bw, data:[x[1]],
          itemStyle:{ color:tk.dv[ti!=null?ti:i%5], borderColor:tk.paper, borderWidth:1.5 },
          label:{ show:true, position:'inside', color:'#fff', fontSize:11, fontWeight:600,
            formatter: pct>=needName ? `${x[0]} ${pct.toFixed(0)}%`
                     : (pct>=needPct ? `${pct.toFixed(0)}%` : '') } };
      })
    };
  }

  /* ── Hbar：橫排；ci 配色（ci=9 哨兵警示）；c.ref 參考線；末端值 ── */
  if(c.type==='hbar'){
    const src=pickRows(c, H).d;                         /* c.topN 時只取頭尾；沒設就是全份 */
    const rows=[...src].reverse();                      /* reverse → 第一名排最上 */
    const cc=[tk.dv[0],tk.dv[2],tk.dv[4]];
    const colAt=ci=> ci===9?tk.warn:(cc[ci]||tk.dv[0]);
    return {
      animation:true,
      /* ── r[3] ＝ 補貨在途（選用）：{q:件數, eta:"8/12"} 或 {q, late:逾期天數} ──────
         2026-07-31 併入，原本是獨立的「在途待收」半圓面板。為什麼要併：
         「這款剩 3.2 天」的下一句必然是「補的貨到了沒」，兩張分開的圖等於要讀者
         自己在腦裡接因果；而原本那張半圓只給得出兩個數字（在途總額、逾期佔比），
         答不出「逾期的是哪幾張單、會害哪幾款斷貨」。併進來之後兩個問題在同一列答完。
         ⚠️ 沒有 r[3] 的 hbar（週轉最差品類）完全不受影響——標籤與右邊距都會退回原樣。 */
      /* ⚠️ **r[3] 是一個被兩種資料共用的槽**，靠形狀分辨，不要再往裡面塞第三種：
           陣列 `[[標籤,值],…]` → 明細列（檔期設定：期間／機制／門檻／通路）
           物件 `{q,eta|late}`  → 補貨在途（上面那段）
         上一輪在 openDrill 的 cols[i][3] 上踩過同一個坑：**擴充共用槽之前先確認那個
         位置沒人用**，兩種形狀撞在一起是靜默的（會印出「補貨 undefined 件」，不報錯）。
         用 Array.isArray 當判別式，因為補貨那個物件永遠不會是陣列。 */
      tooltip:{ trigger:'item', ...tip, formatter:p=>{ const r=rows[p.dataIndex], e=r[3];
        const ext = !e ? ''
          : Array.isArray(e)
            ? e.map(([k,v])=>`<br><span style="color:${tk.tick}">${k}　</span>${v}`).join('')
            : (e.late!=null
              ? `<br>補貨 ${F(e.q)} 件 — 已逾期 ${e.late} 天`
              : `<br>補貨 ${F(e.q)} 件 — 預計 ${e.eta} 到`);
        return `<b>${r[0]}</b> ${F(r[1])}${c.unit||''}${r[2]===9?' — 系統斷層，非真實表現':''}${ext}`; } },
      /* 右邊距只要容得下末端值（「27 天」）＝ 46。
         ⚠️ 2026-08-03：曾經是 `src.some(r=>r[3])?132:46`——補貨在途印在條末時要 132px。
            小字改成只在懸浮窗之後那 86px 全部還給條長，退回單一值。 */
      grid:{ left:6, right:46, top: c.note?26:(c.ref?18:8), bottom:6, containLabel:true },
      /* 軸上限用**顯示中的**那幾列算，不是整份清單——否則 1366 只畫 4 列時，
         軸還被清單裡沒畫出來的那些值撐著，條子會全部縮短。 */
      xAxis:{ type:'value', max: Math.max(...src.map(x=>x[1]), c.ref||0)*1.06,
        splitLine:{lineStyle:{color:tk.grid,type:'dashed'}}, axisLabel:{show:false},
        axisLine:{show:false}, axisTick:{show:false} },
      yAxis:{ type:'category', data:rows.map(r=>r[0]), axisLine:{show:false},
        axisTick:{show:false},
        axisLabel:{color:tk.body,fontSize:11,interval:0} },   /* interval:0 → 矮面板也不省略店櫃名 */
      series:[{
        type:'bar', barMaxWidth:18,
        data: rows.map(r=>({ value:r[1],
          itemStyle:{ color:colAt(r[2]), opacity:r[2]===9?0.85:0.9, borderRadius:[0,4,4,0] } })),
        /* 條末只印可售天數（千分位：排行的 4,820 萬）。
           ⚠️ 2026-08-03：補貨在途原本用 rich 分段印在天數右邊（`27 天　補 1,200 件・8/12 到`），
              整組移除、**改成只在懸浮窗**。理由是條末那一串把一列變成三件事，
              而且只有前六款掛得到 r[3]，於是同一欄有的列兩段、有的列一段，
              右緣參差得像資料缺漏。天數是主角，補貨是追問時才需要的上下文。
              r[3] 的資料照舊掛著（tooltip 在讀），拿掉的只是常駐標籤。 */
        label:{ show:true, position:'right', color:tk.text, fontSize:11, fontWeight:600,
          formatter:p=>F(rows[p.dataIndex][1])+(c.unit||'') },
        /* ⚠️ markLine 必須 animation:false。它靠動畫展開，而動畫走 requestAnimationFrame——
           兩種情況會讓它停在「塌成一點」的初始狀態，線不見、只剩標籤掉在塌陷處（實測
           「100%」從圖頂跑到圖底）：
             ① headless 的 --virtual-time-budget 下 rAF 不推進（deltabar 也踩過，見該處註解）；
             ② c.topN 的圖進了 _pxlay，每次 resize 都 setOption(notMerge) 整段重建，
                markLine 因此重跑動畫——真實瀏覽器裡則是每拉一次視窗閃一下。
           參考線是靜態註記，本來就沒有動畫的必要。 */
        /* c.refLab ＝ 參考線標籤覆寫（選用，語意同 deltabar 的 refLab）。
           ⚠️ 2026-08-03 加的，起因是促銷頁兩張 ROI 圖：`unit:""` 時預設標籤只印「1」，
              而條末標的是 2.35／1.98／1.05，那個孤零零的「1」會被讀成 x 軸刻度而不是
              損益分界。有單位的圖（斷貨風險「7 天」、週轉最差「90 天」）不受影響，
              它們的預設標籤本來就講得清楚——所以是覆寫而不是改預設。 */
        markLine: c.ref?{ silent:true, symbol:'none', animation:false,
          lineStyle:{ color:tk.tick, type:'dashed', width:1 },
          label:{ show:true, position:'end', color:tk.tick, fontSize:10,
            formatter:c.refLab||(c.ref+(c.unit||'')) },
          data:[{ xAxis:c.ref }] }:undefined
      }],
      graphic: c.note?[{ type:'text', right:6, top:6,
        style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } }]:[]
    };
  }

  /* ── Donut：c.d=[名稱,金額]，%由金額自動算；tooltip 同時給 %與金額。
       c.half   → 半圓甜甜圈（幻影切片補滿下半圈、放大弧體，圖例走底部）。
       c.ci     → 逐片指定顏色（dv 索引；-1＝淡底，給「其餘/背景」那一片用）。 */
  if(c.type==='donut'){
    const half=c.half, total=c.d.reduce((s,x)=>s+x[1],0)||1;
    const colAt=i=> c.ci ? (c.ci[i]===-1 ? tk.soft : tk.dv[c.ci[i]]) : tk.dv[i%5];
    /* hover ＝**整片變色**（非只描外框）：淺色/亮色模式加深、暗色模式提亮。整片變深後與相鄰片
       形成對比邊界，分隔線自然回來，且是整片 highlight。放大照舊保留。 */
    const shade=(hex,f)=>{ const m=(hex||"").trim().match(/^#([0-9a-f]{6})$/i); if(!m) return hex;
      const n=parseInt(m[1],16), t=f<0?0:255, a=Math.abs(f), ch=v=>Math.round(v+(t-v)*a);
      return `rgb(${ch((n>>16)&255)},${ch((n>>8)&255)},${ch(n&255)})`; };
    const emphCol=col=> shade(col, tk.isDark ? 0.16 : -0.12);
    const data=c.d.map((x,i)=>{ const col=colAt(i);
      return { name:x[0], value:x[1], itemStyle:{color:col}, emphasis:{itemStyle:{color:emphCol(col)}} }; });
    if(half) data.push({ value:total, name:"", silent:true, label:{show:false},
      labelLine:{show:false}, tooltip:{show:false}, itemStyle:{color:"transparent"},
      emphasis:{scale:false} });
    /* 半圓位置一律用實際寬高像素算（resize 由 _pxlay 帶新 W/H 重算）→ 任何螢幕都對齊、
       弧體隨面板高度長大又留邊。cx/cy＝弧心比例；Rout＝外徑 px；sideX＝弧右緣＋間距（圖例/cmp 落點）。 */
    /* 「弧＋右側圖例/數字」整塊水平置中：弧心 x＝W/2 − 半塊寬（塊＝弧直徑＋間距＋圖例約 72px）。 */
    const cy=0.82, Rout=0.75*Math.min(W,H),
          cxPx=Math.round(W/2 - 44),
          sideX=Math.round(cxPx+Rout+16), numX=Math.round(cxPx-26);
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip,
        formatter:p=> p.name?`<b>${p.name}</b> ${(p.value/total*100).toFixed(1)}% · ${F(p.value)}${c.unit||""}`:"" },
      /* 半圓版的留白平衡：弧體受「圖區高度」限制（矮面板只有 ~80px），寬度長不出去，
         若圓心仍固定 37%、圖例貼右緣，左邊會空一大塊。做法是把半徑推到高度容許的極限
         （180% ≒ 佔滿圖區高），再把「弧＋圖例」當一塊置中 → 左右留白才會相等。 */
      /* c.cmp ＝ 把「較某基準變化多少」升格成圖區裡的一組數字（比照半圓 KPI 卡的中欄），
         而不是埋在副標的小灰字裡。圖區只有 59px，弧體又佔掉左半，容不下「圖例＋數字」
         兩者並存 → 有 cmp 時圖例讓位。兩片式 donut 的色義在標題與副標已經講完，
         圖例的資訊量本來就低，但差異數字是老闆要看的。 */
      legend: c.cmp ? {show:false} : { data:c.d.map(x=>x[0]), itemWidth:9, itemHeight:9, icon:"roundRect",
        orient:"vertical", left: half?sideX:undefined, right: half?undefined:2, top:"middle", itemGap:11,
        textStyle:{color:tk.body,fontSize:11} },
      graphic: (()=>{ const G=[];
        /* c.big ＝ 弧心裡的主數字（比照半圓 KPI 卡）。放得進去的前提是把環變薄——
           見下方 radius：有 big 時內徑從 95% 拉到 125%，才挖得出容得下數字的洞。 */
        /* ⚠️ 不要用 textAlign:'center' 配 left ——graphic 的 left 定位的是元素邊界框，
           style 裡的 textAlign 又會把文字繞著 style.x 重畫，兩者打架會讓字跑到別的地方
           （曾經設 left:30% 卻畫到 77%、壓在弧體上）。直接算左上角座標最可靠。
           弧心在 x=30%、y=95%，環內徑 125%（約 37px）→ 字框置中於弧心正上方。 */
        /* 水平置中於弧心（center[0]＝30%）。textAlign:'center' 配 left 會被 ECharts
           重算到別處（實測 left:30%+center 會畫到右邊），所以直接算左上角：
           left ＝ 弧心% − 半個字寬%。實測 instW≈327、"35.4%"≈52px → 30 − 26/327 ≈ 22%。
           big 目前只有庫存頁「在途待收」用（原死貨佔比），內容固定為「XX.X%」五字寬，故可寫定；
           換成別的字寬（例如四字或六字）要重算 numX 的 −26。 */
        if(c.big) G.push({type:'text', left:numX, top:Math.round(cy*H-Rout*0.5),
          style:{ text:c.big, fill:tk.text, font:'600 17px sans-serif' }});
        if(c.cmp){ const m=c.cmp,
            good = m.goodWhenUp ? m.up : !m.up,
            col  = m.v===0 ? tk.tick : (good ? tk.good : tk.bad);
          G.push({type:'text', left:sideX, top:Math.round(cy*H-Rout*0.62), style:{ text:`${m.up?'↑':'↓'}${m.v} 百分點`,
            fill:col, font:'600 13px sans-serif' }},
            {type:'text', left:sideX, top:Math.round(cy*H-Rout*0.62+20), style:{ text:m.lab,
            fill:tk.tick, font:'11px sans-serif' }}); }
        return G; })(),
      series:[{ type:"pie",
        radius: half?[c.big?"115%":"90%","150%"]:["48%","68%"],
        center: half?[cxPx, Math.round(cy*H)]:["30%","50%"],
        startAngle: half?180:90,
        avoidLabelOverlap:true, label:{show:false}, labelLine:{show:false},
        itemStyle:{ borderRadius:3, borderWidth:2, borderColor:tk.paper },
        emphasis:{ scale:true, scaleSize:5 },   /* 整片變色的 itemStyle.color 掛在各 data 上（見 emphCol） */
        data }]
    };
  }

  /* ── Heatmap：二維交叉（如 星期 × 時段）;c.grid[y][x]，第一列 y 顯示在最上。
       c.xp → x 軸標籤前綴（業績的星期軸要「週一/週二」，其他軸留空）。
       c.vm:'bottom' → 色標改橫放在下（窄面板 cs:3 用，直立色標會吃掉 60px 寬）。 */
  if(c.type==='heatmap'){
    const xp=c.xp||'', hr=heatRows(c), hy=hr.y, hg=hr.g;
    /* ── c.norm==='row' ＝ 每列各自正規化成 %（列內加總 100%）──────────────
       為什麼要有這個模式：預設色階吃**絕對金額**（min:0, max:全表最大格），
       只要有一個倉遠小於最大的倉，它整列就會被壓成純白——讀起來是「這列沒資料」，
       而不是「這列金額小」。實測過一次：總倉 77 萬對上最大格 2,150 萬（27.9 倍）整列洗白，
       當時的處理是把總倉整列拿掉。倉別一旦展開到 8 列以上，長尾小倉只會更多，
       靠「拿掉」是撐不住的。
       列正規化之後每列的分母是自己，**不論倉大小都比得了**，色深只講一件事：
       這個倉的貨有多老。這正是標題問的問題（「哪個倉囤的是老貨」）——那是結構問題，
       不是量級問題；量級由 Hero 三格與明細彈窗負責。
       ⚠️ 代價是**畫面上讀不到金額**，所以 tooltip 必須同時給 %與原始金額（見 formatter），
          少了那一半，這張圖就回答不了「所以是多少錢」。 */
    const isRow = c.norm==='row';
    const rowSum = hg.map(r => r.reduce((a,b) => a+b, 0));
    const data=[]; let maxV=0, minV=Infinity;
    hg.forEach((row,yi)=>row.forEach((v,xi)=>{
      const pct = rowSum[yi] ? v/rowSum[yi]*100 : 0, val = isRow ? +pct.toFixed(1) : v;
      data.push([xi,yi,val,v]);              /* 第 4 欄保留原始金額，只給 tooltip 用 */
      if(val>maxV) maxV=val; if(val<minV) minV=val; }));
    /* ⚠️ 列正規化時色階**從資料最小值起跳、不是從 0**。理由是列內佔比天生擠在中段：
       4 欄的話每格平均就是 25%，實測資料落在 4.8–49.2%，若 min 釘在 0，
       所有格子都映射到色階的後半段（≈ iris 以上），整張圖看起來一片深紫、讀不出深淺。
       改成 [minV, maxV] 之後才用得到完整的淺→深。
       絕對金額模式維持 min:0（金額有真實的零點，截掉會誇大差距）；
       佔比模式沒有這個問題——它要比的本來就是「彼此相對」，而且精確值 tooltip 給得到。 */
    const vmMin = isRow ? Math.floor(minV) : 0;
    const ramp = tk.isDark ? [tk.grid, tk.dv[0], '#B9AEFF'] : ['#EEEEFC', tk.dv[0], '#2C1F8F'];
    return {
      animation:false,
      tooltip:{ ...tip,
        /* 懸浮窗偏移到游標右下、貼邊自動翻向 → 不遮住正在看的格子 */
        position:(pt,params,dom,rect,size)=>{
          let x=pt[0]+18, y=pt[1]+18;
          if(x+size.contentSize[0]>size.viewSize[0]) x=pt[0]-size.contentSize[0]-18;
          if(y+size.contentSize[1]>size.viewSize[1]) y=pt[1]-size.contentSize[1]-18;
          return [x,y];
        },
        /* 列正規化時**兩個數字都要給**：% 是圖上的編碼，金額是圖上讀不到的那一半。 */
        formatter:p=> isRow
          ? `${hy[p.data[1]]}・${xp}${c.x[p.data[0]]}<br/><b>${p.data[2]}%</b>　${F(p.data[3])}${c.unit||''}`
          : `${hy[p.data[1]]}・${xp}${c.x[p.data[0]]}<br/><b>${F(p.data[2])}</b>${c.unit||''}` },
      grid: heatGrid(c),
      xAxis:{ type:'category', data:c.x.map(d=>xp+d), splitArea:{show:true},
        axisLine:{show:false}, axisTick:{show:false},
        axisLabel:{color:tk.tick,fontSize:11,margin:8} },
      yAxis:{ type:'category', data:hy, inverse:true, splitArea:{show:true},
        axisLine:{show:false}, axisTick:{show:false},
        axisLabel:{color:tk.tick,fontSize:11,interval:0} },   /* 五個時段標籤都要顯示 */
      /* ⚠️ horizontal 的 visualMap，itemHeight 是**長度**、itemWidth 是**厚度**（不是直覺的那樣）。
         長度隨面板寬走：cs:3 在 1366 是 301px → 126、2560 是 599px → 上限 180。
         寫死 64 時在寬螢幕上是一小截，讀不出漸層的分段。
         bottom:12 把整組往上抬離卡片底緣（配合 heatGrid 的 bottom:40）。 */
      /* ⚠️ **`dimension:2` 一定要寫死。** ECharts 的 visualMap 沒指定 dimension 時吃資料的
         **最後一維**——三元組 [x,y,值] 剛好對；但這裡為了讓 tooltip 拿得到原始金額，
         資料是四元組 [x,y,佔比,金額]，預設就會改用**金額**上色，而 min/max 又是用佔比算的。
         結果是所有金額大於 maxV（≈49）的格子全被夾到最深色：整張圖只有小額的那兩列有層次，
         其餘六列一片深藍。**畫面照樣「看起來像一張熱力圖」，不會報錯、不會有 console 訊息**，
         逐格對照原始金額才查得出來（總倉 [80,70,40,20] 只有 40／20 低於門檻，
         畫面上就正好只有那兩格分得出深淺——那是這個 bug 的指紋）。
         教訓同第八節：不要拿「圖畫出來了」當成畫對了。 */
      visualMap: c.vm==='bottom'
        ? { min:vmMin, max:maxV, dimension:2, calculable:false, orient:'horizontal', bottom:12, left:'center',
            itemWidth:9, itemHeight:Math.round(Math.min(180, Math.max(96, (W||300)*0.42))),
            text:['高','低'], textStyle:{color:tk.tick,fontSize:10},
            inRange:{ color:ramp } }
        : { min:vmMin, max:maxV, dimension:2, calculable:false, orient:'vertical', right:2, top:'center',
            itemWidth:9, itemHeight:70, text:['高','低'], textStyle:{color:tk.tick,fontSize:10},
            inRange:{ color:ramp } },
      series:[{ type:'heatmap', data, itemStyle:{borderColor:tk.paper,borderWidth:2},
        emphasis:{itemStyle:{borderColor:tk.text,borderWidth:1}} }]
    };
  }

  /* ── Treemap：方塊面積＝貢獻;標籤＝名稱＋佔比%（商品線/倉別分配）─────
     ⚠️ `c.tint`（每格的色階索引，選用）同 stackbar 那條：**有序分桶不能用分類配色**，
        預設的 dv[i%5] 會把 coral（全站的「該處理」色）發給中間那一桶。
     ⚠️ `c.d` 第 3 元素 `[[名稱,值],…]` ＝ 該格的細分，**只走懸浮窗、不畫成第二層**。
        ── 走過的死路（2026-08-03，別再試）────────────────────────────────
        真的做過兩層版（`children` ＋ `upperLabel` ＋ `levels` 的 colorSaturation），
        探針截圖直接否決，**1280 與 1920 都不行**，兩個獨立的毛病：
        ① **上層的桶名整個沒渲染出來。** `levels` 的索引是以「根節點 ＝ 0」起算的，
           所以寫進 levels[0] 的設定跑去套在看不見的根上、levels[1] 套在桶上——
           桶那一層既沒拿到 borderWidth 也就沒有色帶空間，upperLabel 靜默不畫。
        ② 就算修好 ①，形式本身也是錯的：cs:3 是 4 桶 × 4 細分 ＝ 16 格，
           **同一個品類名（上衣）會同時出現在兩個桶裡**，而桶名只是頂端一條 17px 色帶——
           讀者分不出哪個「上衣」屬於哪一桶。四條色帶還要吃掉 158px 裡的 68px。
        改走懸浮窗是本檔既有的做法（斷貨風險的補貨在途、商品線的最熱銷單品都是這樣），
        而且避開「同一張卡在兩台螢幕上長得不一樣」那條教訓——細分不隨高度出現或消失。 */
  if(c.type==='treemap'){
    const total=c.d.reduce((s,x)=>s+x[1],0)||1;
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip,
        formatter:p=>{
          const r=c.d.find(x=>x[0]===p.name), kids=r&&Array.isArray(r[2])?r[2]:null;
          return `<b>${p.name}</b> ${F(p.value)}${c.unit||''}（${(p.value/total*100).toFixed(1)}%）`
            + (kids?kids.map(k=>`<br><span style="color:${tk.tick}">${k[0]}　</span>${F(k[1])}${c.unit||''}`).join(''):'');
        } },
      series:[{ type:'treemap', roam:false, nodeClick:false, breadcrumb:{show:false},
        top:2, bottom:2, left:2, right:2, width:'auto', height:'auto',
        itemStyle:{ borderColor:tk.paper, borderWidth:2, gapWidth:2, borderRadius:3 },
        /* ⚠️ `overflow:'break'` 不是可有可無：squarified 佈局會把某一格排成窄高條
           （cs:3 @1280 實測只有 46px 寬），預設的 ellipsis 會把「90–180」截成
           「90–1…」——一個看起來像壞掉的標籤。改成斷行之後那格是「90–」「180」兩行，
           而它本來就是最高的一格，放得下。 */
        label:{ show:true, color:'#fff', fontSize:11, lineHeight:15, overflow:'break',
          formatter:p=>p.name+'\n'+(p.value/total*100).toFixed(0)+'%' },
        data:c.d.map((x,i)=>({ name:x[0], value:x[1],
          itemStyle:{ color:tk.dv[(c.tint && c.tint[i]!=null) ? c.tint[i] : i%5] } })) }]
    };
  }

  /* ── Funnel：降序；iris 越往下越深。格子內只留「層名／人數」兩行（白字＋深色陰影
       確保壓在淺色頂層也讀得清）；逐層流失率移到兩側夾層當註記——內文不再擠第三個數字。
       tooltip 帶男女拆分（c.d 第三元素 [女,男]）。minSize 34%：底層容得下兩行標籤。 */
  if(c.type==='funnel'){
    const n=c.d.length;
    const drop=i=> i===0?null:Math.round((c.d[i-1][1]-c.d[i][1])/c.d[i-1][1]*100);
    const gn=i=> c.d[i][2];   /* [女, 男]，選配 */
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip, formatter:p=>{ const d=drop(p.dataIndex), g=gn(p.dataIndex);
        const cd=c.cmp&&c.cmp.d&&c.cmp.d.length===n?c.cmp.d:null, i=p.dataIndex;
        const cdp=(cd&&i>0)?Math.round((cd[i-1]-cd[i])/cd[i-1]*100):null;
        return `<b>${p.name}</b> ${F(p.value)} 人`
          + (g?`<br>女 ${F(g[0])} 人・男 ${F(g[1])} 人`:'')
          + (d===null?'':`<br>較上一層流失 ${d}%`)
          + (cdp===null?'':`　（${c.cmp.n||'對照'} ${cdp}%・${F(cd[i])} 人）`); } },
      series:[{ type:'funnel', left:'6%', right:'6%', top:8, bottom:8, minSize:'34%',
        sort:'descending', gap:3,
        label:{ show:true, position:'inside', color:'#fff', fontSize:11.5, lineHeight:15,
          textShadowColor:'rgba(16,19,48,.32)', textShadowBlur:3,
          formatter:p=> p.name+'\n'+F(p.value) },
        labelLine:{show:false},
        data:c.d.map((x,i)=>({ name:x[0], value:x[1],
          itemStyle:{ color:tk.dv[0], opacity: n>1?(0.58+i*0.4/(n-1)):0.9 } })) }],
      graphic: funnelDrops(c, tk, H, W)
    };
  }

  /* ── Sankey：兩期之間的「流向」——誰升等、誰降等、誰掉出去。
       節點名一律寫成「期別·名稱」（如 去年·銀卡），因為 ECharts 用 name 當節點 id，
       兩側同名會被併成同一個節點、變成自環而整張圖畫不出來；標籤再切掉期別只顯示名稱。
       節點高度正比於人數，所以**餵進來的量級差距不能太大**：全會員（顧客卡 51 萬 vs
       鑽石卡 2,200，差 233 倍）畫出來鑽石卡會細到看不見——這也正是舊版那張柱狀圖壞掉的
       原因。要嘛限縮族群（本頁只畫銀卡以上），要嘛換圖型。 */
  if(c.type==='sankey'){
    const nm = s => String(s).split('·').pop();
    const col = n => n.tone==='bad' ? tk.bad : tk.dv[(n.c??0)%5];
    return {
      animation:true,
      tooltip:{ trigger:'item', ...tip, formatter:p => p.dataType==='edge'
        ? `${nm(p.data.source)} → <b>${nm(p.data.target)}</b><br>${F(p.value)} 人`
        : `<b>${nm(p.name)}</b> ${F(p.value)} 人` },
      series:[{ type:'sankey', left:6, right:6, top: (c.note||c.cols)?26:10, bottom:8,
        nodeWidth:10, nodeGap:9, nodeAlign:'justify',
        /* 標籤要分邊：全部預設靠右的話，最右那排會整片溢出面板外 */
        data: c.nodes.map(n=>({ name:n.n, depth:n.depth,
          itemStyle:{ color:col(n), borderWidth:0 },
          label:{ position: n.depth===0?'right':'left' } })),
        links: c.links.map(l=>({ source:l[0], target:l[1], value:l[2] })),
        label:{ color:tk.body, fontSize:10, formatter:p=>nm(p.name) },
        lineStyle:{ color:'gradient', opacity:.3, curveness:.5 },
        emphasis:{ focus:'adjacency' } }],
      /* c.cols=[左標,右標]：兩欄頂標，把「去年→今年」這條時間軸點破——沒有它，
         左邊多的「顧客卡升等」來源、右邊多的「降回顧客卡／休眠」去向會被誤讀成
         跟卡別同一類。用 muted 色、當軸標讀，不搶節點。 */
      graphic: (()=>{ const g=[];
        if(c.cols){
          g.push({ type:'text', left:6, top:6,
            style:{ text:c.cols[0], fill:tk.tick, font:'600 10px sans-serif' } });
          g.push({ type:'text', right:6, top:6,
            style:{ text:c.cols[1], fill:tk.tick, font:'600 10px sans-serif', textAlign:'right' } });
        }
        if(c.note) g.push({ type:'text', right:6, top:6,
          style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif', textAlign:'right' } });
        return g; })()
    };
  }

  /* ── Combo：柱（左軸，量體）＋ 線（右軸，比率）雙軸。
       給「量大不代表賺／量小卻貢獻高」這類「兩個單位不同但必須並看」的題目：
       卡別人數 vs 業績貢獻、檔期業績 vs 淨增量佔比。
       line.ref → 右軸畫一條基準虛線（如 0% 損益分界），線掉到線下＝壞消息。 */
  /* ── Combo：柱（左軸，量體）＋ 線（右軸，比率）──────────────────────────
     ⚠️ c.line2 ＝ **第二條線（選用）**，與 line 共用右軸。加它的前提是「兩條線的單位
        相同」——共用一條軸的兩個不同單位是在騙人。目前只有促銷主角在用：
        line ＝ 淨增量佔比（宣稱），line2 ＝ 檔期後衰退（檢驗），都是 %。
     ⚠️ line2 刻意畫成**虛線 ＋ 較細 ＋ 較小的點**：它是拿來檢驗 line 的，不該跟被檢驗的
        那條同樣搶眼。色相也要拉開（預設 dv-2 teal 對 line 的 dv-3 coral）。
     ⚠️ 序列順序是 [柱, 線1, 線2]，tooltip 的單位**必須按索引取**——原本寫的是
        「seriesIndex===0 就是柱、其餘都用 line 的單位」，多一條線之後那個式子會把
        line2 的單位標成 line 的。 */
  if(c.type==='combo'){
    const B=c.bar, L=c.line, L2=c.line2, bc=tk.dv[B.c??0], lc=tk.dv[L.c??2];
    const U=[B.unit||'', L.unit||'', L2?(L2.unit||''):''];
    const mkLine=(S,col,thin)=>({
      name:S.n, type:'line', yAxisIndex:1, data:S.d, smooth:0.35, z:3,
      symbol:'circle', symbolSize: thin?5:6,
      lineStyle:{ width: thin?2:2.5, color:col, type: thin?'dashed':'solid' },
      itemStyle:{ color:col, borderColor:tk.paper, borderWidth:1.5 },
      markLine: S.ref!=null ? { silent:true, symbol:'none',
        data:[{ yAxis:S.ref, label:{show:false},
          lineStyle:{ color:tk.tick, type:'dashed', width:1 } }] } : undefined
    });
    return {
      animation:true,
      tooltip:{ trigger:'axis', axisPointer:{type:'shadow'}, ...tip,
        formatter:p=>`<b>${p[0].axisValue}</b><br>` + p.map(s=>
          `${s.marker}${s.seriesName} <b>${F(s.value)}</b>${U[s.seriesIndex]||''}`
        ).join('<br>') },
      legend:{ show:false },                            /* 圖例走面板頁腳 */
      grid:{ left:6, right:6, top: c.note?26:14, bottom:0, containLabel:true },
      xAxis:{ type:'category', data:c.x, ...axX,
        axisLabel:{ color:tk.tick, fontSize:10, interval:0 } },
      yAxis:[
        { type:'value', ...axY },                       /* 左：柱的量體 */
        { type:'value', ...axY, splitLine:{show:false}, /* 右：線的比率，不重複畫格線 */
          axisLabel:{ color:tk.tick, fontSize:11, formatter:v=>v+(L.unit||'') } }
      ],
      series:[
        { name:B.n, type:'bar', yAxisIndex:0, barMaxWidth:34, data:B.d,
          itemStyle:{ color:bc, opacity:0.78, borderRadius:[4,4,0,0] } },
        mkLine(L, lc, false)
      ].concat(L2 ? [mkLine(L2, tk.dv[L2.c??1], true)] : []),
      /* 靠左——combo 右側有第二條軸，右對齊的註記會壓在右軸刻度上（line/bar 沒有這個問題） */
      graphic: c.note?[{ type:'text', left:6, top:6,
        style:{ text:c.note, fill:tk.dv[2], font:'600 11px sans-serif' } }]:[]
    };
  }

  return { series:[] };                                 /* 未知型別 → 空 option */
}
/* 清單面板。容器留空、由 renderLists 在版面落定後填——列數是面板高度的函數（見 listRows），
   而 chartHTML 這一段跑的時候格子高度還不存在。data-li ＝ D.charts 的索引。 */
const chList = (c, i) => `<div class="rows${c.seg?" dense":""}" data-li="${i}"></div>`;

/* 分段切換列（頁腳）。狀態存在 c._sg 上——M 是模組層級物件，切分頁再回來時選擇還在，
   這是刻意的：老闆把它切到「成本率」看了一輪，跳去庫存再回來不該被重設。 */
const segHTML = c => `<div class="pseg">` + c.seg.map(g =>
  `<span class="sgrp" role="group">` + g.o.map(([v,lab]) =>
    `<button class="sgb" type="button" data-sg="${g.k}" data-sv="${v}"
      aria-pressed="${segOf(c)[g.k]===v}">${lab}</button>`).join("") + `</span>`).join("") + `</div>`;

const segOf = c => (c._sg ||= Object.fromEntries(c.seg.map(g => [g.k, g.def])));

/* 期間鍵 → 副標寫法。切換鈕上是「3月」（省寬度），副標要講清楚是「近 3 個月」。 */
const PER_LAB = {"1":"上月","3":"近 3 個月","6":"近 6 個月","12":"近 12 個月"};
const PER_IX  = {"1":0,"3":1,"6":2,"12":3};

/* 依目前的排序／期間，產出 [名稱, 副註, 主值] 三元組。
   ⚠️ 主值欄跟著排序依據走：排金額時主值是金額、副註放成本率；排成本率時對調。
   排序鍵若沒當主值顯示，使用者會看到「明明在排序卻沒有那一欄」。 */
function listRows(c){
  if(!c.seg) return c.d;                          /* CRM 喚回清單那種：原本就是三元組 */
  const s = segOf(c), ix = PER_IX[s.per];
  const rows = c.d.map(([n, rate, fee]) => [n, rate, fee[ix]]);
  rows.sort((a,b) => s.sort==='rate' ? b[1]-a[1] : b[2]-a[2]);
  return s.sort==='rate'
    ? rows.map(([n,rate,fee]) => [n, `月均 ${fee.toFixed(1)} 萬`, `${rate.toFixed(1)}%`])
    : rows.map(([n,rate,fee]) => [n, `成本率 ${rate.toFixed(1)}%`, `${fee.toFixed(1)} 萬`]);
}

/* 清單版的 topN。pickRows 是給 ECharts 用的（吃 grid 高、扣 note／ref），這裡量的是
   .rows 的 client 高度、單位是 DOM 列高，兩者不共用。
   做法：先用 pitch 估一個 n，填進去之後**實測 scrollHeight**，溢出就往下收——
   估值會因字級／CJK 換行而失準，但「填完再量」是確定性的，面板永遠不會被撐破。 */
function fillList(box, c){
  const all = listRows(c), tn = c.topN;
  let n = all.length;
  if(tn){
    const H = box.clientHeight || 0;
    n = Math.max(tn.min, Math.min(tn.max, all.length, Math.floor(H / (tn.pitch||44))));
  }
  /* c.warnTop：最高值的那幾列，數字染語意警示色。清單已經排序，所以「最高」靠位置就講得
     清楚，色是加強不是唯一編碼（見 .r.hi 的 CSS 註解）。
     ⚠️ 綁值不綁索引 0，因為**會並列**：實測「排序＝成本率」時 YCVC 忠孝SOGO／EM 台中新光／
        EM 南西新光 三家都是 28.5%，只標第一家會讀成「它最高」，那是假的。比對顯示字串
        （已格式化到小數一位）而不是原始數字——畫面上看起來一樣的兩列就該標一樣。
     ⚠️ 也不能綁店櫃名：兩組排序（金額／成本率）切換時最高的那家會換人。 */
  const top = c.warnTop && all.length ? all[0][2] : null;
  const paint = k => { box.innerHTML = all.slice(0, k).map(([a,b,v]) =>
    `<div class="r${top !== null && v === top ? " hi" : ""}"><span class="nm">${a}${b?`<em>${b}</em>`:""}</span>
     <span class="val num">${v}</span></div>`).join(""); };
  paint(n);
  if(tn) while(n > tn.min && box.scrollHeight > box.clientHeight + 1) paint(--n);
  return n;
}

/* Hero 達成率圓（KPI 引擎風格）：iris 進度弧 + 淡白軌，中央數字，caption 在下。
   三個橫排；每個都是獨立的完整物件（深色 hero scope 內）。 */
function gaugeRing(g){
  const S=76, c=S/2, sw=8, r=(S-sw)/2-2, circ=2*Math.PI*r;
  const pct=Math.max(0,Math.min(100,g.v)), dash=circ*pct/100;
  return `<div class="gauge">
    <svg class="gring" viewBox="0 0 ${S} ${S}" role="img" aria-label="${g.label} ${g.v}%">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="${sw}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}"
        transform="rotate(-90 ${c} ${c})"/>
      <text x="${c}" y="${c+1}" text-anchor="middle" class="g-num">${g.v}<tspan class="g-unit">%</tspan></text>
    </svg>
    <span class="g-cap">${g.label}</span>
  </div>`;
}

/* Gauge KPI 卡（大欄網格內，非 hero）：比率對 100% 目標的進度環 + 漲跌，取代數字+sparkline。
   給「離目標還差多少」型指標（達成率）——sparkline 對這種指標沒意義，環才講得清。 */
/* KPI 卡頁首：名稱＋狀態徽章（低於預期／⚠，靠左）＋深入分析 pill（靠右，margin-left:auto）。
   dig 文案為佔位（k.dig），與圖表一起待 golden 294 置換；沒 k.dig 時退回用卡名。 */
function khHTML(k){
  return `<div class="kh">
      <span class="k">${k.k}</span>
      ${k.sent?`<span class="warnicon" title="${k.sent}">${ic("alert","ic sm")}</span>`:""}
      ${k.t?`<span class="tag ${k.t[0]}">${k.t[1]}</span>`:""}
    </div>`;
}
function kpiGauge(k){
  const S=72, c=S/2, sw=8, r=(S-sw)/2-2, circ=2*Math.PI*r;
  const pct=Math.max(0,Math.min(100,parseFloat(k.v))), dash=circ*pct/100;
  const arrow = k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  /* 描邊色改由 class 決定（.kg-track／.kg-fill），不再寫在 stroke 屬性上——
     k.tone 才切得動（見 CSS .kpi-g.kg-warn）。k.note ＝ 環下的絕對量明細行。 */
  return `<div class="kpi kpi-g${k.tone==="warn"?" kg-warn":""}${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="kg-body">
      <svg class="kg-ring" viewBox="0 0 ${S} ${S}" role="img" aria-label="${k.k} ${k.v}%">
        <circle class="kg-track" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}"/>
        <circle class="kg-fill" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}"
          stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}"
          transform="rotate(-90 ${c} ${c})"/>
        <text x="${c}" y="${c+1}" text-anchor="middle" class="kg-num">${k.v}<tspan class="kg-unit">%</tspan></text>
      </svg>
      ${k.note?`<span class="kg-note num">${k.note}</span>`:""}
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
    </div>
  </div>`;
}

/* 分解列卡：大數字＝總量，下面幾列把它拆開（見 CSS .kpi-bd，含為什麼不用進度環）。
   k.rows = [[標籤, 數值, 佔比, warn?], …]；warn 那列整列上警示色。 */
function kpiBreak(k){
  const arrow=k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  const rows=(k.rows||[]).map(r=>`<div class="bd-row${r[3]?" warn":""}">
        <span class="bd-k">${r[0]}</span><span class="bd-v">${r[1]}</span><span class="bd-p">${r[2]}</span>
      </div>`).join("");
  return `<div class="kpi kpi-bd${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="vrow">
      <span class="v num">${k.v}<small>${k.u||""}</small></span>
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
    </div>
    <div class="bd-list">${rows}</div>
  </div>`;
}
/* to-target 進度條卡：大數字即達成率本身，分段條顯示離 100% 目標多遠（比 Gauge 更貼「差多少」）。
   ⚠️ 卡內只有這一個圖形。曾經加過第二個（月達成率小柱），已移除——原因見 CSS .kpi-t 那段。 */
function kpiTarget(k){
  const pct=Math.max(0,Math.min(100,parseFloat(k.v))), N=24, on=Math.round(pct/100*N);
  const arrow=k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  const segs=Array.from({length:N},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
  return `<div class="kpi kpi-t${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <span class="v num">${k.v}<small>${k.u||"%"}</small></span>
    <div class="kt-bar" role="img" aria-label="${k.k} ${k.v}%">${segs}</div>
    <div class="foot">
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
      <span class="kt-tgt">目標 100%</span>
    </div>
  </div>`;
}
/* 近 N 月 mini 長條卡：大數字＋末柱高亮，看短期趨勢（連帶率 UPT 這類）。 */
function kpiMiniBars(k, ki){
  const arrow=k.dc==="u"?ic("up","ic sm"):k.dc==="d"?ic("down","ic sm"):ic("dash","ic sm");
  /* 長條走 ECharts（.plot.kmini），renderCharts 就地 init → 正式懸浮窗顯示每月值 */
  /* .vrow ＝ 大數字｜漲跌｜目標（見 CSS .kpi-mb .vrow）。目標值靠右對齊，
     與上一行右上角的狀態徽章切齊；圖上的虛線只留線不帶標籤（見 miniLineOption）。 */
  return `<div class="kpi kpi-mb${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="vrow">
      <span class="v num">${k.v}<small>${k.u||""}</small></span>
      <span class="delta ${k.dc} num">${arrow}${k.d}</span>
      ${k.ref!=null?`<span class="kt-tgt">${k.refLab||("目標 "+k.ref+(k.u||""))}</span>`:""}
    </div>
    <div class="kt-mini"><div class="plot kmini" data-ki="${ki}"></div></div>
  </div>`;
}
/* 半圓甜甜圈組合卡：左＝當月比率半圓、中＝當月 vs 其他月均的 delta、右＝其他月均值。
   goodWhenUp 預設 false（如在途待收的逾期佔比：上升＝壞→紅）。 */
/* 半圓 KPI 卡：當月與對照期各一條弧，同尺度並排。
   兩條弧的差距若只有幾 pt，在弧上不到 20 度、肉眼分不出來——所以當月弧上再刻一道
   對照期的虛線基準：差距讀成「弧端到刻度的那一小段」，不必比較兩張圖。 */
function kpiHalfDonut(k){
  const cur=parseFloat(k.cur), avg=parseFloat(k.avg);
  const delta=+(cur-avg).toFixed(1), good=k.goodWhenUp?delta>0:delta<0;
  const cls=delta===0?"m":(good?"u":"d");
  const arrow=delta>0?ic("up","ic sm"):delta<0?ic("down","ic sm"):ic("dash","ic sm");
  /* viewBox 上方留 18px 給基準線的標籤，所以 H 比半圓實際需要的高。 */
  const W=100,H=68,sw=9,r=38,cx=50,cy=62,semi=Math.PI*r;
  const path=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  const clamp=v=>Math.max(0,Math.min(100,v));

  /* 對照期基準線：一條跨過弧體、往外突出並帶標籤的徑向線。
     標籤是關鍵——先前只畫一道無標籤的短刻度，看不出那條線代表什麼。 */
  const refLine=pct=>{
    const th=Math.PI*(1-clamp(pct)/100), co=Math.cos(th), si=Math.sin(th);
    /* 外端多伸 7px 當延伸桿，標籤才連得回弧上那一點，不會像浮在空中的字 */
    const r0=r-sw/2-2, r1=r+sw/2+7;
    const px=(rr)=>(cx+rr*co).toFixed(1), py=(rr)=>(cy-rr*si).toFixed(1);
    const tx=Math.max(20,Math.min(W-20,+px(r1)));   /* 夾住標籤，避免貼近兩端時溢出 */
    return `<line x1="${px(r0)}" y1="${py(r0)}" x2="${px(r1)}" y2="${py(r1)}"
        stroke="var(--accent-2)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="${tx}" y="${(+py(r1)-3).toFixed(1)}" text-anchor="middle"
        class="hd-ref">${k.avgLab||"其他月均"}</text>`;
  };
  /* dim＝對照期那條弧，降透明度退到背景，當月仍是主角 */
  const ring=(val,lab,dim,ref)=>{
    const fill=semi*clamp(val)/100;
    return `<div class="hd-ring">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k.k} ${lab} ${val}%">
        <path d="${path}" fill="none" stroke="var(--accent-soft)" stroke-width="${sw}" stroke-linecap="round"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="${sw}" stroke-linecap="round"
          ${dim?'opacity=".45"':""} stroke-dasharray="${fill.toFixed(1)} ${(semi-fill).toFixed(1)}"/>
        ${ref!=null?refLine(ref):""}
        <text x="${cx}" y="${cy-7}" text-anchor="middle"
          class="hd-cur${dim?" dim":""}">${val}<tspan class="hd-u">%</tspan></text>
      </svg>
      <span class="hd-cap">${lab}</span>
    </div>`;
  };

  const avgLab=k.avgLab||"其他月均";
  return `<div class="kpi kpi-hd${k.sent?" sent":""}" style="--cs:${k.cs||3};--rs:${k.rs||1}">
    ${khHTML(k)}
    <div class="hd-body">
      ${ring(cur, k.curLab||"當月", false, avg)}
      <div class="hd-mid">
        <span class="delta ${cls} num">${arrow}${Math.abs(delta)} 百分點</span>
        <span class="hd-cap">較${avgLab}</span>
      </div>
      ${ring(avg, avgLab, true, null)}
    </div>
  </div>`;
}
/* mini 長條卡的 ECharts option：月份為 x 軸、末柱高亮、hover 顯示月份+值。
   yAxis 下探壓低基準 → 放大高低差視覺。 */
function miniBarOption(k, tk){
  const n=k.bars.length, mn=Math.min(...k.bars), mx=Math.max(...k.bars), rg=(mx-mn)||1;
  return {
    animation:false,
    grid:{ left:2, right:2, top:6, bottom:16 },
    tooltip:{ trigger:"axis", axisPointer:{type:"shadow"}, confine:true,
      textStyle:{fontSize:11,color:tk.body}, backgroundColor:tk.paper,
      borderColor:tk.border, borderWidth:1,
      extraCssText:"border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:6px 9px;",
      formatter:p=>`${p[0].axisValue} <b>${p[0].value}</b>${k.u||""}` },
    xAxis:{ type:"category", data:k.bx||k.bars.map((_,i)=>i+1),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:tk.tick,fontSize:9,interval:0,margin:5} },
    yAxis:{ type:"value", show:false, min:mn-rg*0.8, max:mx+rg*0.15 },
    series:[{ type:"bar", barWidth:"58%",
      data:k.bars.map((v,i)=>({ value:v,
        itemStyle:{ color:tk.dv[0], opacity:i===n-1?1:0.32, borderRadius:[2,2,0,0] } })) }]
  };
}

/* mini 折線卡的 ECharts option：比率型「連續惡化」的趨勢（如年度流失率）。
   為什麼這類指標走線不走柱：截斷基準的長條會誇大量級——56.8→62.4 只差 5.6 個
   百分點，壓過基準後末柱卻是首柱的 ~2.2 倍，眼睛讀成「翻倍」。線編碼的是斜率／位置，
   本來就該配壓過的基準，一路往上的斜線才是訊息本身。y 軸上下各留 35% 全距當緩衝，
   線不會貼邊。共用 minibars 的卡殼與 .kmini 機制 → 保留逐月懸浮窗。 */
function miniLineOption(k, tk){
  const n=k.bars.length;
  /* 軸域要把目標線一起框進來：目標若落在資料範圍之外（例如 DOI 目標 120 < 最小值 128），
     不含它的話線會被切掉，而那條線正是「128 到底算好算壞」的唯一判準。 */
  const vs=k.ref!=null?[...k.bars,k.ref]:k.bars;
  const mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  /* 軸界取整到 10 的倍數：讓 ECharts 分出來的刻度是 110／130／150 這種讀得順的數字。
     不取整的話（112.3–149.7）會冒出 115／135 之類的刻度，小卡上多一個位數就擠。 */
  const lo=Math.floor((mn-rg*0.35)/10)*10, hi=Math.ceil((mx+rg*0.35)/10)*10;
  return {
    animation:false,
    /* left 給 y 軸刻度讓位（原本 2）。10px 兩位數字約 17px，留 26 含 margin。
       ⚠️ top 8→4（2026-08-03）：bottom 的 16 是 x 軸標籤（9px ＋ margin 5）要的，收不得；
          top 只是為了讓最高的那個 y 軸刻度不貼邊，4px 就夠。 */
    grid:{ left:k.axis?26:2, right:4, top:4, bottom:16 },
    tooltip:{ trigger:"axis", axisPointer:{type:"line",lineStyle:{color:tk.border}}, confine:true,
      textStyle:{fontSize:11,color:tk.body}, backgroundColor:tk.paper,
      borderColor:tk.border, borderWidth:1,
      extraCssText:"border-radius:8px;box-shadow:0 6px 20px rgba(20,26,51,.14);padding:6px 9px;",
      formatter:p=>`${p[0].axisValue} <b>${p[0].value}</b>${k.u||""}` },
    /* boundaryGap 留 true（預設）：首/末點才不會貼邊，"1月"/"6月" 標籤置中不被裁。 */
    xAxis:{ type:"category", data:k.bx||k.bars.map((_,i)=>i+1),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:tk.tick,fontSize:9,interval:0,margin:5} },
    /* k.axis ＝ 顯示 y 軸刻度。壓過基準的線圖本來就讀不到絕對水位，而 DOI 這種
       「128 天」的指標，水位就是它的意思——只給斜率等於把一半的資訊丟掉。
       splitNumber:2 ＝ 只要兩三個刻度；小卡上刻度多一根就變成格線牆。
       ⚠️ 刻度線關掉（splitLine.show:false）只留數字：這張圖只有 ~48px 高，
          橫線會跟折線本身搶讀者的眼睛。 */
    /* ⚠️ 用 `interval` 寫死三格（下界／中點／上界），不要用 `splitNumber`。
       splitNumber 只是「建議值」，ECharts 仍會依 40px 的間隔上限自行加密刻度，
       然後在小卡上把擠在一起的那幾個**自動隱藏**——實測 110–150 的軸畫出
       110／120／140／150（130 被藏掉），看起來像刻度間距不一致。 */
    yAxis:{ type:"value", show:!!k.axis, min:lo, max:hi, interval:(hi-lo)/2,
      splitLine:{show:false}, axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{ color:tk.tick, fontSize:9, margin:4,
        formatter:v=>Math.round(v) } },
    series:[{ type:"line", data:k.bars, smooth:false, showSymbol:true,
      lineStyle:{color:tk.dv[0],width:2},
      areaStyle:{color:tk.dv[0],opacity:0.10},
      symbol:"circle", symbolSize:(v,p)=>p.dataIndex===n-1?6:0,
      itemStyle:{color:tk.dv[0],borderColor:tk.paper,borderWidth:1.4},
      emphasis:{scale:false},
      /* ⚠️ markLine 必須 animation:false —— 同 hbar 那條的理由：它靠 rAF 展開，
         headless 的 --virtual-time-budget 下 rAF 不推進，線會塌成一點。
         參考線是靜態註記，本來就不需要動畫。 */
      markLine: k.ref!=null?{ silent:true, symbol:'none', animation:false,
        lineStyle:{ color:tk.tick, type:'dashed', width:1 },
        /* ⚠️ 標籤整個關掉（2026-08-03）——「目標 120 天」改印在卡片的 .vrow 右端（見 kpiMiniBars）。
           位置在圖內換過三輪都不對，而三輪都是同一個病因：**圖區根本不夠高**。
             insideEndTop（上）→ 壓到折線，資料整段都在目標線之上；
             insideStartBottom（左下）→ 跟 y 軸最低的刻度擠在同一行；
             insideEndBottom（右下）→ 1366 的可畫帶只有 21px，一個 9px 的字帶就吃掉一半。
           參考線本來就是靜態註記，它的「值」是卡片層級的資訊、不是圖上的資料點——
           搬到文字區之後圖內只留一條虛線，位置問題連同它的成本一起消失。 */
        label:{ show:false },
        data:[{ yAxis:k.ref }] }:undefined }]
  };
}

/* Hero 摘要卡的一格：標籤在上、大數字在下（漲跌章 tone 決定好壞配色，摘要列預設不帶）。
   dual＝升/降兩個數字並列（升降級）。 */
function heroStat(s){
  if(s.dual) return `<div class="hstat">
    <span class="hl">${s.label}</span>
    <div class="hv-dual">
      <span class="up">${ic("up","ic sm")}${s.up}</span>
      <span class="down">${ic("down","ic sm")}${s.down}</span>
    </div>
  </div>`;
  const tri = s.arw==="u"?"triUp":s.arw==="d"?"triDown":null;
  const arrow = tri?`<svg class="tri" viewBox="0 0 24 24" aria-hidden="true">${P[tri]}</svg>`:"";
  const badge = s.note ? `<span class="hbadge ${s.tone||"flat"} num">${arrow}${s.note}</span>` : "";
  /* drill＝這一格可以點開明細。改成真正的 <button>（不是加 click 的 div）——
     鍵盤可及性與 screen reader 語意都由原生元素負責，不用手接 role/tabindex/Enter/Space。
     chevR 是「裡面還有東西」的視覺線索；不用文字，因為 hero 卡寬度是內容驅動的，
     多四個中文字會把整塊量表區推寬。 */
  const tag  = s.drill ? "button" : "div";
  const attr = s.drill
    ? ` class="hstat hstat-drill" type="button" data-drill="${s.drill}" data-metric="${s.metric}"`
      /* 螢幕閱讀器要聽到「點下去會看到什麼」，而彈窗標題就是那句話——取自資料集本身，
         換模組時不會漏改（DRILLS 宣告在彈窗那一段，但這裡只在 draw() 期間才求值）。 */
      + ` aria-label="${s.label} ${s.v}${s.u||""}，查看${(DRILLS[s.drill]||{}).title||"明細"}"`
    : ` class="hstat"`;
  const chev = s.drill ? ic("chevR","ic dchev") : "";
  return `<${tag}${attr}>
    <span class="hl">${s.label}${s.per?`<span class="hper num">（${s.per}）</span>`:""}${s.partial?`<span class="hpart">進行中</span>`:""}${chev}</span>
    <div class="hrow"><span class="hv num">${s.v}${s.u?`<small>${s.u}</small>`:""}</span>${badge}</div>
    ${s.scope?`<span class="hscope num">${s.scope}${s.vper?`（${s.vper}）`:""}</span>`:""}
  </${tag}>`;
}
/* 頂端混排派發：每項 t=ring→圓環（比率）、t=dual→升降雙值、其餘→數字格（絕對量）。 */
function heroItem(it){
  if(it.t === "ring") return gaugeRing(it);
  if(it.t === "dual") return heroStat({dual:true, up:it.up, down:it.down, label:it.label});
  return heroStat(it);
}
const renderHero = arr => arr.map(heroItem).join("");

/* ============================================================
   render
   ============================================================ */
const chEl    = document.getElementById("charts"),
      gaugesEl= document.getElementById("hero-gauges");

/* 依 12 欄網格模擬自動排版，回傳內容占用的「列數」（含 rs 跨列）。
   draw() 用它算 grid-template-rows —— 之後改 cs/rs 或增減張數都自動對。 */
function gridSpanRows(items, wOf){
  const cols = 12, occ = [];
  const ensure = r => { while(occ.length <= r) occ.push(new Array(cols).fill(false)); };
  for(const it of items){
    const w = Math.min(wOf(it), cols), h = it.rs || 1;
    let placed = false;
    for(let r = 0; !placed; r++){
      ensure(r + h - 1);
      for(let c = 0; c + w <= cols; c++){
        let ok = true;
        for(let dr = 0; dr < h && ok; dr++)
          for(let dc = 0; dc < w; dc++) if(occ[r+dr][c+dc]){ ok = false; break; }
        if(ok){
          for(let dr = 0; dr < h; dr++) for(let dc = 0; dc < w; dc++) occ[r+dr][c+dc] = true;
          placed = true; break;
        }
      }
    }
  }
  return occ.length;
}

/* 統一排版：KPI 卡與圖表同放一張網格。回傳每列的高度設定——
   只要該列含圖表就 1fr（圖需要高度），純 KPI 卡列則 auto（緊湊）。
   items: {cs, rs, chart:bool}，順序＝實際 innerHTML 流。 */
function placeRows(items){
  const cols = 12, occ = [], hasChart = [];
  const ensure = r => { while(occ.length <= r){ occ.push(new Array(cols).fill(false)); hasChart.push(false); } };
  for(const it of items){
    const w = Math.min(it.cs, cols), h = it.rs || 1;
    let placed = false;
    for(let r = 0; !placed; r++){
      ensure(r + h - 1);
      for(let c = 0; c + w <= cols; c++){
        let ok = true;
        for(let dr = 0; dr < h && ok; dr++)
          for(let dc = 0; dc < w; dc++) if(occ[r+dr][c+dc]){ ok = false; break; }
        if(ok){
          for(let dr = 0; dr < h; dr++){
            for(let dc = 0; dc < w; dc++) occ[r+dr][c+dc] = true;
            if(it.chart) hasChart[r+dr] = true;
          }
          placed = true; break;
        }
      }
    }
  }
  return hasChart.map(hc => hc ? "minmax(0,1fr)" : "auto");
}
let page = "業績";

document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => { page = b.dataset.p; draw(); }));

const stripTags = s => String(s).replace(/<[^>]+>/g, "");

/* 每張圖 = 一個 ECharts 實例，就地填進版位格（.plot flex:1，尺寸由格子決定）。
   重繪／切分頁前先 dispose 舊實例（否則實例累積吃記憶體）；尺寸變動只 resize，不重建。 */
/* _byI：data-i → ECharts 實例。⚠️ 不能用 _charts 的索引代替——_charts 尾端還接著
   KPI 卡的小柱實例，兩者的序號對不上。可點圖例要靠這張表找到自己那張圖。 */
let _charts = [], _funnels = [], _pxlay = [], _heats = [], _kmini = [], _byI = {};
function renderCharts(D){
  _charts.forEach(ch => ch.dispose()); _charts = []; _funnels = []; _pxlay = []; _heats = []; _kmini = []; _byI = {};
  const tk = dvTokens();
  chEl.querySelectorAll(".plot[data-i]").forEach(el => {
    const c = D.charts[+el.dataset.i];
    if(!c) return;
    const chart = echarts.init(el, null, { renderer:"svg" });
    /* ⚠️ 用 chart.getHeight() 不是 el.clientHeight——`.plot` 有 padding-bottom:4px，
       clientHeight **含** padding（101）而 ECharts 只畫到 content box（97）。
       拿 clientHeight 去算像素座標，手繪的 graphic 就會比 ECharts 的格線多 4px 可用高度，
       表現成「愈往下偏得愈多」的線性錯位（deltabar 實測 1px/列）。寬度同理。 */
    chart.setOption(buildOption(c, tk, chart.getHeight(), chart.getWidth()));
    _charts.push(chart); _byI[el.dataset.i] = chart;
    if(c.type==='funnel') _funnels.push({chart, el, c});   /* 漏斗流失欄是像素定位 → resize 要帶新高度重對齊 */
    /* _pxlay ＝ 版面本身（不只 graphic）是用 W/H 算出來的圖型 → resize 必須整段重建 option，
       光 ch.resize() 會讓 ECharts 依新尺寸重排格線、但手算的像素座標還停在舊尺寸。
       deltabar 就是這樣錯位過：掛載時 H=101、實際 115，於是通路名依 rowH 20.5 排、
       長條依 rowH 24 排，四列愈往下偏得愈多。 */
    /* c.topN 的圖同樣進 _pxlay：它的**列數**本身是 H 的函數，resize 只 resize 不重建的話，
       視窗拉高了列數也不會跟著變（而且副標會停在舊的「前後各 N 名」）。 */
    if(c.type==='donut' || c.type==='deltabar' || c.topN) _pxlay.push({chart, el, c});
    syncSub(el, c, chart.getHeight());
    if(c.type==='heatmap'){ _heats.push({chart, c}); squareHeat(chart, c); }   /* 格子校正要在算得出像素之後 */
    /* Stackbar 的圖例＝篩選器，不只是開關顯示：關掉一段就把它移出分母、剩下的重新正規化
       撐滿整條。ECharts 內建圖例只會隱藏 series（分母不動 → 右側留白 ＋ % 加不到 100），
       所以要攔下事件、帶著新的 selected 整段重建。
       ⚠️ notMerge:true 是必要的——series 數量與 xAxis.max 都變了，merge 會留下舊值；
       但 notMerge 也會清掉圖例的勾選狀態，所以 buildOption 裡要把 selected 回寫（見該處）。
       ⚠️ 不可以在這裡再 dispatchAction 動圖例，否則會遞迴觸發自己。 */
    if(c.type==='stackbar'){
      const applySel = ev => {
        /* ⚠️ 三個事件都要掛：使用者點圖例走 legendselectchanged，
           但程式用 dispatchAction 走的是 legendselected／legendunselected——
           只掛前者的話，手點有效、程式呼叫無效（探針因此量到「完全沒反應」）。
           事件沒帶 selected 時（部分版本如此）就從 option 讀回來，不要自己記狀態。 */
        const sel = (ev && ev.selected) || ((chart.getOption().legend || [])[0] || {}).selected;
        if(!sel) return;
        chart.setOption(buildOption(c, tk, chart.getHeight(), chart.getWidth(), sel), true);
        /* 分母變了就要講出來——42% 變 52% 而副標還寫「本月佔比」會被當成資料跳動。 */
        const off = Object.values(sel).filter(v => v === false).length;
        const sub = el.closest('.panel')?.querySelector('.sub');
        if(sub) sub.textContent = c.s + (off ? `（已排除 ${off} 項）` : '');
      };
      ['legendselectchanged','legendselected','legendunselected'].forEach(e => chart.on(e, applySel));
    }
  });
  /* KPI 卡內的 mini 長條（連帶率 UPT 等）也走 ECharts → 有正式懸浮窗。 */
  _kmini = [];
  chEl.querySelectorAll(".plot.kmini[data-ki]").forEach(el => {
    const k = (D.kpi || [])[+el.dataset.ki];
    if(!k || !k.bars) return;
    _kmini.push({ el, k, chart:null });
  });
  mountKMini(tk);
}

/* 容器高度為 0 時 init 會拿到 0×0（ECharts 會警告且畫不出來）→ 跳過，等有高度了再補建。
   已建好的交給 resize()。 */
function mountKMini(tk){
  _kmini.forEach(m => {
    if(m.chart || !m.el.clientHeight) return;
    m.chart = echarts.init(m.el, null, { renderer:"svg" });
    m.chart.setOption(m.k.type === "miniline" ? miniLineOption(m.k, tk) : miniBarOption(m.k, tk));
    _charts.push(m.chart);
  });
}

/* 事件委派：重繪會換掉 .plot 內容，逐一綁 listener 會漏綁；
   tooltip 與「深入分析」統一掛在 chEl 上，一次搞定、重繪不受影響。 */
chEl.addEventListener("mousemove", e => {
  /* 挑圖模式下整張面板是一個可點的目標，資料點 tooltip 只會干擾 */
  if(document.body.classList.contains("picking")){ hideTip(); return; }
  const t = e.target.closest("[data-tip]");
  t ? showTip(e, t.dataset.tip) : hideTip();
});
chEl.addEventListener("mouseleave", hideTip);
chEl.addEventListener("click", e => {
  /* 〔深入分析〕＝開「選角度」開場：先讓使用者挑這張圖要看哪個角度，選了才成為第一則問句。
     第一個角度＝ c.dig／k.dig，其餘兩句由 DIG_MORE 補上，三句都是 golden 原句或其標記過的變體。 */
  const b = e.target.closest(".dig");
  if(b){ openDig(page, b.dataset.c, [b.dataset.q, ...(DIG_MORE[b.dataset.c] || [])]); return; }
  /* 可點圖例：點一下暫時隱藏／顯示那條序列（line／combo 的圖例走面板頁首頁腳的手刻 HTML，
     ECharts 內建圖例是 show:false）。⚠️ show:false 的 legend **元件仍然存在**，
     legendToggleSelect 照樣生效——這正是「圖例外置、行為內建」能成立的原因，
     不必自己去改 series.data。挑圖模式下停用：此刻整張面板是一個可點的目標。 */
  /* 清單的分段切換（排序依據／期間）。只重排這一張清單，不重畫整頁——
     重畫會讓所有 ECharts 重新掛載、開場動畫整片重跑，切一下排序不該有那種代價。
     挑圖模式下停用（此刻整張面板是一個可點的目標，理由同下方圖例）。 */
  const sg = e.target.closest(".sgb[data-sg]");
  if(sg && !document.body.classList.contains("picking")){
    const panel = sg.closest(".panel"), box = panel && panel.querySelector(".rows[data-li]");
    const l = box && _lists.find(x => x.box === box);
    if(!l) return;
    segOf(l.c)[sg.dataset.sg] = sg.dataset.sv;
    sg.closest(".sgrp").querySelectorAll(".sgb").forEach(b =>
      b.setAttribute("aria-pressed", String(b === sg)));
    syncList(box, l.c);
    return;
  }
  const lg = e.target.closest(".lg[data-lg]");
  if(lg && !document.body.classList.contains("picking")){
    const panel = lg.closest(".panel"), plot = panel && panel.querySelector(".plot[data-i]");
    const chart = plot && _byI[plot.dataset.i];
    if(!chart) return;
    const off = lg.classList.toggle("off");
    lg.setAttribute("aria-pressed", off ? "false" : "true");
    chart.dispatchAction({ type:"legendToggleSelect", name:lg.dataset.lg });
  }
});

/* 視窗/格子尺寸變動 → 只叫 ECharts resize（rAF 去抖，避免縮放時狂重算）。
   漏斗的流失欄是像素定位，高度一變就要用新 clientHeight 重算 graphic 才不會脫齊。 */
let _raf;
new ResizeObserver(() => {
  cancelAnimationFrame(_raf);
  _raf = requestAnimationFrame(() => {
    mountKMini(dvTokens());                     /* 補建先前因容器 0 高而跳過的小柱 */
    _charts.forEach(ch => ch.resize());
    _heats.forEach(h => squareHeat(h.chart, h.c));   /* 格子比例隨面板寬高變 → 每次都要重校 */
    if(_funnels.length || _pxlay.length){ const tk = dvTokens();
      _funnels.forEach(f => f.chart.setOption({ graphic: funnelDrops(f.c, tk, f.chart.getHeight(), f.chart.getWidth()) }));
      /* 半圓／deltabar：用新寬高整段重算（圖例位置、中央數字、弧半徑、欄寬、列高都依 W/H） */
      _pxlay.forEach(f => { f.chart.setOption(buildOption(f.c, tk, f.chart.getHeight(), f.chart.getWidth()), true);
        syncSub(f.el, f.c, f.chart.getHeight()); }); }
    /* 清單的列數同樣是高度的函數（見 fillList）→ 跟 topN 的圖表一起重算，否則拉高視窗
       會出現「圖表多了兩列、旁邊的清單還是五列」。 */
    _lists.forEach(l => syncList(l.box, l.c));
  });
}).observe(chEl);

/* Hero 快捷發問：每個模組三句，全部取自 golden 294（見 chips_golden_mapping.xlsx「HERO」分頁）。
   選句原則是**補大欄圖表的盲區**——坪效、退貨、轉換率、在途到貨、優惠碼、點數這些
   畫面上沒有圖、但主管會問的角度。因此這 12 句多半落到 GENERIC（「新問題 · 完整推理」），
   那正是要示範的另一條路徑；「秒回凍結答案」交由後端檢索決定，前端不再為它挑句。 */
const QC = {
  業績:["我們坪效最高的是哪家店？","上個月退貨對業績影響有多大？","哪個通路轉換率最低？"],
  /* ⚠️ 第 1 句 2026-07-31 換過。原本是 庫存-102（S9）「上週進的貨到底有沒有全部到齊？」，
     選它的理由寫的是「到貨進度沒有圖、在途是盲區」——上一輪加了「在途待收」面板之後
     那個理由就不成立了，而且與該面板的第 1 句 dig（庫存-193，同為 S9）撞在同一件事上。
     換成 **改寫自 庫存-147（S7）**「雙11前要備多少貨才夠？」，補的是畫面上完全沒有的
     前瞻備貨角度（現有的斷貨風險講的是**現有**可售天數，不是**下一檔要進多少**）。
     ⚠️ 這句是**改寫不是原句**（「雙11前」放寬成「接下來的檔期」），
        已列進 chips_golden_mapping.xlsx「工程待辦」待實測 cosine，不當免驗證。
     同列三句 shape：S7（147 改寫）／S4（125）／S10（157），互異 ✓ */
  庫存:["接下來的檔期要備多少貨才夠？","上禮拜缺貨造成多少訂單流失？","有哪些品項庫存數量跟系統對不起來？"],
  促銷:["網紅合作的優惠碼有哪些？轉換率表現有比較好嗎？","上次活動期間客訴有沒有增加？增加多少？","APP 會員用優惠碼的比例，比非會員高多少？"],
  CRM :["點數累積最多的前一百個會員都是誰？","我們官網 EC 的會員跟百貨專櫃的會員重疊有多少？","會員推薦朋友加入的機制，這半年帶進來多少新會員？"]
};
const qcEl = document.getElementById("qchips");
const qcPrev = document.getElementById("qcprev"), qcNext = document.getElementById("qcnext");
qcPrev.innerHTML = ic("chevL"); qcNext.innerHTML = ic("chevR");

/* ── 快捷發問列的捲動：四條路徑 ────────────────────────────────────────────
   這條列在任何螢幕寬度都溢出（見 .qchips 的 CSS 註解），所以捲動不是「加分項」
   而是「拿得到第三顆 chip 的唯一方法」。四條路徑各自服務不同的人：
     ① 捲動鈕 .qcnav —— 唯一看得見的，負責可發現性
     ② 滾輪 deltaY→scrollLeft —— 滑鼠熟手最快
     ③ 拖曳（只限 pointerType==="mouse"）—— 觸控／筆走原生捲動，不要攔
     ④ 鍵盤 Tab —— 瀏覽器自動 scroll-into-view，本來就通，一個字都沒動
   ①②③ 都只在真的溢出時才生效，不溢出時完全不介入。 */

/* 拖過就要吃掉緊接著的那次 click，否則「拖到第三顆」會順手把第二顆送出去。 */
let _qcDrag = null, _qcNoClick = false;

/* 事件掛在容器上，重繪不受影響（比照 chEl 的做法） */
qcEl.addEventListener("click", e => {
  if(_qcNoClick){ _qcNoClick = false; return; }   /* 這次 click 是拖曳的尾巴，不是發問 */
  if(picking()) return;                 /* 挑圖模式下 chips 停用（CSS 也 pointer-events:none，這是雙保險）*/
  const b = e.target.closest(".chip");
  if(b) open_(b.textContent.trim(), null);
});

const qcMax = () => qcEl.scrollWidth - qcEl.clientWidth;

/* 柔邊：淡出寬度＝離該側邊界的捲動距離，夾在 0–24px。
   ⚠️ 不要用「過門檻就切 0↔24px」——那會在邊界瞬間跳一下（滑動時遮罩閃動）。
   漸變版：滑到頭左側自然收成 0（第一顆完整顯示）、滑到底右側收成 0，中段才滿 24。
   捲動鈕的顯隱同一個函式決定：**用實測 scrollWidth，不用斷點猜**——
   沒測過的螢幕尺寸（含未來換字級、換文案）也會自己得出正確答案。 */
function updateQcFade(){
  const max = qcMax(), x = qcEl.scrollLeft;
  qcEl.style.setProperty("--fadeL", Math.max(0, Math.min(24, x)) + "px");
  qcEl.style.setProperty("--fadeR", Math.max(0, Math.min(24, max - x)) + "px");
  qcPrev.classList.toggle("on", x > 1);
  qcNext.classList.toggle("on", x < max - 1);
}
qcEl.addEventListener("scroll", updateQcFade);
addEventListener("resize", updateQcFade);
/* ⚠️ 初次 draw() 時字型可能還沒載入完，文字較窄、量不到溢出（fadeR 會誤判為 0）。
   字型 ready 與 load 後各重算一次。 */
addEventListener("load", updateQcFade);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateQcFade);

/* ① 捲動鈕：一次走 80% 可視寬——不走滿版，留一顆在畫面上當「接續點」，
   不然每按一次整排全換，會失去自己捲到哪裡的感覺。 */
const qcStep = dir => qcEl.scrollBy({
  left: dir * qcEl.clientWidth * .8,
  behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
qcPrev.addEventListener("click", () => qcStep(-1));
qcNext.addEventListener("click", () => qcStep(1));

/* ② 滾輪：垂直滾輪轉橫捲。
   ⚠️ 只在「這一捲真的有被吃掉」時才 preventDefault——捲到底就放行讓事件冒泡，
   否則在 ≤1400（頁面本身可捲）時，游標壓在這條 30px 高的列上會整頁捲不動。
